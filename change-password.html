<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password — SOM-Portal</title>
  <link rel="icon" href="./favicon.ico" type="image/x-icon">
  <script src="./assets/js/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/ui-themes.css">
  <link rel="stylesheet" href="./assets/css/enterprise-refine.css">
  
  <link rel="stylesheet" href="./assets/pages/change-password/change-password.css" data-page-css>
</head>
<body class="auth-page" data-no-global-loader>

<div id="success-overlay">
  <div class="success-body">
    <div class="success-check">
      <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <div class="success-title">Password changed!</div>
    <div class="success-sub">Redirecting to dashboard...</div>
    <div class="success-bar-wrap"><div class="success-bar" id="success-bar"></div></div>
  </div>
</div>

<div class="auth-card auth-cardin" id="pw-card">

  <div class="auth-brand">
    <div class="logo">S</div>
    <div>
      <div class="name">SOM-Portal</div>
      <div class="sub" id="brand-sub">SERVICE OPERATIONS</div>
    </div>
  </div>

  <h1 class="auth-title" id="page-title">Set new<br>password</h1>
  <div style="margin-top: 12px;">
    <div class="auth-pill" id="status-pill">
      <span class="auth-pill-dot"></span>
      <span id="pill-text">First Login</span>
    </div>
  </div>

  <div class="auth-alert" id="pw-alert" style="margin-top: 18px;"></div>

  <form id="pw-form" autocomplete="off">

    <div class="auth-field" id="old-pw-field" style="display:none">
      <label class="auth-lbl" for="old-pw">Current Password</label>
      <div class="auth-input-wrap">
        <input class="auth-input" type="password" id="old-pw" placeholder="รหัสผ่านปัจจุบัน" autocomplete="current-password">
        <button type="button" class="auth-eye" data-target="old-pw" aria-label="Toggle password">
          <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <div class="auth-field">
      <label class="auth-lbl" for="new-pw">New Password</label>
      <div class="auth-input-wrap">
        <input class="auth-input" type="password" id="new-pw" placeholder="อย่างน้อย 8 ตัวอักษร + ตัวเลข" autocomplete="new-password" required>
        <button type="button" class="auth-eye" data-target="new-pw" aria-label="Toggle password">
          <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <div class="auth-strength">
      <div class="auth-strength-track"><div class="auth-strength-fill" id="str-fill"></div></div>
      <div class="auth-strength-row">
        <span class="auth-strength-label" id="str-label">—</span>
        <span class="auth-strength-hint"  id="str-hint"></span>
      </div>
    </div>

    <div class="auth-rules">
      <div class="auth-rule" id="rule-len">
        <div class="auth-rule-dot"><svg viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3"/></svg></div>
        <span>8+ ตัวอักษร</span>
      </div>
      <div class="auth-rule" id="rule-alpha">
        <div class="auth-rule-dot"><svg viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3"/></svg></div>
        <span>มีตัวอักษร a–z</span>
      </div>
      <div class="auth-rule" id="rule-num">
        <div class="auth-rule-dot"><svg viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3"/></svg></div>
        <span>มีตัวเลข 0–9</span>
      </div>
      <div class="auth-rule" id="rule-unique">
        <div class="auth-rule-dot"><svg viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3"/></svg></div>
        <span>ไม่คาดเดาง่าย</span>
      </div>
    </div>

    <div class="auth-field">
      <label class="auth-lbl" for="confirm-pw">Confirm New Password</label>
      <div class="auth-input-wrap">
        <input class="auth-input" type="password" id="confirm-pw" placeholder="พิมรหัสผ่านอีกครั้ง" autocomplete="new-password" required>
        <button type="button" class="auth-eye" data-target="confirm-pw" aria-label="Toggle password">
          <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <button type="submit" class="auth-btn" id="pw-btn">
      <span id="pw-btn-text">Set Password &amp; Continue</span>
      <span class="auth-spinner" id="pw-spinner"></span>
    </button>
  </form>

  <div class="auth-foot">© 2026 SM Team — Ascend Money</div>
</div>

<script src="./assets/js/utils.js"></script>
<script src="./assets/js/auth.js"></script>
<script src="./assets/js/api.js"></script>
<script src="./assets/pages/change-password/change-password.js"></script>

</body>
</html>
