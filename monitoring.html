<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitoring — SOM-Portal</title>
  <link rel="icon" href="./favicon.ico" type="image/x-icon">
  <script src="./assets/js/theme.js"></script>
  <link rel="stylesheet" href="./assets/css/dark.css">
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="stylesheet" href="./assets/css/ui-themes.css">
  <link rel="stylesheet" href="./assets/css/enterprise-refine.css">
  
  <link rel="stylesheet" href="./assets/pages/monitoring/monitoring.css" data-page-css>
</head>
<body>
<div class="app-shell">
  <aside id="sidebar-mount"></aside>
  <div class="main-content" style="display:flex;flex-direction:column;overflow:hidden">

    <header class="topbar">
      <div class="topbar-title">
        <div class="page-title" style="display:flex;align-items:center;gap:8px">
          <span class="live-dot"></span> Monitoring
        </div>
        <div class="page-sub">Grafana Dashboards — Real-time</div>
      </div>
      <div class="topbar-actions">
        <div class="view-toggle">
          <button id="btn-list" class="active" onclick="setView('list')"><i data-icon="layout-list"></i> List</button>
          <button id="btn-wall" onclick="setView('wall')"><i data-icon="layout-grid"></i> Wall 3×3</button>
          <button id="btn-poly" onclick="setView('polywall')"><i data-icon="monitor"></i> Polywall</button>
        </div>
        <div class="wall-zoom-toggle" id="wall-zoom" style="display:none">
          <button data-res="fhd" onclick="setWallRes('fhd')">FHD</button>
          <button data-res="hd"  onclick="setWallRes('hd')">HD</button>
          <button data-res="fit" onclick="setWallRes('fit')">Fit</button>
        </div>
      </div>
    </header>

    <!-- Summary stat bar -->
    <div class="mon-stat-bar" id="mon-stat-bar">
      <div class="mon-stat-item">
        <span class="mon-stat-dot" style="background:#22c55e"></span>
        <div class="mon-stat-col">
          <span class="mon-stat-val" id="stat-total">—</span>
          <span class="mon-stat-lbl">Dashboards</span>
        </div>
      </div>
      <div class="mon-stat-item">
        <div class="mon-stat-col">
          <span class="mon-stat-val" id="stat-sections">—</span>
          <span class="mon-stat-lbl">Sections</span>
        </div>
      </div>
      <div class="mon-stat-item">
        <div class="mon-stat-col">
          <span class="mon-stat-val" id="stat-live">—</span>
          <span class="mon-stat-lbl">Live</span>
        </div>
      </div>
      <div class="mon-search-wrap">
        <div class="mon-search">
          <span class="mon-search-icon"><i data-icon="search"></i></span>
          <input type="text" id="mon-search-input" placeholder="Filter dashboards…" oninput="filterCards(this.value)">
        </div>
      </div>
    </div>

    <!-- LIST VIEW -->
    <main class="page-content" id="list-view" style="flex:1;overflow-y:auto">
      <div id="monitor-sections">
        <div data-skel="cards" data-rows="8"></div>
      </div>
      <div class="mon-no-results" id="mon-no-results">
        <i data-icon="search-x" style="font-size:28px;opacity:.2;display:block;margin-bottom:10px"></i>
        No dashboards match your search
      </div>
    </main>

    <!-- WALL 3×3 VIEW -->
    <section id="wall-view">
      <div class="wall-grid" id="wall-grid"></div>
    </section>

  </div>
</div>

<!-- ── Iframe Overlay ──────────────────────────────────── -->
<div class="iframe-overlay" id="iframe-overlay">
  <div class="iframe-panel">
    <div class="iframe-topbar">
      <span class="live-dot"></span>
      <span class="iframe-topbar-title" id="iframe-title">—</span>
      <span class="iframe-topbar-url" id="iframe-url-label">—</span>
      <button class="iframe-btn iframe-btn-newtab" id="iframe-newtab-btn" title="Open in new tab"><i data-icon="external-link"></i> New Tab</button>
      <button class="iframe-btn iframe-btn-close" onclick="closeIframe()"><i data-icon="x"></i> Close</button>
    </div>
    <iframe id="iframe-el" src="about:blank" allowfullscreen
      allow="fullscreen" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
  </div>
</div>

<script src="./assets/js/utils.js"></script>
<script src="./assets/js/skeletons.js"></script>
<script src="./assets/js/auth.js"></script>
<script src="./assets/js/api.js"></script>
<script src="./assets/js/csrf.js"></script>
<script src="./assets/js/analytics.js"></script>
<script src="./assets/js/analytics-features.js"></script>
<script src="./assets/js/layout.js"></script>
<script src="./assets/js/mobile-nav.js"></script>
<script src="./assets/js/maintenance.js"></script>
<script src="./assets/pages/monitoring/monitoring.js"></script>
</body>
</html>
