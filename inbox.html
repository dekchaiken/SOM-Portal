<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Inbox — SOM-Portal</title>
  <link rel="icon" href="./favicon.ico" type="image/x-icon">
  <script src="./assets/js/theme.js"></script>
  <link rel="stylesheet" href="./assets/css/dark.css">
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="stylesheet" href="./assets/css/ui-themes.css">
  <link rel="stylesheet" href="./assets/css/enterprise-refine.css">

  <link rel="stylesheet" href="./assets/pages/inbox/inbox.css" data-page-css>
</head>
<body>
<div class="app-shell">
  <aside id="sidebar-mount"></aside>

  <div class="main-content">
    <header class="topbar">
      <div class="topbar-title">
        <div class="page-title"><i data-icon="inbox"></i> Team Inbox</div>
        <div class="page-sub" id="inbox-sub">กำลังโหลด…</div>
      </div>
    </header>

    <main class="page-content">
      <div class="inbox-shell">

        <!-- ── Folder pane ───────────────────────────── -->
        <div class="folder-pane">
          <div class="compose-wrap">
            <button class="compose-btn-main" onclick="openCompose('new')">
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none" style="opacity:.7"><path d="M1 11L4.5 10 10.5 4 8 1.5 2 7.5 1 11z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><path d="M8 1.5L10.5 4" stroke="currentColor" stroke-width="1.2"/></svg>
              Compose
            </button>
          </div>
          <div id="folder-list">
            <div class="list-empty" style="padding:20px 0"><span class="spin">⏳</span></div>
          </div>
        </div>

        <!-- ── List pane ─────────────────────────────── -->
        <div class="list-pane">
          <div class="list-toolbar">
            <div class="list-filters">
              <button class="lf-btn active" onclick="setFilter('all',this)">ทั้งหมด</button>
              <button class="lf-btn" onclick="setFilter('unread',this)">ยังไม่อ่าน</button>
              <button class="lf-btn" onclick="setFilter('starred',this)"><i data-icon="star"></i></button>
              <button class="lf-refresh" onclick="refreshList()" title="รีเฟรช">↻</button>
            </div>
            <div class="list-search-wrap">
              <span class="list-search-icon"><i data-icon="search"></i></span>
              <input type="text" id="list-search" placeholder="ค้นหา email…">
            </div>
          </div>
          <div class="list-body" id="email-list"></div>
        </div>

        <!-- ── Reader pane ───────────────────────────── -->
        <div class="reader-pane" id="reader-pane">
          <div class="reader-empty" id="reader-empty">
            <div class="re-icon"><i data-icon="inbox"></i></div>
            <div>เลือก email เพื่ออ่าน</div>
          </div>
          <div id="reader-content" style="display:none;flex:1;min-height:0;display:none;flex-direction:column;overflow:hidden;">
            <div class="reader-header">
              <div class="rh-subject" id="r-subject"></div>
              <div class="rh-actions">
                <button class="rh-btn primary" onclick="openCompose('reply')" title="Reply">↩ Reply</button>
                <button class="rh-btn" onclick="openCompose('replyAll')" title="Reply All">↩↩ Reply All</button>
                <button class="rh-btn" onclick="openCompose('forward')" title="Forward">↪ Forward</button>
                <button class="rh-btn" id="r-star-btn" onclick="toggleStar()" title="Star"><i data-icon="star"></i> Star</button>
                <button class="rh-btn" id="r-read-btn" onclick="toggleRead()" title="Mark"><i data-icon="check"></i> Mark</button>
                <button class="rh-btn danger" onclick="archiveEmail()" title="Archive"><i data-icon="folder"></i> Archive</button>
                <button class="rh-btn danger" onclick="deleteEmail()" title="Trash"><i data-icon="trash"></i> Delete</button>
              </div>
            </div>
            <div class="reader-meta">
              <div class="rm-row"><span class="rm-label">จาก</span><span class="rm-val" id="r-from"></span></div>
              <div class="rm-row"><span class="rm-label">ถึง</span><span class="rm-val" id="r-to"></span></div>
              <div class="rm-row" id="r-cc-row" style="display:none"><span class="rm-label">สำเนา</span><span class="rm-val" id="r-cc"></span></div>
              <div class="rm-row"><span class="rm-label">เมื่อ</span><span class="rm-val" id="r-date"></span></div>
            </div>
            <div class="reader-body" id="r-body"></div>
            <div class="reader-atts" id="r-atts" style="display:none">
              <div style="font-size:11px;color:var(--text-muted);font-weight:700;"><i data-icon="paperclip"></i> ไฟล์แนบ</div>
              <div class="att-list" id="r-att-list"></div>
            </div>
          </div>
        </div>

      </div><!-- /inbox-shell -->
    </main>
  </div>
</div>

<!-- ── Compose Modal (Mode B — centered) ────────────────────────────── -->
<div class="compose-overlay" id="compose-overlay">
  <div class="compose-backdrop" onclick="closeCompose()"></div>
  <div class="compose-box">
    <div class="compose-head">
      <span class="compose-head-title" id="compose-title">เขียน Email ใหม่</span>
      <button onclick="closeCompose()" title="ปิด (draft จะถูกเก็บอัตโนมัติ)"><i data-icon="x"></i></button>
    </div>
    <div class="compose-field">
      <label>To</label>
      <div class="chip-field" id="chip-to-wrap">
        <input class="chip-text" id="chip-to-input" type="text" placeholder="ถึง… (วางหลาย email ได้เลย)" autocomplete="off">
      </div>
    </div>
    <div class="compose-field">
      <label>Cc</label>
      <div class="chip-field" id="chip-cc-wrap">
        <input class="chip-text" id="chip-cc-input" type="text" placeholder="สำเนา…" autocomplete="off">
      </div>
    </div>
    <div class="compose-field" id="cx-subtype-row">
      <label style="min-width:42px">ประเภท</label>
      <select id="cx-subtype">
        <option value="">— เลือก Sub Type เพื่อโหลด Service —</option>
      </select>
    </div>
    <div class="compose-field" id="cx-service-row" style="display:none">
      <label style="min-width:42px">Service</label>
      <select id="cx-service">
        <option value="">— เลือก Service เพื่อเพิ่ม To / CC —</option>
      </select>
    </div>
    <div class="compose-field">
      <label>Subject</label>
      <input type="text" id="compose-subject" placeholder="หัวข้อ…">
    </div>

    <!-- Rich-text toolbar -->
    <div class="cx-toolbar">
      <select class="cx-select" onchange="cxExec('fontName', this.value); this.selectedIndex=0" title="Font">
        <option value="">Font</option>
        <option value="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Sans</option>
        <option value="Georgia,serif">Serif</option>
        <option value="'SF Mono',Menlo,monospace">Mono</option>
      </select>
      <select class="cx-select" onchange="cxExec('fontSize', this.value); this.selectedIndex=0" title="ขนาดตัวอักษร">
        <option value="">Size</option>
        <option value="1">Small</option>
        <option value="3">Normal</option>
        <option value="5">Large</option>
        <option value="6">XL</option>
        <option value="7">XXL</option>
      </select>
      <select class="cx-select" onchange="cxExec('formatBlock', this.value); this.selectedIndex=0" title="Paragraph style">
        <option value="">Style</option>
        <option value="p">Paragraph</option>
        <option value="h2">Heading</option>
        <option value="blockquote">Quote</option>
        <option value="pre">Code</option>
      </select>
      <span class="cx-sep"></span>
      <button type="button" class="cx-tbn" onclick="cxExec('bold')"       title="Bold (⌘B)"><b>B</b></button>
      <button type="button" class="cx-tbn" onclick="cxExec('italic')"     title="Italic (⌘I)"><i>I</i></button>
      <button type="button" class="cx-tbn" onclick="cxExec('underline')"  title="Underline (⌘U)"><u>U</u></button>
      <button type="button" class="cx-tbn" onclick="cxExec('strikeThrough')" title="Strike"><s>S</s></button>
      <span class="cx-sep"></span>
      <label class="cx-color-btn" title="สีตัวอักษร">
        A<span class="cx-color-swatch" id="cx-fc-swatch" style="background:#f26419"></span>
        <input type="color" value="#f26419" id="cx-fc-input" style="display:none"
               onchange="document.getElementById('cx-fc-swatch').style.background=this.value; cxExec('foreColor', this.value)">
      </label>
      <button type="button" class="cx-tbn" onclick="document.getElementById('cx-fc-input').click()" title="เลือกสี"><i data-icon="palette"></i></button>
      <label class="cx-color-btn" title="ไฮไลต์">
        <i data-icon="pencil"></i><span class="cx-color-swatch" id="cx-bg-swatch" style="background:#fde047"></span>
        <input type="color" value="#fde047" id="cx-bg-input" style="display:none"
               onchange="document.getElementById('cx-bg-swatch').style.background=this.value; cxExec('hiliteColor', this.value)">
      </label>
      <span class="cx-sep"></span>
      <button type="button" class="cx-tbn" onclick="cxExec('insertUnorderedList')" title="Bullet list"><i data-icon="circle"></i></button>
      <button type="button" class="cx-tbn" onclick="cxExec('insertOrderedList')"   title="Numbered list">1.</button>
      <button type="button" class="cx-tbn" onclick="cxExec('justifyLeft')"   title="Left"><i data-icon="arrow-left"></i></button>
      <button type="button" class="cx-tbn" onclick="cxExec('justifyCenter')" title="Center">⬌</button>
      <span class="cx-sep"></span>
      <button type="button" class="cx-tbn" onclick="cxInsertLink()"        title="แทรก link"><i data-icon="link"></i></button>
      <button type="button" class="cx-tbn" onclick="document.getElementById('cx-img-input').click()" title="แนบรูป"><i data-icon="image"></i></button>
      <button type="button" class="cx-tbn" onclick="cxExec('insertHorizontalRule')" title="เส้นคั่น">―</button>
      <button type="button" class="cx-tbn" onclick="cxExec('removeFormat')" title="ล้าง format"><i data-icon="x"></i></button>
      <span class="cx-sep"></span>
      <button type="button" class="cx-tbn" onclick="cxExec('undo')" title="Undo (⌘Z)">↶</button>
      <button type="button" class="cx-tbn" onclick="cxExec('redo')" title="Redo">↷</button>
      <input type="file" id="cx-img-input" accept="image/*" style="display:none"
             onchange="cxInsertImageFile(this.files[0]); this.value=''">
    </div>

    <div class="compose-body-wrap">
      <div id="compose-body" contenteditable="true"
           data-placeholder="พิมพ์ข้อความ… วางรูป (Cmd/Ctrl+V) หรือดร็อปไฟล์ก็ได้"
           data-empty="true"></div>
    </div>
    <div class="compose-footer">
      <button id="compose-send-btn" onclick="sendCompose()"><i data-icon="upload"></i> ส่ง</button>
      <button id="compose-discard-btn" onclick="discardDraft()"><i data-icon="trash"></i> ทิ้ง Draft</button>
      <span id="compose-save-ind" data-state="idle"><i data-icon="save"></i> <span id="compose-save-time">—</span></span>
      <span id="compose-status" style="font-size:12px;color:var(--text-muted)"></span>
      <span class="compose-hint"><i data-icon="lightbulb"></i> ปิด (<i data-icon="x"></i>) เก็บ draft ให้อัตโนมัติ · Cmd/Ctrl+V วางรูป · คลิกรูปปรับขนาด</span>
    </div>
  </div>
</div>

<script src="./assets/js/utils.js?v=20260724"></script>
<script src="./assets/js/auth.js?v=20260724"></script>
<script src="./assets/js/api.js?v=20260724"></script>
<script src="./assets/js/analytics.js?v=20260724"></script>
<script src="./assets/js/analytics-features.js?v=20260724"></script>
<script src="./assets/js/layout.js?v=20260724"></script>
<script src="./assets/js/mobile-nav.js"></script>
<script src="./assets/js/maintenance.js?v=20260724"></script>
<script src="./assets/pages/inbox/inbox.js"></script>
