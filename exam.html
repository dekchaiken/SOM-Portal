<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exam — SOM-Portal</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <script src="assets/js/theme.js"></script>
  <link rel="stylesheet" href="assets/css/dark.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/ui-themes.css">
  <link rel="stylesheet" href="./assets/css/enterprise-refine.css">
  
  <link rel="stylesheet" href="./assets/pages/exam/exam.css" data-page-css>
</head>
<body data-no-global-loader>

<div class="ex-shell" id="shell">
  <!-- Start screen (default) -->
  <div id="screen-start" class="ex-start-wrap">
    <div data-skel="list" data-rows="4"></div>
  </div>

  <!-- Exam screen -->
  <div id="screen-exam" style="display:none">
    <div class="ex-bar">
      <div class="et" id="exam-title">…</div>
      <div class="ex-progress-pill" id="progress">0 / 0</div>
      <div class="violations" id="violations"></div>
      <div class="timer" id="timer" style="display:none">--:--</div>
    </div>
    <div class="ex-body" id="exam-body"></div>
    <div class="nav-foot" id="nav-foot">
      <button class="ex-nav-card prev" id="btn-prev" title="ข้อก่อนหน้า">
        <span class="nav-icon"><i data-icon="chevron-left"></i></span>
        <span class="nav-labels">
          <span class="nav-hint">← Previous</span>
          <span class="nav-title-text" id="btn-prev-label">ก่อนหน้า</span>
        </span>
      </button>

      <div class="navmap-wrap">
        <div class="navmap" id="nav-map"></div>
      </div>

      <button class="ex-nav-card next" id="btn-next" title="ข้อถัดไป">
        <span class="nav-labels">
          <span class="nav-hint">Next →</span>
          <span class="nav-title-text" id="btn-next-label">ถัดไป</span>
        </span>
        <span class="nav-icon"><i data-icon="chevron-right"></i></span>
      </button>

      <button class="ex-nav-card submit" id="btn-submit" title="ส่งคำตอบทั้งหมด">
        <span class="nav-icon"><i data-icon="upload"></i></span>
        <span class="nav-labels">
          <span class="nav-hint">Finish</span>
          <span class="nav-title-text">ส่งคำตอบ</span>
        </span>
      </button>
    </div>
  </div>

  <!-- Result screen -->
  <div id="screen-result" style="display:none"></div>
</div>

<script src="assets/js/utils.js"></script>
<script src="assets/js/skeletons.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/api.js"></script>
<script src="./assets/pages/exam/exam.js"></script>

<!-- Borrow result row styles from learn-phase -->

</body>
</html>
