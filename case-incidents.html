<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Case Incidents — SOM-Portal</title>
  <link rel="icon" href="./favicon.ico" type="image/x-icon">
  <script src="./assets/js/theme.js"></script>
  <link rel="stylesheet" href="./assets/css/dark.css">
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="stylesheet" href="./assets/css/ui-themes.css">
  <link rel="stylesheet" href="./assets/css/enterprise-refine.css">

  <link rel="stylesheet" href="./assets/pages/case-incidents/case-incidents.css" data-page-css>
</head>
<body>

<div class="app-shell">
  <aside id="sidebar-mount"></aside>

  <div class="main-content">
    <header class="topbar">
      <div class="topbar-title">
        <div class="page-title"><i data-icon="alert-triangle"></i> Case Incidents</div>
        <div class="page-sub">Jira Incident Tracker</div>
      </div>
      <div class="topbar-actions">
        <a href="https://truemoney.atlassian.net/jira/software/c/projects/SMC/boards/1591"
           target="_blank" rel="noopener" class="btn btn-ghost btn-sm">View Jira Board ↗</a>
        <button class="btn btn-ghost btn-sm" id="btn-refresh-incidents">
          <i data-icon="refresh-cw"></i> Refresh
        </button>
      </div>
    </header>

    <main class="page-content">
      <div class="ci-page">

        <!-- Header -->
        <div class="ci-header">
          <div class="ci-title-block">
            <span class="ci-title">All Incidents</span>
            <span class="incidents-count" id="incidents-count">—</span>
          </div>
        </div>

        <!-- Search -->
        <div class="ci-search">
          <span class="ci-search-icon"><i data-icon="search"></i></span>
          <input type="text" id="incidents-search"
                 placeholder="Search across all incidents (e.g. TTB, Paymentology, Fund-In)…">
          <button id="btn-clear-search" class="ci-clear-btn" title="Clear" style="display:none">
            <i data-icon="x"></i>
          </button>
          <span id="incidents-search-hint" class="ci-search-hint"></span>
        </div>

        <!-- Filters -->
        <div class="ci-filters">
          <div class="filter-group">
            <label class="filter-label">Quick Filter</label>
            <div class="quick-filters">
              <button class="quick-filter-btn active" data-days="all">All</button>
              <button class="quick-filter-btn" data-days="7">7d</button>
              <button class="quick-filter-btn" data-days="15">15d</button>
              <button class="quick-filter-btn" data-days="30">30d</button>
            </div>
          </div>
          <div class="filter-group">
            <label class="filter-label">From</label>
            <input type="date" class="filter-input" id="filter-from-date">
          </div>
          <div class="filter-group">
            <label class="filter-label">To</label>
            <input type="date" class="filter-input" id="filter-to-date">
          </div>
          <div class="filter-group">
            <label class="filter-label">Severity</label>
            <select class="filter-select" id="filter-severity">
              <option value="">All</option>
              <option value="1">S1 — Critical</option>
              <option value="2">S2 — High</option>
              <option value="3">S3 — Low</option>
            </select>
          </div>
          <div class="filter-group">
            <label class="filter-label">Status</label>
            <select class="filter-select" id="filter-status">
              <option value="">All Status</option>
            </select>
          </div>
          <div class="filter-group">
            <label class="filter-label">Detected By</label>
            <select class="filter-select" id="filter-detected">
              <option value="">All</option>
            </select>
          </div>
        </div>

        <!-- List -->
        <div class="incidents-list" id="incidents-list">
          <div class="ci-state">
            <div class="ci-state-icon"><i data-icon="loader"></i></div>
            <div class="ci-state-text">Loading incidents...</div>
          </div>
        </div>

        <!-- Load More -->
        <div class="load-more-container" id="load-more-container" style="display:none">
          <button class="load-more-btn" id="btn-load-more">Load More (50)</button>
        </div>

      </div>
    </main>
  </div>
</div>

<!-- Incident Detail Modal -->
<div class="modal-overlay" id="incident-detail-modal">
  <div class="modal" style="max-width:700px">
    <div class="modal-header">
      <span class="modal-title" id="incident-detail-title">Incident Details</span>
      <button class="btn-close" id="btn-close-incident-detail"><i data-icon="x"></i></button>
    </div>
    <div class="modal-body" id="incident-detail-body" style="max-height:70vh;overflow-y:auto">
      <!-- Populated dynamically -->
    </div>
    <div class="modal-footer">
      <a id="incident-jira-link" href="#" target="_blank" class="btn btn-primary">Open in Jira ↗</a>
      <button class="btn btn-ghost" id="btn-close-incident-detail-2">Close</button>
    </div>
  </div>
</div>

<script src="./assets/js/utils.js"></script>
<script src="./assets/js/skeletons.js"></script>
<script src="./assets/js/auth.js"></script>
<script src="./assets/js/api.js"></script>
<script src="./assets/js/csrf.js"></script>
<script src="./assets/js/analytics.js"></script>
<script src="./assets/js/analytics-features.js"></script>
<script src="./assets/js/layout.js"></script>
<script src="./assets/js/mobile-nav.js"></script>
<script src="./assets/js/maintenance.js"></script>
<script src="./assets/pages/case-incidents/case-incidents.js"></script>

</body>
</html>
