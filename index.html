<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOM-Portal — Login</title>
  <link rel="icon" href="./favicon.ico" type="image/x-icon">
  <script src="./assets/js/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/ui-themes.css">
  <link rel="stylesheet" href="./assets/css/enterprise-refine.css">
  
  <link rel="stylesheet" href="./assets/pages/index/index.css" data-page-css>
</head>
<body class="auth-page" data-no-global-loader>

<div id="success-overlay">
  <div class="success-body">
    <div class="success-check">
      <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <div class="success-title" id="success-name">Welcome back</div>
    <div class="success-sub">Redirecting…</div>
    <div class="success-bar-wrap"><div class="success-bar" id="success-bar"></div></div>
  </div>
</div>

<div class="auth-card auth-cardin" id="login-card">

  <div class="auth-brand">
    <div class="logo">S</div>
    <div>
      <div class="name">SM HUB</div>
      <div class="sub">CENTRALIZE PLATFORM</div>
    </div>
  </div>

  <h1 class="auth-title">Welcome<br>back.</h1>
  <p class="auth-sub" id="login-sub">Sign in to continue to your workspace</p>

  <div class="auth-notice" id="extend-notice">
    Session ใกล้หมดอายุ — กรุณา Login เพื่อต่อ session
  </div>

  <div class="auth-alert" id="login-alert"></div>

  <!-- Account picker: shown when saved accounts exist (mode: picker) -->
  <div id="acct-picker" style="display:none">
    <div class="acct-list" id="acct-list"></div>
    <button type="button" class="acct-another" id="acct-another-btn">
      <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M6 20v-1a6 6 0 0 1 12 0v1"/></svg>
      Use another account
    </button>
  </div>

  <form id="login-form" autocomplete="on">

    <!-- Shown in password-only mode (account selected from picker) -->
    <div id="acct-who-row" class="acct-who" style="display:none">
      <div class="acct-who-avatar" id="acct-who-av"></div>
      <div class="acct-who-info">
        <div class="acct-who-name" id="acct-who-name"></div>
        <div class="acct-who-switch">Switch account</div>
      </div>
      <svg class="acct-who-chv" viewBox="0 0 24 24" width="14" height="14"><polyline points="6 9 12 15 18 9"/></svg>
    </div>

    <div class="auth-field" id="username-field">
      <label class="auth-lbl" for="username">Username</label>
      <div class="auth-input-wrap">
        <input class="auth-input" type="text" id="username" placeholder="Enter username"
               autocomplete="username" required autofocus>
      </div>
    </div>

    <div class="auth-field">
      <label class="auth-lbl" for="password">Password</label>
      <div class="auth-input-wrap">
        <input class="auth-input" type="password" id="password" placeholder="Enter password"
               autocomplete="current-password" required>
        <button type="button" class="auth-eye" id="pw-eye" aria-label="Toggle password">
          <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <div class="auth-row">
      <label class="auth-cb" for="remember-me">
        <input type="checkbox" id="remember-me"> จำฉันไว้ (Remember me)
      </label>
      <a href="./forgot-password.html" class="auth-forgot">ลืมรหัสผ่าน?</a>
    </div>

    <button type="submit" class="auth-btn" id="login-btn">
      <span id="login-btn-text">Sign In</span>
      <span class="auth-spinner" id="login-spinner"></span>
    </button>

  </form>

  <div class="auth-foot">© 2026 SM Team — Ascend Money</div>
</div>

<script src="./assets/js/utils.js"></script>
<script src="./assets/js/auth.js"></script>
<script src="./assets/js/api.js"></script>
<script src="./assets/pages/index/index.js"></script>

</body>
</html>
