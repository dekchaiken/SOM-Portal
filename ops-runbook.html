<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ops Runbook — SOM-Portal</title>
  <link rel="icon" href="./favicon.ico" type="image/x-icon">
  <script src="./assets/js/theme.js"></script>
  <link rel="stylesheet" href="./assets/css/dark.css">
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="stylesheet" href="./assets/css/ui-themes.css">
  <link rel="stylesheet" href="./assets/css/enterprise-refine.css">
  
  <link rel="stylesheet" href="./assets/pages/ops-runbook/ops-runbook.css" data-page-css>
</head>
<body>

<div class="app-shell">
  <aside id="sidebar-mount"></aside>

  <div class="main-content">
    <header class="topbar">
      <div class="topbar-title">
        <div class="page-title"><i data-icon="book-open"></i> Ops Runbook</div>
        <div class="page-sub">ข้อมูล Runbook สำหรับปฏิบัติงาน — Block Biz Rule, Gateway, Restart, Network</div>
      </div>
      <div class="topbar-actions" id="topbar-actions"></div>
    </header>

    <main class="page-content">

      <!-- Tab bar -->
      <div id="rb-tabs-wrap" class="rb-tabs">
        <div class="skel-tab" style="width:140px"></div>
        <div class="skel-tab" style="width:110px"></div>
        <div class="skel-tab" style="width:160px"></div>
        <div class="skel-tab" style="width:120px"></div>
        <div class="skel-tab" style="width:140px"></div>
      </div>

      <!-- Panels -->
      <div id="rb-panels">
        <div class="card">
          <div class="card-body" style="padding:48px;text-align:center;color:var(--text-muted)">
            กำลังโหลด...
          </div>
        </div>
      </div>

    </main>
  </div>
</div>

<!-- ═══ Row Modal ═══ -->
<div class="modal-overlay" id="modal-row">
  <div class="modal-box">
    <div class="modal-header">
      <span class="modal-title" id="row-modal-title">เพิ่มข้อมูล</span>
      <button class="modal-close" id="btn-close-row-modal"><i data-icon="x"></i></button>
    </div>
    <div class="modal-body" id="row-modal-body"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="btn-cancel-row">Cancel</button>
      <button class="btn btn-primary" id="btn-save-row">บันทึก</button>
    </div>
  </div>
</div>

<!-- ═══ Delete Confirm ═══ -->
<div class="modal-overlay" id="modal-delete">
  <div class="modal-box" style="width:360px">
    <div class="modal-header">
      <span class="modal-title" style="color:#dc2626">ลบแถวนี้?</span>
      <button class="modal-close" id="btn-close-del-modal"><i data-icon="x"></i></button>
    </div>
    <div class="modal-body">
      <p style="font-size:13px;margin:0">ต้องการลบแถวนี้ใช่ไหม? ข้อมูลจะหายถาวร</p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="btn-cancel-del">Cancel</button>
      <button class="btn" id="btn-confirm-del" style="background:#dc2626;color:#fff">ลบ</button>
    </div>
  </div>
</div>

<script src="./assets/js/utils.js"></script>
<script src="./assets/js/skeletons.js"></script>
<script src="./assets/js/auth.js"></script>
<script src="./assets/js/api.js"></script>
<script src="./assets/js/csrf.js"></script>
<script src="./assets/js/analytics.js"></script>
<script src="./assets/js/analytics-features.js"></script>
<script src="./assets/js/layout.js"></script>
<script src="./assets/js/mobile-nav.js"></script>
<script src="./assets/js/maintenance.js"></script>
<script src="./assets/pages/ops-runbook/ops-runbook.js"></script>
</body>
</html>
