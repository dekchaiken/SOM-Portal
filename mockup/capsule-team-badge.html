<!DOCTYPE html>
<html lang="en" data-ui="glass" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Capsule Team Badge — Regular vs GenZ</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --orange:#F26419; --orange-dim:rgba(242,100,25,.13); --orange-glow:rgba(242,100,25,.3);
}
html[data-ui="glass"]                    { --bg:#fff5ec; --bg-card:rgba(255,253,250,.85); --text:#1a120a; --text-muted:#9a7c5f; --border:rgba(242,100,25,.16); --nav-bg:linear-gradient(90deg,rgba(242,100,25,.08),transparent 40%,rgba(255,160,80,.05)),rgba(255,252,248,.75); --nb:blur(24px) saturate(180%); }
html[data-ui="glass"][data-theme="dark"] { --bg:#0a0a12; --bg-card:rgba(10,8,22,.88); --text:#f0ece6; --text-muted:rgba(240,230,210,.4); --border:rgba(242,100,25,.24); --nav-bg:linear-gradient(90deg,rgba(242,100,25,.13),transparent 40%,rgba(90,50,210,.09)),rgba(8,10,20,.88); --nb:blur(24px) saturate(180%); }
html[data-ui="enterprise"]               { --bg:#fafafa; --bg-card:#fff; --text:#111827; --text-muted:#6b7280; --border:#e5e7eb; --nav-bg:#fff; --nb:none; }
html[data-ui="enterprise"][data-theme="dark"] { --bg:#0a0c12; --bg-card:#0f1117; --text:#e2e8f0; --text-muted:#94a3b8; --border:#1f2530; --nav-bg:#0f1117; --nb:none; }
html[data-ui="console"]                  { --bg:#08080a; --bg-card:#0d0d10; --text:#f0f0f0; --text-muted:#5a5a62; --border:#1e1e22; --nav-bg:#0d0d10; --nb:none; }
html[data-ui="warm"]                     { --bg:#f5efe5; --bg-card:#fff; --text:#2a2119; --text-muted:#a89b86; --border:#ede6d7; --nav-bg:#fff; --nb:none; }
html[data-ui="warm"][data-theme="dark"]  { --bg:#14100d; --bg-card:#2e2620; --text:#fff5e6; --text-muted:rgba(255,235,200,.5); --border:#3d2f24; --nav-bg:#2e2620; --nb:none; }

body { font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif; background:var(--bg); color:var(--text); transition:background .2s,color .2s; }

/* ─── Shared pill ─── */
.cap {
  display:inline-flex; align-items:center; gap:3px;
  background:var(--nav-bg,var(--bg-card));
  backdrop-filter:var(--nb,blur(20px) saturate(180%));
  -webkit-backdrop-filter:var(--nb,blur(20px) saturate(180%));
  border:1px solid var(--border);
  border-radius:999px; padding:5px 8px 5px 14px;
  box-shadow:0 2px 16px rgba(0,0,0,.1),0 4px 24px rgba(0,0,0,.07);
  position:relative; z-index:2; max-width:calc(100vw - 40px);
  transition:background .2s,border-color .2s;
}
.cap-logo { font-size:13px; font-weight:900; color:var(--orange); margin-right:10px; white-space:nowrap; }
.cap-link  { padding:5px 11px; border-radius:999px; font-size:12.5px; font-weight:500; color:var(--text-muted); border:none; background:transparent; font-family:inherit; white-space:nowrap; cursor:pointer; }
.cap-link.on { background:var(--orange-dim); color:var(--orange); }
.cap-cta { background:var(--orange); color:#fff; border:none; border-radius:999px; padding:6px 14px 6px 10px; font-size:12px; font-weight:700; cursor:pointer; margin-left:6px; display:flex; align-items:center; gap:6px; font-family:inherit; white-space:nowrap; flex-shrink:0; }
.cap-av   { width:18px; height:18px; border-radius:50%; background:rgba(255,255,255,.3); font-size:8px; font-weight:800; display:flex; align-items:center; justify-content:center; }

/* ─── Team badge regular ─── */
.t-badge {
  display:inline-flex; align-items:center; gap:5px; margin-top:6px;
  background:var(--orange-dim); border:1px solid rgba(242,100,25,.2);
  border-radius:999px; padding:2px 10px 2px 6px;
  font-size:9px; font-weight:700; letter-spacing:.07em; text-transform:uppercase;
  color:var(--orange); position:relative; z-index:2;
  animation:bdgIn .35s ease both;
}
.t-dot { width:5px; height:5px; border-radius:50%; background:var(--orange); flex-shrink:0; animation:dotBreath 2.2s ease-in-out infinite; }
@keyframes dotBreath { 0%,100%{box-shadow:0 0 3px var(--orange-glow);transform:scale(1)} 50%{box-shadow:0 0 8px rgba(242,100,25,.7);transform:scale(1.3)} }
@keyframes bdgIn    { from{opacity:0;transform:translateY(-4px)} to{opacity:1;transform:translateY(0)} }

/* ─── GenZ badge ─── */
.gz-badge {
  display:inline-flex; align-items:center; gap:5px; margin-top:6px;
  background:linear-gradient(90deg,rgba(167,139,250,.18),rgba(244,114,182,.14),rgba(251,191,36,.1));
  border:1px solid rgba(167,139,250,.35); border-radius:999px;
  padding:2px 10px 2px 6px; position:relative; z-index:2;
  animation:bdgIn .35s ease both;
}
.gz-dot { width:5px; height:5px; border-radius:50%; flex-shrink:0; background:linear-gradient(135deg,#a78bfa,#f472b6); animation:gzDot 2s ease-in-out infinite; }
@keyframes gzDot { 0%,100%{box-shadow:0 0 4px rgba(167,139,250,.5);transform:scale(1)} 50%{box-shadow:0 0 10px rgba(244,114,182,.75);transform:scale(1.35)} }
.gz-txt { background:linear-gradient(90deg,#a78bfa,#f472b6,#fbbf24); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; font-size:9px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; }

/* GenZ pill border glow */
.cap-gz { box-shadow:0 0 0 1.5px rgba(167,139,250,.4),0 4px 20px rgba(167,139,250,.15),0 8px 32px rgba(0,0,0,.1) !important; }
.logo-gz { background:linear-gradient(90deg,#a78bfa,#f472b6,#fbbf24) !important; -webkit-background-clip:text !important; -webkit-text-fill-color:transparent !important; background-clip:text !important; }
.cta-gz  { background:linear-gradient(90deg,#a78bfa,#f472b6) !important; }


/* ═══════════════════════════════════════════════════════
   SCENE WRAPPER — gives vertical room for the bg effects
═══════════════════════════════════════════════════════ */
.scene {
  display:flex; flex-direction:column; align-items:center;
  position:relative; width:100%; padding:22px 20px 14px;
  overflow:hidden;
}


/* ─────────────────────────────────────────
   REGULAR  R1 — Ambient Glow Pulse
   Soft orange radial halo behind the pill
───────────────────────────────────────── */
.r1::before {
  content:''; position:absolute; z-index:0;
  width:520px; height:110px;
  left:50%; top:50%; transform:translate(-50%,-50%);
  border-radius:50%;
  background:radial-gradient(ellipse 70% 100% at 50% 50%,
    rgba(242,100,25,.22) 0%,
    rgba(242,100,25,.08) 50%,
    transparent 75%);
  animation:glowPulse 3s ease-in-out infinite; pointer-events:none;
}
@keyframes glowPulse {
  0%,100% { opacity:.65; transform:translate(-50%,-50%) scale(1); }
  50%      { opacity:1;   transform:translate(-50%,-50%) scale(1.1); }
}


/* ─────────────────────────────────────────
   GENZ  G1 — Conic Rainbow Spin
   Full-wrap spinning rainbow wheel, blurred
───────────────────────────────────────── */
.g1::before {
  content:''; position:absolute; z-index:0;
  width:600px; height:600px;
  left:50%; top:50%; transform:translate(-50%,-50%);
  border-radius:50%; pointer-events:none;
  background:conic-gradient(from 0deg at 50% 50%,
    #a78bfa 0deg,
    #f472b6 60deg,
    #fbbf24 120deg,
    #34d399 180deg,
    #38bdf8 240deg,
    #818cf8 300deg,
    #a78bfa 360deg);
  opacity:.28;
  filter:blur(28px);
  animation:conicSpin 5s linear infinite;
}
@keyframes conicSpin { to { transform:translate(-50%,-50%) rotate(360deg); } }


/* ─────────────────────────────────────────
   GENZ  G2 — Floating Orbs
   Two big soft blobs drifting side to side
───────────────────────────────────────── */
.g2::before,
.g2::after {
  content:''; position:absolute; z-index:0;
  border-radius:50%; pointer-events:none;
}
.g2::before {
  width:220px; height:220px;
  background:radial-gradient(circle,rgba(167,139,250,.5) 0%,transparent 65%);
  left:calc(50% - 200px); top:50%; transform:translateY(-50%);
  filter:blur(18px);
  animation:orbA 4s ease-in-out infinite;
}
.g2::after {
  width:180px; height:180px;
  background:radial-gradient(circle,rgba(244,114,182,.45) 0%,transparent 65%);
  left:calc(50% + 50px); top:50%; transform:translateY(-50%);
  filter:blur(16px);
  animation:orbB 4s ease-in-out infinite reverse;
}
@keyframes orbA { 0%,100%{transform:translateY(-50%) translateX(0)  scale(1)}   50%{transform:translateY(-50%) translateX(30px) scale(1.2)} }
@keyframes orbB { 0%,100%{transform:translateY(-50%) translateX(0)  scale(1)}   50%{transform:translateY(-50%) translateX(-25px) scale(.85)} }
/* third golden orb via a child div */
.g2-orb3 {
  position:absolute; z-index:0; width:120px; height:120px;
  border-radius:50%; pointer-events:none;
  background:radial-gradient(circle,rgba(251,191,36,.4) 0%,transparent 65%);
  left:50%; top:50%; transform:translate(-50%,-50%);
  filter:blur(14px);
  animation:orbC 3s ease-in-out infinite;
}
@keyframes orbC { 0%,100%{transform:translate(-50%,-50%) scale(1)} 50%{transform:translate(-50%,-50%) scale(1.3)} }


/* ─────────────────────────────────────────
   GENZ  G3 — Holographic Shimmer
   Scanning left-to-right rainbow band + top edge line
───────────────────────────────────────── */
.g3::before {
  content:''; position:absolute; z-index:0;
  inset:0; pointer-events:none;
  background:linear-gradient(90deg,
    transparent      0%,
    rgba(167,139,250,.0)  4%,
    rgba(167,139,250,.35) 16%,
    rgba(244,114,182,.30) 30%,
    rgba(251,191,36,.22)  46%,
    rgba(56,189,248,.22)  60%,
    rgba(167,139,250,.30) 76%,
    rgba(167,139,250,.0)  96%,
    transparent      100%);
  background-size:300% 100%;
  animation:holoScan 3s linear infinite;
}
@keyframes holoScan { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
.g3::after {
  content:''; position:absolute; z-index:1;
  top:0; left:0; right:0; height:2px; pointer-events:none;
  background:linear-gradient(90deg,
    transparent, rgba(167,139,250,.9) 20%, rgba(244,114,182,1) 50%,
    rgba(251,191,36,.85) 80%, transparent);
  background-size:200% 100%;
  animation:holoLine 2s linear infinite;
  box-shadow:0 0 8px rgba(167,139,250,.5),0 0 16px rgba(244,114,182,.3);
}
@keyframes holoLine { 0%{background-position:200% 0} 100%{background-position:-200% 0} }


/* ─── Section labels ─── */
.sec-lbl {
  font-size:10px; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
  color:var(--text-muted); padding:24px 40px 4px; opacity:.7;
}
.sub-lbl {
  font-size:10px; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
  color:var(--text-muted); padding:6px 40px 0; opacity:.5;
}
.gz-lbl {
  padding:24px 40px 4px; font-size:10px; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
  background:linear-gradient(90deg,#a78bfa,#f472b6,#fbbf24);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
}
.div { height:1px; background:var(--border); margin:4px 40px; opacity:.4; }
.fake-row { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:16px 40px 32px; max-width:860px; }
.fc { height:70px; border-radius:12px; background:var(--bg-card); border:1px solid var(--border); }

/* ─── Selector ─── */
.bar {
  position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
  z-index:999; display:flex; align-items:center; gap:5px; flex-wrap:wrap; justify-content:center;
  background:var(--bg-card); border:1px solid var(--border);
  border-radius:20px; padding:9px 14px;
  box-shadow:0 8px 32px rgba(0,0,0,.2); backdrop-filter:blur(20px);
  max-width:96vw; transition:background .2s;
}
.blbl { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--text-muted); }
.bsep { width:1px; height:14px; background:var(--border); }
.bb {
  border:1px solid var(--border); background:transparent; color:var(--text-muted);
  font-size:11px; font-weight:600; padding:4px 10px; border-radius:999px;
  cursor:pointer; transition:all .13s; white-space:nowrap; font-family:inherit;
}
.bb:hover  { border-color:var(--orange); color:var(--orange); }
.bb.on     { background:var(--orange); border-color:var(--orange); color:#fff; }
</style>
</head>
<body>

<!-- ══════════ REGULAR ══════════ -->
<div class="sec-lbl">Regular User</div>
<div class="sub-lbl">R1 · Ambient Glow Pulse</div>
<div class="scene r1">
  <div class="cap">
    <span class="cap-logo team-logo">SM-HUB</span>
    <button class="cap-link on">Home ▾</button>
    <button class="cap-link">Monitor ▾</button>
    <button class="cap-link">MA Tools ▾</button>
    <button class="cap-link">Operations ▾</button>
    <button class="cap-link">Learn ▾</button>
    <button class="cap-cta"><div class="cap-av">W</div><span class="uname">Warapon</span> ▾</button>
  </div>
  <div class="t-badge"><div class="t-dot"></div><span class="team-nm">SM TEAM</span></div>
</div>

<div class="div"></div>

<!-- ══════════ GENZ ══════════ -->
<div class="gz-lbl">✦ GenZ User</div>

<div class="sub-lbl">G1 · Conic Rainbow Spin</div>
<div class="scene g1">
  <div class="cap cap-gz">
    <span class="cap-logo logo-gz team-logo">SM-HUB</span>
    <button class="cap-link on">Home ▾</button>
    <button class="cap-link">Monitor ▾</button>
    <button class="cap-link">MA Tools ▾</button>
    <button class="cap-link">Operations ▾</button>
    <button class="cap-link">GenZ ▾</button>
    <button class="cap-cta cta-gz"><div class="cap-av">W</div><span class="uname">Warapon</span> ▾</button>
  </div>
  <div class="gz-badge"><div class="gz-dot"></div><span class="gz-txt team-gz-nm">SM TEAM · ✦ GenZ</span></div>
</div>

<div class="sub-lbl">G2 · Floating Orbs</div>
<div class="scene g2">
  <div class="g2-orb3"></div>
  <div class="cap cap-gz">
    <span class="cap-logo logo-gz team-logo">SM-HUB</span>
    <button class="cap-link on">Home ▾</button>
    <button class="cap-link">Monitor ▾</button>
    <button class="cap-link">MA Tools ▾</button>
    <button class="cap-link">Operations ▾</button>
    <button class="cap-link">GenZ ▾</button>
    <button class="cap-cta cta-gz"><div class="cap-av">W</div><span class="uname">Warapon</span> ▾</button>
  </div>
  <div class="gz-badge"><div class="gz-dot"></div><span class="gz-txt team-gz-nm">SM TEAM · ✦ GenZ</span></div>
</div>

<div class="sub-lbl">G3 · Holographic Shimmer</div>
<div class="scene g3">
  <div class="cap cap-gz">
    <span class="cap-logo logo-gz team-logo">SM-HUB</span>
    <button class="cap-link on">Home ▾</button>
    <button class="cap-link">Monitor ▾</button>
    <button class="cap-link">MA Tools ▾</button>
    <button class="cap-link">Operations ▾</button>
    <button class="cap-link">GenZ ▾</button>
    <button class="cap-cta cta-gz"><div class="cap-av">W</div><span class="uname">Warapon</span> ▾</button>
  </div>
  <div class="gz-badge"><div class="gz-dot"></div><span class="gz-txt team-gz-nm">SM TEAM · ✦ GenZ</span></div>
</div>

<div class="fake-row">
  <div class="fc"></div><div class="fc"></div><div class="fc"></div>
</div>

<!-- Selector -->
<div class="bar">
  <span class="blbl">Theme</span>
  <div style="display:flex;gap:3px">
    <button class="bb" onclick="setUI('glass',this)">Glass</button>
    <button class="bb" onclick="setUI('enterprise',this)">Enterprise</button>
    <button class="bb" onclick="setUI('console',this)">Console</button>
    <button class="bb" onclick="setUI('warm',this)">Warm</button>
  </div>
  <div class="bsep"></div>
  <button class="bb on" id="md" onclick="toggleMode(this)">Light</button>
  <div class="bsep"></div>
  <span class="blbl">Team</span>
  <div style="display:flex;gap:3px">
    <button class="bb on" onclick="setTeam('SM',this)">SM</button>
    <button class="bb" onclick="setTeam('TMN',this)">TMN</button>
    <button class="bb" onclick="setTeam('PW',this)">PW</button>
    <button class="bb" onclick="setTeam('PLATFORM',this)">Super</button>
  </div>
</div>

<script>
function setUI(ui,btn){
  document.documentElement.setAttribute('data-ui',ui);
  if(ui==='console') document.documentElement.setAttribute('data-theme','dark');
  btn.closest('div').querySelectorAll('.bb').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
}
function toggleMode(btn){
  const dark=document.documentElement.getAttribute('data-theme')==='dark';
  document.documentElement.setAttribute('data-theme',dark?'light':'dark');
  btn.textContent=dark?'Light':'Dark';
}
function setTeam(slug,btn){
  btn.closest('div').querySelectorAll('.bb').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  const hub = slug==='PLATFORM'?'PLATFORM':slug==='OVERSIGHT'?'OVERSIGHT':`${slug}-HUB`;
  const teamTxt = slug==='PLATFORM'?'PLATFORM TEAM':slug==='OVERSIGHT'?'OVERSIGHT TEAM':`${slug} TEAM`;
  document.querySelectorAll('.team-logo').forEach(el=>el.textContent=hub);
  document.querySelectorAll('.team-nm').forEach(el=>el.textContent=teamTxt);
  document.querySelectorAll('.team-gz-nm').forEach(el=>el.textContent=`${teamTxt} · ✦ GenZ`);
}
// default dark
document.documentElement.setAttribute('data-theme','dark');
</script>
</body>
</html>
