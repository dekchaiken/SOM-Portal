<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>GenZ Office — Option 4: Floating Workspaces</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#070a12;overflow:hidden;font-family:'Space Grotesk',sans-serif;
  perspective:1200px;display:flex;align-items:center;justify-content:center;min-height:100vh}

.bg-glow{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 50% 50% at 25% 40%,rgba(167,139,250,.1),transparent),
             radial-gradient(ellipse 40% 40% at 75% 60%,rgba(244,114,182,.08),transparent),
             radial-gradient(ellipse 30% 30% at 50% 20%,rgba(34,211,238,.06),transparent)}

#stars{position:fixed;inset:0;pointer-events:none}

#scene{transform-style:preserve-3d;width:700px;height:500px;position:relative;
  animation:sceneFloat 8s ease-in-out infinite}
@keyframes sceneFloat{0%,100%{transform:rotateX(12deg) rotateY(-5deg)}
  33%{transform:rotateX(10deg) rotateY(3deg)}
  66%{transform:rotateX(14deg) rotateY(-2deg)}}

.workspace{
  position:absolute;width:240px;height:160px;
  transform-style:preserve-3d;
  cursor:pointer;
  transition:transform .4s cubic-bezier(.22,.9,.28,1);
}
.workspace:hover{transform:var(--base-tf) translateZ(30px) scale(1.05)!important}

.ws-card{
  position:absolute;inset:0;
  border-radius:20px;
  border:1.5px solid var(--c,rgba(167,139,250,.4));
  background:linear-gradient(135deg,rgba(255,255,255,.04),rgba(255,255,255,.01));
  backdrop-filter:blur(10px);
  padding:20px;
  transform-style:preserve-3d;
  overflow:hidden;
}
.ws-card::before{
  content:'';position:absolute;inset:0;border-radius:20px;
  background:radial-gradient(circle at 30% 20%,var(--cb,rgba(167,139,250,.15)),transparent 60%);
}
.ws-card::after{
  content:attr(data-letter);
  position:absolute;right:-10px;bottom:-20px;
  font-size:100px;font-weight:900;font-style:italic;
  color:rgba(255,255,255,.025);letter-spacing:-.05em;line-height:1;
  pointer-events:none;
}
/* Top accent line */
.ws-card-line{position:absolute;top:0;left:20px;right:20px;height:2px;
  border-radius:999px;background:var(--c)}
/* Screen glow */
.ws-screen{
  width:80px;height:52px;border-radius:8px;
  background:var(--c);
  margin-bottom:12px;position:relative;overflow:hidden;
  box-shadow:0 0 20px var(--c);
  animation:screenPulse 3s ease-in-out infinite;
}
@keyframes screenPulse{0%,100%{opacity:.85}50%{opacity:1}}
.ws-screen::after{
  content:'';position:absolute;inset:6px;border-radius:4px;
  background:rgba(255,255,255,.05);
  background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0,rgba(255,255,255,.03) 1px,transparent 1px,transparent 4px);
}
.ws-name{font-size:14px;font-weight:800;color:#fff;margin-bottom:3px}
.ws-role{font-size:9px;text-transform:uppercase;letter-spacing:.14em;font-weight:700;color:var(--c)}
.ws-stats{display:flex;gap:14px;margin-top:auto;padding-top:10px;
  border-top:1px solid rgba(255,255,255,.06)}
.ws-stat{font-size:10px;color:rgba(255,255,255,.4)}
.ws-stat b{display:block;font-size:15px;font-weight:800;color:#fff;line-height:1.1}

.ws-dot{position:absolute;top:16px;right:16px;width:8px;height:8px;
  border-radius:50%;background:#22c55e;
  box-shadow:0 0 8px #22c55e;
  animation:dotPulse 2s ease-in-out infinite}
@keyframes dotPulse{0%,100%{box-shadow:0 0 4px #22c55e}50%{box-shadow:0 0 12px #22c55e,0 0 20px rgba(34,197,94,.3)}}

/* Connection lines between workspaces */
#connections{position:absolute;inset:0;pointer-events:none}

/* Center hub */
.center-hub{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) translateZ(20px);
  width:80px;height:80px;border-radius:50%;
  background:rgba(167,139,250,.06);
  border:1.5px solid rgba(167,139,250,.3);
  display:flex;align-items:center;justify-content:center;
  font-size:28px;color:rgba(167,139,250,.6);
  animation:hubSpin 20s linear infinite;
}
@keyframes hubSpin{to{transform:translate(-50%,-50%) translateZ(20px) rotate(360deg)}}

#option-tag{position:fixed;bottom:20px;right:20px;color:rgba(167,139,250,.4);font-size:10px;font-weight:800;letter-spacing:.12em;z-index:10}

header{position:fixed;top:20px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:10}
.badge{background:rgba(10,12,25,.85);border:1px solid rgba(167,139,250,.3);color:#c4b5fd;
  padding:5px 14px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.06em;backdrop-filter:blur(6px)}
</style>
</head>
<body>
<div class="bg-glow"></div>
<canvas id="stars" style="position:fixed;inset:0;pointer-events:none"></canvas>

<header>
  <div class="badge">✦ GenZ Workspaces</div>
  <div class="badge" style="color:#f472b6;border-color:rgba(244,114,182,.3)">Floating HQ</div>
</header>

<div id="scene" style="transform-style:preserve-3d">
  <svg id="connections" style="position:absolute;left:0;top:0;width:700px;height:500px;overflow:visible">
    <defs>
      <linearGradient id="lg1" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#a78bfa" stop-opacity=".4"/>
        <stop offset="100%" stop-color="#f472b6" stop-opacity=".4"/>
      </linearGradient>
    </defs>
    <!-- Lines from center to each workspace -->
    <line x1="350" y1="250" x2="120" y2="120" stroke="url(#lg1)" stroke-width=".8" stroke-dasharray="4 4">
      <animate attributeName="stroke-dashoffset" from="0" to="-16" dur="1s" repeatCount="indefinite"/>
    </line>
    <line x1="350" y1="250" x2="580" y2="120" stroke="url(#lg1)" stroke-width=".8" stroke-dasharray="4 4">
      <animate attributeName="stroke-dashoffset" from="0" to="-16" dur="1.2s" repeatCount="indefinite"/>
    </line>
    <line x1="350" y1="250" x2="120" y2="380" stroke="url(#lg1)" stroke-width=".8" stroke-dasharray="4 4">
      <animate attributeName="stroke-dashoffset" from="0" to="-16" dur="0.9s" repeatCount="indefinite"/>
    </line>
    <line x1="350" y1="250" x2="580" y2="380" stroke="url(#lg1)" stroke-width=".8" stroke-dasharray="4 4">
      <animate attributeName="stroke-dashoffset" from="0" to="-16" dur="1.1s" repeatCount="indefinite"/>
    </line>
  </svg>

  <div class="center-hub">✦</div>

  <!-- Workspace 1 -->
  <div class="workspace" style="left:0;top:20px;--base-tf:rotateY(8deg) rotateX(-6deg);transform:rotateY(8deg) rotateX(-6deg)">
    <div class="ws-card" style="--c:rgba(167,139,250,.6);--cb:rgba(167,139,250,.18)" data-letter="W">
      <div class="ws-card-line" style="background:linear-gradient(90deg,#a78bfa,#c4b5fd)"></div>
      <div class="ws-dot"></div>
      <div class="ws-screen" style="--c:#a78bfa;background:linear-gradient(135deg,#7c3aed,#a78bfa)"></div>
      <div class="ws-name">Warapon</div>
      <div class="ws-role" style="color:#c4b5fd">SM Lead · วรพล</div>
      <div class="ws-stats">
        <div class="ws-stat"><b>12</b>Notes</div>
        <div class="ws-stat"><b>8</b>Kudos</div>
        <div class="ws-stat"><b>🟢</b>Online</div>
      </div>
    </div>
  </div>

  <!-- Workspace 2 -->
  <div class="workspace" style="right:0;top:20px;--base-tf:rotateY(-8deg) rotateX(-6deg);transform:rotateY(-8deg) rotateX(-6deg)">
    <div class="ws-card" style="--c:rgba(244,114,182,.6);--cb:rgba(244,114,182,.18)" data-letter="P">
      <div class="ws-card-line" style="background:linear-gradient(90deg,#db2777,#f472b6)"></div>
      <div class="ws-dot"></div>
      <div class="ws-screen" style="--c:#f472b6;background:linear-gradient(135deg,#9d174d,#f472b6)"></div>
      <div class="ws-name">Piyaphan</div>
      <div class="ws-role" style="color:#fbb6f0">SM Dev · เผือก</div>
      <div class="ws-stats">
        <div class="ws-stat"><b>7</b>Notes</div>
        <div class="ws-stat"><b>5</b>Kudos</div>
        <div class="ws-stat"><b>🟢</b>Online</div>
      </div>
    </div>
  </div>

  <!-- Workspace 3 -->
  <div class="workspace" style="left:0;bottom:20px;--base-tf:rotateY(8deg) rotateX(6deg);transform:rotateY(8deg) rotateX(6deg)">
    <div class="ws-card" style="--c:rgba(34,211,238,.6);--cb:rgba(34,211,238,.18)" data-letter="S">
      <div class="ws-card-line" style="background:linear-gradient(90deg,#0e7490,#22d3ee)"></div>
      <div class="ws-dot"></div>
      <div class="ws-screen" style="--c:#22d3ee;background:linear-gradient(135deg,#0e7490,#22d3ee)"></div>
      <div class="ws-name">Sirirat</div>
      <div class="ws-role" style="color:#67e8f9">SM Ops · น้องหมู</div>
      <div class="ws-stats">
        <div class="ws-stat"><b>5</b>Notes</div>
        <div class="ws-stat"><b>11</b>Kudos</div>
        <div class="ws-stat"><b>🟢</b>Online</div>
      </div>
    </div>
  </div>

  <!-- Workspace 4 -->
  <div class="workspace" style="right:0;bottom:20px;--base-tf:rotateY(-8deg) rotateX(6deg);transform:rotateY(-8deg) rotateX(6deg)">
    <div class="ws-card" style="--c:rgba(251,191,36,.6);--cb:rgba(251,191,36,.18)" data-letter="T">
      <div class="ws-card-line" style="background:linear-gradient(90deg,#b45309,#fbbf24)"></div>
      <div class="ws-dot"></div>
      <div class="ws-screen" style="--c:#fbbf24;background:linear-gradient(135deg,#92400e,#fbbf24)"></div>
      <div class="ws-name">Thammanoon</div>
      <div class="ws-role" style="color:#fde68a">SM Ops · โน</div>
      <div class="ws-stats">
        <div class="ws-stat"><b>4</b>Notes</div>
        <div class="ws-stat"><b>6</b>Kudos</div>
        <div class="ws-stat"><b>🟢</b>Online</div>
      </div>
    </div>
  </div>
</div>

<div id="option-tag">OPTION 4 — Floating 3D Workspaces</div>

<script>
// Starfield
const starCanvas = document.getElementById('stars');
const sc = starCanvas.getContext('2d');
starCanvas.width = innerWidth; starCanvas.height = innerHeight;
for (let i=0;i<120;i++){
  const x=Math.random()*innerWidth, y=Math.random()*innerHeight, r=Math.random()*1.2;
  sc.beginPath(); sc.arc(x,y,r,0,Math.PI*2);
  sc.fillStyle=`rgba(167,139,250,${Math.random()*.4})`; sc.fill();
}

// Mouse tilt
const scene = document.getElementById('scene');
document.addEventListener('mousemove',e=>{
  const mx=(e.clientX/innerWidth-.5)*20;
  const my=(e.clientY/innerHeight-.5)*12;
  scene.style.transform=`rotateX(${12-my}deg) rotateY(${mx}deg)`;
});

// Floating animation for each workspace
document.querySelectorAll('.workspace').forEach((ws,i)=>{
  const delay = i*0.5;
  ws.style.animation = `float${i} ${4+i*.3}s ease-in-out ${delay}s infinite`;
  const kf = `@keyframes float${i}{0%,100%{transform:var(--base-tf) translateZ(0)}50%{transform:var(--base-tf) translateZ(${8+i*2}px)}}`;
  const style = document.createElement('style');
  style.textContent = kf;
  document.head.appendChild(style);
});
</script>
</body>
</html>
