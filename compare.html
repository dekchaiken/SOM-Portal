<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compare Services — SOM-Portal</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/ui-themes.css">
  <link rel="stylesheet" href="assets/css/dark.css">
  <link rel="stylesheet" href="./assets/pages/compare/responsive-fix.css">
  <link rel="stylesheet" href="./assets/css/enterprise-refine.css">

  <link rel="stylesheet" href="./assets/pages/compare/compare.css" data-page-css>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="_sidebar"></aside>
  <div class="main-column">
    <header class="topbar" id="_topbar"></header>
    <main class="content-area">
      <div class="cmp-shell">

        <div class="cmp-header">
          <div class="cmp-title-row">
            <div class="icon-wrap"><i data-icon="bar-chart" style="width:20px;height:20px"></i></div>
            <div>
              <h1>Compare Services</h1>
              <div class="sub">Overlay CPU / MEM / latency / TXN ของ 2-8 services บนแกนเวลาเดียวกัน — เทียบ fleet-wide</div>
            </div>
            <div class="spacer"></div>
            <button class="cmp-btn" onclick="CMP.copyLink()" title="Copy this exact comparison URL">
              <i data-icon="link" style="width:12px;height:12px"></i> Copy link
            </button>
            <button class="cmp-btn" onclick="location.href='service-performance.html'">
              <i data-icon="arrow-left" style="width:12px;height:12px"></i> Back to SP
            </button>
          </div>

          <div class="cmp-svc-row" id="cmp-svc-row">
            <!-- chips injected by _renderChips -->
          </div>

          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding-top:6px;border-top:1px solid var(--border)">
            <div class="cmp-range" id="cmp-range">
              <span class="cmp-range-lbl">Range</span>
              <!-- range buttons injected -->
            </div>
            <div style="font-size:11px;color:var(--sp-text-soft)">
              <span id="cmp-refresh-status">—</span>
              <button class="cmp-btn" style="padding:4px 10px;font-size:11px" onclick="CMP.refresh()">
                <i data-icon="refresh-cw" style="width:11px;height:11px"></i> Refresh
              </button>
            </div>
          </div>
        </div>

        <div id="cmp-content">
          <div class="cmp-empty-state">
            <div class="icon"><i data-icon="bar-chart" style="width:30px;height:30px"></i></div>
            <h2>ยังไม่มี service ให้เทียบ</h2>
            <p>พิมพ์ชื่อ service ในช่องด้านบน → กด Enter → เพิ่มได้สูงสุด 8 services<br>
            หรือเปิด link แบบ <code>compare.html?services=svc-a,svc-b</code></p>
          </div>
        </div>

      </div>
    </main>
  </div>
</div>

<script src="assets/js/theme.js"></script>
<script src="assets/js/utils.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/api.js?v=20260820-alerts"></script>
<script src="assets/js/layout.js?v=20260820-alerts"></script>
<script src="./assets/js/mobile-nav.js"></script>
<script src="assets/js/maintenance.js"></script>
<script src="./assets/pages/compare/compare.js"></script>
