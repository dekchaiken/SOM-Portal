<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navbar Groups — Admin — SOM-Portal</title>
  <link rel="icon" href="../favicon.ico" type="image/x-icon">
  <script src="../assets/js/theme.js"></script>
  <link rel="stylesheet" href="../assets/css/dark.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/ui-themes.css">
  <link rel="stylesheet" href="../assets/css/dev-badge.css">
  <link rel="stylesheet" href="../assets/css/enterprise-refine.css">
  
  <link rel="stylesheet" href="../assets/pages/admin/nav-groups/nav-groups.css" data-page-css>
</head>
<body>
<div class="app-shell">
  <aside id="sidebar-mount"></aside>
  <div class="main-content">
    <header class="topbar">
      <div class="topbar-title">
        <div class="page-title">Navbar Groups</div>
        <div class="page-sub">จัดกลุ่ม nav items ใน top navbar ของทีม</div>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-ghost btn-sm" onclick="resetToDefault()">
          <i data-icon="refresh-cw"></i> Reset default
        </button>
      </div>
    </header>

    <main class="page-content">
      <div class="page-shell">

        <!-- Pool banner — hidden when empty, slides in when items are unassigned -->
        <div class="ng-pool-banner" id="pool-banner"
             ondragover="event.preventDefault()" ondrop="dropOnPool(event)">
          <span class="ng-pool-banner-label"><i data-icon="inbox"></i><br>ยังไม่<br>จัดกลุ่ม</span>
          <div class="ng-pool-banner-items" id="pool-list"></div>
        </div>

        <!-- Groups -->
        <div class="ng-groups" id="groups-container"></div>

        <button class="ng-add-group" onclick="addGroup()">
          <i data-icon="plus"></i> เพิ่มกลุ่มใหม่
        </button>

      </div>
    </main>
  </div>
</div>

<!-- Save bar -->
<div class="ng-save-bar" id="save-bar">
  <div class="ng-dirty-dot"></div>
  <span class="hint" id="save-hint">โหลดข้อมูลอยู่…</span>
  <span style="font-size:11px;color:var(--text-muted)">ลากเพื่อย้าย · คลิกชื่อ group เพื่อแก้ · กด ✕ เพื่อเอา item ออก</span>
  <button class="btn btn-ghost btn-sm" onclick="revertChanges()" style="margin-left:8px">
    <i data-icon="x"></i> ยกเลิก
  </button>
  <button class="btn btn-primary btn-sm" id="save-btn" onclick="saveGroups()" disabled>
    <i data-icon="save"></i> บันทึก
  </button>
</div>

<script src="../assets/js/utils.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/csrf.js"></script>
<script src="../assets/js/analytics.js"></script>
<script src="../assets/js/layout.js"></script>
<script src="../assets/js/mobile-nav.js"></script>
<script src="../assets/js/admin-nav.js"></script>
<script src="../assets/js/maintenance.js"></script>
<script src="../assets/pages/admin/nav-groups/nav-groups.js"></script>
</body>
</html>
