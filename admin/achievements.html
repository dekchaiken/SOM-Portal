<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Achievements — Admin — SOM-Portal</title>
  <link rel="icon" href="../favicon.ico" type="image/x-icon">
  <script src="../assets/js/theme.js"></script>
  <link rel="stylesheet" href="../assets/css/dark.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/ui-themes.css">
  <link rel="stylesheet" href="../assets/css/enterprise-refine.css">
  
  <link rel="stylesheet" href="../assets/pages/admin/achievements/achievements.css" data-page-css>
</head>
<body>

<div class="app-shell">
  <aside id="sidebar-mount"></aside>

  <div class="main-content">
    <header class="topbar">
      <div class="topbar-title">
        <div class="page-title"><i data-icon="trophy"></i> Achievements</div>
        <div class="page-sub">Team leaderboard — คะแนนและ badge รวมทุกคน</div>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-ghost btn-sm" onclick="loadAll()" style="font-size:11px">↺ Refresh</button>
      </div>
    </header>

    <main class="page-content">

      <section class="page-hero">
        <div class="page-hero-mark"><i data-icon="trophy"></i></div>
        <div class="page-hero-body">
          <div class="page-hero-eyebrow">Admin</div>
          <h1>Achievements</h1>
          <p>Team leaderboard — คะแนน, gold/silver/bronze badge รวมทุกคน จาก courses · exams · onboarding</p>
        </div>
      </section>

      <!-- Stats -->
      <div class="ach-stats">
        <div class="ach-stat"><div class="ach-stat-val" id="stat-users">—</div><div class="ach-stat-lbl">Members</div></div>
        <div class="ach-stat"><div class="ach-stat-val" id="stat-pts">—</div><div class="ach-stat-lbl">Total Points</div></div>
        <div class="ach-stat"><div class="ach-stat-val gold"   id="stat-gold">—</div><div class="ach-stat-lbl"><i data-icon="award"></i> Gold</div></div>
        <div class="ach-stat"><div class="ach-stat-val silver" id="stat-silver">—</div><div class="ach-stat-lbl"><i data-icon="award"></i> Silver</div></div>
        <div class="ach-stat"><div class="ach-stat-val bronze" id="stat-bronze">—</div><div class="ach-stat-lbl"><i data-icon="award"></i> Bronze</div></div>
      </div>

      <!-- Filters -->
      <div class="ach-filters">
        <input type="search" id="f-search" placeholder="ค้นหาชื่อ..." oninput="filterTable()">
        <select id="f-role" onchange="filterTable()">
          <option value="">All Roles</option>
          <option value="sm_admin">Admin</option>
          <option value="sm_lead">Lead</option>
          <option value="sm_user">User</option>
          <option value="dev_sm">Dev</option>
        </select>
      </div>

      <!-- Table -->
      <div class="ach-table-wrap">
        <table class="ach-table">
          <thead>
            <tr>
              <th style="width:40px">Rank</th>
              <th>Member</th>
              <th>Points</th>
              <th>Courses</th>
              <th>Exams</th>
              <th>Onboarding</th>
              <th>Badges</th>
              <th style="width:36px"></th>
            </tr>
          </thead>
          <tbody id="ach-tbody">
            <tr class="loading-row"><td colspan="8">กำลังโหลด leaderboard...</td></tr>
          </tbody>
        </table>
      </div>

    </main>
  </div>
</div>

<script src="../assets/js/utils.js"></script>
<script src="../assets/js/skeletons.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/layout.js"></script>
<script src="../assets/js/mobile-nav.js"></script>
<script src="../assets/js/admin-nav.js"></script>
<script src="../assets/pages/admin/achievements/achievements.js"></script>

</body>
</html>
