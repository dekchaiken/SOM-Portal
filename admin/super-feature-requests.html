<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feature Requests — Super Admin</title>
  <link rel="icon" href="../favicon.ico" type="image/x-icon">
  <script src="../assets/js/theme.js"></script>
  <link rel="stylesheet" href="../assets/css/dark.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/ui-themes.css">
  <link rel="stylesheet" href="../assets/css/enterprise-refine.css">
  
  <link rel="stylesheet" href="../assets/pages/admin/super-feature-requests/super-feature-requests.css" data-page-css>
</head>
<body>

<div class="app-shell">
  <aside id="sidebar-mount"></aside>

  <div class="main-content">
    <header class="topbar">
      <div class="topbar-title">
        <div class="page-title"><i data-icon="bell"></i> Feature Requests</div>
        <div class="page-sub">คำขอเปิด feature จาก team admin — approve / deny · super-admin only</div>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-outline btn-sm" onclick="loadFeatureRequests()"><i data-icon="refresh-cw"></i> Refresh</button>
      </div>
    </header>

    <main class="page-content fr-page">

      <section class="page-hero">
        <div class="page-hero-mark"><i data-icon="bell"></i></div>
        <div class="page-hero-body">
          <div class="page-hero-eyebrow">Super Admin</div>
          <h1>Feature Request Queue</h1>
          <p>คำขอ feature ทั้งหมดจากทุกทีม — filter ตามสถานะได้ · เก็บ history ของ approved/denied</p>
        </div>
      </section>

      <div class="fr-section">
        <div class="fr-section-head">
          <div class="fr-section-title">
            Requests
            <span class="cnt" id="requests-count-badge">—</span>
          </div>
          <div class="req-tabs" role="tablist">
            <button class="req-tab active" data-status="pending"  onclick="switchReqTab('pending')">Pending</button>
            <button class="req-tab"        data-status="approved" onclick="switchReqTab('approved')">Approved</button>
            <button class="req-tab"        data-status="denied"   onclick="switchReqTab('denied')">Denied</button>
            <button class="req-tab"        data-status=""         onclick="switchReqTab('')">All</button>
          </div>
        </div>
        <div class="req-list" id="requests-list">
          <div class="fr-empty">Loading…</div>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/utils.js"></script>
<script src="../assets/js/layout.js"></script>
<script src="../assets/js/mobile-nav.js"></script>
<script src="../assets/js/admin-nav.js"></script>

<script src="../assets/pages/admin/super-feature-requests/super-feature-requests.js"></script>
</body>
</html>
