<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Permissions — Super Admin</title>
  <link rel="icon" href="../favicon.ico">
  <script src="../assets/js/theme.js"></script>
  <link rel="stylesheet" href="../assets/css/dark.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/ui-themes.css">
  <link rel="stylesheet" href="../assets/css/enterprise-refine.css">
  
  <link rel="stylesheet" href="../assets/pages/admin/super-team-permissions/super-team-permissions.css" data-page-css>
</head>
<body>

<div class="app-shell">
  <aside id="sidebar-mount"></aside>

  <div class="main-content">
    <header class="topbar">
      <div class="topbar-title">
        <div class="page-title"><i data-icon="settings"></i> Team Permissions</div>
        <div class="page-sub">Feature access + page grants ต่อทีม — super-admin only</div>
      </div>
      <div class="topbar-actions">
        <a href="super-admin.html" class="btn btn-outline btn-sm" style="text-decoration:none;"><i data-icon="building"></i> Manage Teams</a>
      </div>
    </header>

    <main class="page-content pm-page" style="overflow-y:auto">

      <section class="page-hero">
        <div class="page-hero-mark"><i data-icon="shield"></i></div>
        <div class="page-hero-body">
          <div class="page-hero-eyebrow">Super Admin</div>
          <h1>Team Permissions Manager</h1>
          <p>จัดการ feature access + page grants + read/full mode ต่อทีม — เลือกทีมจากด้านซ้าย</p>
        </div>
      </section>

      <div class="pm-layout" id="pm-layout">
        <!-- Team list -->
        <aside class="team-sidebar">
          <div class="team-sidebar-head">
            <span class="team-sidebar-title">Teams</span>
            <span class="team-sidebar-count" id="team-sidebar-count">—</span>
          </div>
          <div class="team-list" id="team-list">
            <div style="padding:16px;font-size:11px;color:var(--text-muted);">Loading…</div>
          </div>
        </aside>

        <!-- Permission panel -->
        <section class="pm-panel" id="pm-panel">
          <div class="pm-panel-empty">
            <div class="pm-panel-empty-icon"><i data-icon="shield"></i></div>
            เลือก team จากด้านซ้ายเพื่อจัดการสิทธิ์
          </div>
        </section>
      </div>

    </main><!-- /page-content -->
  </div><!-- /main-content -->
</div><!-- /app-shell -->

<script src="../assets/js/utils.js"></script>
