<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mail Logs — Admin — SOM-Portal</title>
  <link rel="icon" href="../favicon.ico" type="image/x-icon">
  <script src="../assets/js/theme.js"></script>
  <link rel="stylesheet" href="../assets/css/dark.css">
  <link rel="stylesheet" href="../assets/css/style.css?v=20260724">
  <link rel="stylesheet" href="../assets/css/ui-themes.css">
  <link rel="stylesheet" href="../assets/css/enterprise-refine.css">
  
  <link rel="stylesheet" href="../assets/pages/admin/mail-logs/mail-logs.css" data-page-css>
</head>
<body>

<div class="app-shell">
  <aside id="sidebar-mount"></aside>

  <div class="main-content">
    <header class="topbar">
      <div class="topbar-title">
        <div class="page-title"><i data-icon="mail"></i> Mail Logs</div>
        <div class="page-sub">ประวัติการส่ง Email ทั้งหมดจากระบบ</div>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-ghost btn-sm" onclick="load()" style="font-size:11px">↺ Refresh</button>
      </div>
    </header>

    <main class="page-content">

      <section class="page-hero">
        <div class="page-hero-mark"><i data-icon="mail"></i></div>
        <div class="page-hero-body">
          <div class="page-hero-eyebrow">Admin</div>
          <h1>Mail Logs</h1>
          <p>ประวัติการส่ง Email ทั้งหมดจากระบบ — Jira ticket emails, notifications, manual sends</p>
        </div>
      </section>

      <!-- Stats -->
      <div class="ml-stats">
        <div class="ml-stat"><div class="ml-stat-val" id="stat-total">—</div><div class="ml-stat-lbl">Total</div></div>
        <div class="ml-stat"><div class="ml-stat-val grn" id="stat-today">—</div><div class="ml-stat-lbl">Today</div></div>
        <div class="ml-stat"><div class="ml-stat-val red" id="stat-failed">—</div><div class="ml-stat-lbl">Failed</div></div>
      </div>

      <!-- Filters -->
      <div class="ml-filters">
        <input type="search" id="f-search" placeholder="ค้นหา subject, ผู้รับ, ผู้ส่ง..." oninput="schedSearch()">
        <select id="f-status" onchange="load()">
          <option value="">All Status</option>
          <option value="sent">Sent</option>
          <option value="failed">Failed</option>
        </select>
      </div>

      <!-- Table -->
      <div class="ml-table-wrap">
        <table class="ml-table">
          <thead>
            <tr>
              <th>Time</th>
              <th>To</th>
              <th>Subject</th>
              <th>Type</th>
              <th>Status</th>
              <th>Sent by</th>
            </tr>
          </thead>
          <tbody id="ml-tbody">
            <tr><td colspan="6" class="ml-empty"><div class="ml-empty-icon"><i data-icon="mail"></i></div>Loading...</td></tr>
          </tbody>
        </table>
        <div class="ml-pagination" id="ml-pagination" style="display:none">
          <span id="pag-info">—</span>
          <div class="ml-pagination-btns">
            <button class="btn btn-ghost btn-sm" id="btn-prev" onclick="pagePrev()">← Prev</button>
            <button class="btn btn-ghost btn-sm" id="btn-next" onclick="pageNext()">Next →</button>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="../assets/js/utils.js"></script>
<script src="../assets/js/skeletons.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/layout.js"></script>
<script src="../assets/js/mobile-nav.js"></script>
<script src="../assets/js/admin-nav.js"></script>
<script src="../assets/pages/admin/mail-logs/mail-logs.js"></script>

</body>
</html>
