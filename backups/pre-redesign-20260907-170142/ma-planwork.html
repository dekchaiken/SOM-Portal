<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MA Planwork — SOM-Portal</title>
  <link rel="icon" href="./favicon.ico" type="image/x-icon">
  <script src="./assets/js/theme.js"></script>
  <link rel="stylesheet" href="./assets/css/dark.css">
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="stylesheet" href="./assets/css/ui-themes.css">
  <style>
    :root {
      --ok:  #10b981; --ok-bg: rgba(16,185,129,.10);
      --bad: #ef4444; --bad-bg: rgba(239,68,68,.10);
      --warn:#f59e0b; --warn-bg:rgba(245,158,11,.10);
      --info:#3b82f6; --info-bg:rgba(59,130,246,.10);
    }
    .page-content { padding: 0 !important; }

    /* Root */
    .pw {
      padding: 24px 28px 60px;
      display: flex; flex-direction: column; gap: 18px;
    }

    /* Hero */
    .pw-hero {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; flex-wrap: wrap;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 16px; padding: 18px 22px;
      box-shadow: var(--shadow-sm);
    }
    .pw-hero-title { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; color: var(--text); margin: 0 0 4px; }
    .pw-hero-sub   { font-size: 12px; color: var(--text-muted); }
    .pw-hero-actions { display: flex; gap: 8px; align-items: center; }

    .pw-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 14px; border-radius: 9px;
      border: 1px solid var(--border); background: var(--bg-card);
      color: var(--text); font-size: 12.5px; font-weight: 600;
      cursor: pointer; transition: all .15s;
    }
    .pw-btn:hover { border-color: var(--text-muted); box-shadow: var(--shadow-sm); }
    .pw-btn.spinning svg { animation: pw-spin .8s linear infinite; }
    @keyframes pw-spin { to { transform: rotate(360deg); } }

    /* Search + filter */
    .pw-toolbar {
      display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    }
    .pw-search {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 12px; border-radius: 10px;
      background: var(--bg-card); border: 1px solid var(--border);
      box-shadow: var(--shadow-sm); min-width: 280px;
    }
    .pw-search:focus-within { border-color: var(--orange); box-shadow: 0 0 0 3px rgba(242,100,25,.14); }
    .pw-search svg { color: var(--text-muted); flex-shrink: 0; }
    .pw-search input {
      flex: 1; border: none; outline: none; background: transparent;
      color: var(--text); font-size: 12.5px; font-family: inherit; padding: 2px 0;
    }
    .pw-count-chip {
      font-size: 11px; color: var(--text-muted); font-weight: 600;
      padding: 4px 10px; border-radius: 999px;
      background: var(--bg-card); border: 1px solid var(--border);
    }

    /* Kanban board */
    .pw-board {
      display: grid; gap: 14px;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      align-items: start;
    }
    .pw-col {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 14px; padding: 12px 12px 14px;
      min-height: 200px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .pw-col-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; padding: 4px 6px 8px; border-bottom: 1px solid var(--border);
    }
    .pw-col-title {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 11px; font-weight: 800; letter-spacing: .08em;
      color: var(--text); text-transform: uppercase;
    }
    .pw-col-title .swatch { width: 10px; height: 10px; border-radius: 3px; }
    .pw-col-count {
      padding: 2px 9px; border-radius: 999px; background: var(--bg-card);
      border: 1px solid var(--border); font-size: 10.5px; font-weight: 700;
      color: var(--text-muted); font-variant-numeric: tabular-nums;
    }

    /* Card — minimal, theme-friendly, full description inline */
    .pw-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 10px; padding: 14px 16px 12px;
      display: flex; flex-direction: column; gap: 10px;
      transition: border-color .15s, box-shadow .15s;
    }
    .pw-card:hover {
      border-color: color-mix(in srgb, var(--text) 18%, var(--border));
      box-shadow: var(--shadow-sm);
    }
    /* subtle state accent — thin top border only */
    .pw-card.color-inprog { box-shadow: inset 0 2px 0 var(--warn); }
    .pw-card.color-backlog, .pw-card.color-jira, .pw-card.color-open {
      box-shadow: inset 0 2px 0 color-mix(in srgb, var(--text) 12%, transparent);
    }

    /* Header row: key + priority (left) · quick meta (right) */
    .pw-card-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px;
    }
    .pw-card-key {
      display: inline-flex; align-items: center; gap: 6px;
      font-family: var(--font, monospace); font-size: 11.5px; font-weight: 700;
      color: var(--text); letter-spacing: -0.01em;
    }
    .pw-card-key a {
      color: inherit; text-decoration: none; padding: 2px 6px;
      border-radius: 4px; background: var(--bg); border: 1px solid var(--border);
      transition: all .12s;
    }
    .pw-card-key a:hover { color: var(--orange); border-color: var(--orange); }
    .pw-card-key .prio {
      font-size: 9px; font-weight: 800; letter-spacing: .06em;
      padding: 2px 6px; border-radius: 4px; text-transform: uppercase;
      color: var(--text-muted); background: var(--bg); border: 1px solid var(--border);
    }
    .pw-card-key .prio.high   { color: var(--bad); border-color: rgba(239,68,68,.35); background: var(--bad-bg); }
    .pw-card-key .prio.medium { color: var(--warn); border-color: rgba(245,158,11,.35); background: var(--warn-bg); }
    .pw-card-key .prio.low    { color: var(--info); border-color: rgba(59,130,246,.35); background: var(--info-bg); }

    .pw-card-date {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 10.5px; font-variant-numeric: tabular-nums;
      color: var(--text-muted);
    }
    .pw-card-date.overdue { color: var(--bad); font-weight: 700; }
    .pw-card-date.soon    { color: var(--warn); font-weight: 700; }

    /* Title — full, no clamp */
    .pw-card-title {
      font-size: 13.5px; font-weight: 700; line-height: 1.45;
      color: var(--text); letter-spacing: -0.005em;
      word-break: break-word;
    }

    /* Description — full text, preserves whitespace and newlines.
       No height cap by default: let the card grow to fit the content so the
       user doesn't have to scroll inside each card. If content is extremely
       long (>1000 chars) an optional inline scroll kicks in for sanity. */
    .pw-card-desc {
      font-size: 12px; color: var(--text); line-height: 1.85;
      white-space: pre-wrap; word-break: break-word;
      padding: 12px 14px;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 8px;
    }
    /* Add extra spacing after empty lines so section breaks feel airy */
    .pw-card-desc:empty { display: none; }
    .pw-card-desc.is-huge { max-height: 640px; overflow-y: auto; }
    .pw-card-desc::-webkit-scrollbar { width: 6px; }
    .pw-card-desc::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* Meta grid — details block above the footer (dates, reviewers, toggles) */
    .pw-card-meta {
      display: grid; grid-template-columns: max-content 1fr;
      gap: 4px 12px;
      padding: 8px 10px;
      background: color-mix(in srgb, var(--bg) 60%, var(--bg-card));
      border: 1px solid var(--border); border-radius: 8px;
      font-size: 11px;
    }
    .pw-card-meta:empty { display: none; }
    .pw-card-meta dt {
      color: var(--text-muted); font-weight: 700;
      letter-spacing: .03em; font-size: 10px;
      text-transform: uppercase;
      align-self: center;
    }
    .pw-card-meta dd {
      margin: 0; color: var(--text); word-break: break-word;
      align-self: center;
    }
    .pw-card-meta dd .reviewer {
      display: inline-block; margin: 1px 4px 1px 0;
      padding: 1px 7px; border-radius: 4px;
      background: var(--bg-card); border: 1px solid var(--border);
      font-size: 10.5px;
    }
    .pw-card-meta dd a {
      color: var(--orange); text-decoration: none;
      border-bottom: 1px dotted currentColor;
    }
    .pw-card-meta dd.dim { color: var(--text-muted); font-style: italic; }

    /* MA Messages block — TH/EN show separately */
    .pw-card-msg { display: flex; flex-direction: column; gap: 6px; }
    .pw-card-msg-block {
      padding: 8px 10px; border-radius: 8px;
      background: var(--bg); border: 1px solid var(--border);
      font-size: 11.5px; color: var(--text); line-height: 1.5;
      white-space: pre-wrap; word-break: break-word;
    }
    .pw-card-msg-block .lbl {
      font-size: 9.5px; font-weight: 800; letter-spacing: .06em;
      color: var(--text-muted); text-transform: uppercase;
      display: block; margin-bottom: 3px;
    }

    /* Footer: owner (left) + open-in-jira link (right) */
    .pw-card-foot {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; padding-top: 8px; border-top: 1px dashed var(--border);
      font-size: 10.5px; color: var(--text-muted);
    }
    .pw-card-owner {
      display: inline-flex; align-items: center; gap: 6px;
      min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .pw-card-owner .avatar {
      width: 20px; height: 20px; border-radius: 50%;
      background: color-mix(in srgb, var(--text) 15%, var(--bg-card));
      color: var(--text); font-size: 9.5px; font-weight: 800;
      display: inline-flex; align-items: center; justify-content: center;
      flex-shrink: 0; letter-spacing: 0;
      border: 1px solid var(--border);
    }
    .pw-card-jira {
      display: inline-flex; align-items: center; gap: 4px;
      color: var(--text-muted); text-decoration: none;
      padding: 3px 8px; border-radius: 5px;
      border: 1px solid transparent;
      transition: all .12s; flex-shrink: 0;
    }
    .pw-card-jira:hover { color: var(--orange); border-color: var(--orange); }

    /* Hero loading state — used for the first fetch so the page doesn't render
       an empty/half-loaded board while waiting on Jira. Mirrors ma-status's
       .mst-loading pattern (spinner + primary label + sub-line of sources). */
    .pw-loading {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; padding: 80px 20px;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 16px; box-shadow: var(--shadow-sm);
    }
    .pw-loading .spin {
      width: 42px; height: 42px; border-radius: 50%;
      border: 3px solid var(--border); border-top-color: var(--orange);
      animation: pw-spin .9s linear infinite; margin: 0;
    }
    .pw-loading .txt  { font-size: 13px; color: var(--text-muted); font-weight: 600; text-align: center; }
    .pw-loading .dots { font-size: 11px; color: var(--text-muted); text-align: center; }
    .pw-col-empty { padding: 22px 10px; text-align: center; color: var(--text-muted); font-size: 11.5px; }

    /* Hero error banner — used when the fetch keeps failing after auto-retry.
       Larger + friendlier than the inline pw-error, includes a Retry button. */
    .pw-error {
      display: flex; align-items: flex-start; gap: 14px;
      padding: 18px 22px;
      background: var(--bad-bg);
      border: 1.5px solid rgba(239,68,68,.35);
      border-left: 4px solid var(--bad);
      border-radius: 12px; box-shadow: var(--shadow-sm);
    }
    .pw-error .ico { font-size: 24px; line-height: 1; flex-shrink: 0; margin-top: 2px; }
    .pw-error-body { flex: 1; min-width: 0; }
    .pw-error-title { font-size: 14px; font-weight: 800; color: var(--bad); margin-bottom: 4px; }
    .pw-error-msg   { font-size: 12px; color: var(--text); word-break: break-word; margin-bottom: 10px; line-height: 1.5; }
    .pw-error-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .pw-error-actions button {
      padding: 7px 14px; border-radius: 8px;
      border: 1px solid var(--bad);
      background: var(--bg-card); color: var(--bad);
      font-size: 12px; font-weight: 700; cursor: pointer;
      transition: all .14s; font-family: inherit;
    }
    .pw-error-actions button:hover { background: var(--bad); color: #fff; }
    .pw-error-actions button.secondary { border-color: var(--border); color: var(--text-muted); }
    .pw-error-actions button.secondary:hover { background: var(--bg); color: var(--text); }

    /* KPIs bar */
    .pw-kpis {
      display: grid; gap: 10px;
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }
    @media (max-width: 700px) { .pw-kpis { grid-template-columns: repeat(2, 1fr); } }
    .pw-kpi {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px 14px;
      display: flex; align-items: center; gap: 12px;
      box-shadow: var(--shadow-sm);
    }
    .pw-kpi-ico {
      width: 36px; height: 36px; border-radius: 10px;
      background: var(--bg); display: inline-flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }
    .pw-kpi-num { font-size: 24px; font-weight: 800; color: var(--text); line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
    .pw-kpi-lbl { font-size: 10.5px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; margin-top: 4px; }
  </style>
</head>
<body>

<div class="app-shell">
  <aside id="sidebar-mount"></aside>

  <main class="main-content">
    <div class="topbar">
      <div class="tb-prompt"><span class="tb-path">~/sm</span><span class="tb-arrow"><i data-icon="play"></i></span></div>
      <div class="topbar-title">
        <span class="page-title"><i data-icon="clipboard"></i> MA Planwork</span>
        <span class="page-sub">Kanban board of upcoming Maintenance work items</span>
      </div>
      <div class="topbar-actions">
        <a href="./ma-services.html" class="mas-topnav-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
          <span>MA Services</span>
        </a>
      </div>
    </div>

    <div class="page-content">
      <div class="pw">

        <!-- Hero -->
        <div class="pw-hero">
          <div>
            <h1 class="pw-hero-title">MA / Support Planwork</h1>
            <div class="pw-hero-sub" id="pw-sub">Loading from Jira…</div>
          </div>
          <div class="pw-hero-actions">
            <button id="pw-refresh" class="pw-btn" onclick="MAPlan.refresh(true)" title="Refresh">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/><path d="M20.49 15a9 9 0 0 1-14.85 3.36L1 14"/></svg>
              <span>Refresh</span>
            </button>
          </div>
        </div>

        <!-- KPIs -->
        <div class="pw-kpis">
          <div class="pw-kpi"><div class="pw-kpi-ico"><i data-icon="clipboard"></i></div><div><div class="pw-kpi-num" id="pw-kpi-total">—</div><div class="pw-kpi-lbl">Total open</div></div></div>
          <div class="pw-kpi"><div class="pw-kpi-ico"><i data-icon="clock"></i></div><div><div class="pw-kpi-num" id="pw-kpi-backlog">—</div><div class="pw-kpi-lbl">Backlog / To Do</div></div></div>
          <div class="pw-kpi"><div class="pw-kpi-ico">🚧</div><div><div class="pw-kpi-num" id="pw-kpi-inprog">—</div><div class="pw-kpi-lbl">In Progress</div></div></div>
          <div class="pw-kpi"><div class="pw-kpi-ico"><i data-icon="alert-triangle"></i></div><div><div class="pw-kpi-num" id="pw-kpi-overdue">—</div><div class="pw-kpi-lbl">Overdue</div></div></div>
        </div>

        <!-- Toolbar -->
        <div class="pw-toolbar">
          <div class="pw-search">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" x2="16.65" y1="21" y2="16.65"/></svg>
            <input type="search" id="pw-search-input" placeholder="Search key, summary, owner…" oninput="MAPlan.setSearch(this.value)">
          </div>
          <span class="pw-count-chip" id="pw-visible-count">— items</span>
        </div>

        <!-- Board — starts with a hero-style loading state (spinner + copy) so
             the initial fetch doesn't render an empty Kanban. Replaced with
             columns on success, or an error banner + Retry button on failure. -->
        <div id="pw-board" class="pw-board" style="display:block">
          <div class="pw-loading">
            <div class="spin"></div>
            <div class="txt">Fetching MA Planwork…</div>
            <div class="dots">Loading upcoming maintenance tickets from Jira</div>
          </div>
        </div>

      </div>
    </div>
  </main>
</div>

<script src="./assets/js/utils.js"></script>
<script src="./assets/js/auth.js"></script>
<script src="./assets/js/api.js"></script>
<script src="./assets/js/layout.js"></script>
<script>
  Auth.requireAuth();
  Layout.render('ma-services');

  // Access gate: admin AND team === 'sm'. Kick anyone else to dashboard.
  (async function () {
    const u = Auth.getUser?.() || {};
    const isAdmin = ['super_admin', 'sm_admin', 'dev_sm'].includes(u.role);
    const isSm    = u.team === 'sm';
    if (!isAdmin || !isSm) {
      await SOMDialog.alert('This page is for SM team admins only.', { title: 'ไม่มีสิทธิ์เข้าถึง', icon: 'warning' });
      window.location.href = './ma-services.html';
    }
  })();

  const MAPlan = {
    data: null,
    search: '',
    inFlight: false,
    firstLoad: true,          // becomes false only after a successful fetch
    JIRA_BASE: 'https://truemoney.atlassian.net/browse/',

    // First load bypasses the server cache. Older cached responses (from before
    // the pipeline field was added) return empty items and would flash "no active
    // MA items" incorrectly. Force refresh guarantees a fresh payload with the
    // full schema.
    init() { this.refresh(true); },

    setSearch(q) {
      this.search = (q || '').toLowerCase().trim();
      if (this.data) this.render(this.data);
    },

    async _fetchOnce(userInitiated) {
      const y = new Date().getFullYear();
      const qs = `year=${y}${userInitiated ? '&refresh=1' : ''}`;
      const res = await API.get('/ma-services/jira-stats.php?' + qs);
      // API.get returns null on 401 (server rejected token) — surface a clear msg
      if (!res)    return { ok: false, error: 'Server rejected session — try logging out and back in' };
      if (!res.ok) return { ok: false, error: res.data?.message || `HTTP ${res.status || 'error'}` };
      return { ok: true, data: res.data.data || res.data };
    },

    async refresh(userInitiated) {
      if (this.inFlight) return;
      this.inFlight = true;
      const btn = document.getElementById('pw-refresh');
      btn.classList.add('spinning');
      try {
        let attempt = await this._fetchOnce(userInitiated);
        if (!attempt.ok) {
          // One silent retry — covers transient network hiccups (brief connection
          // drops, 5xx, slow Jira response) so the user doesn't hit the error
          // banner for a problem that clears itself on the next request.
          await new Promise(r => setTimeout(r, 600));
          attempt = await this._fetchOnce(userInitiated);
        }
        if (!attempt.ok) {
          // Persistent failure: if we already have data on screen, keep it —
          // don't blank the board just because a background refresh failed.
          if (this.data && !this.firstLoad) {
            Toast?.error?.(`Refresh failed: ${attempt.error}`);
            document.getElementById('pw-sub').textContent =
              `<i data-icon="alert-triangle"></i> Refresh failed — showing cached data · click Refresh to retry`;
          } else {
            this._showError(attempt.error);
          }
          return;
        }
        this.data = attempt.data;
        // Validate the payload carries the pipeline field. Old cached responses
        // from before the pipeline feature don't have it — treat as failure and
        // force a fresh fetch so the user doesn't see "no active MA items" on
        // stale data.
        if (this.data && !('pipeline' in this.data) && !userInitiated) {
          console.warn('[ma-planwork] response missing pipeline field, forcing refresh…');
          this.inFlight = false;
          btn.classList.remove('spinning');
          return this.refresh(true);
        }
        this.firstLoad = false;
        this.render(this.data);
      } catch (e) {
        console.error('[ma-planwork]', e);
        const msg = e?.message || 'Failed to load';
        if (this.data && !this.firstLoad) {
          Toast?.error?.(`Refresh failed: ${msg}`);
        } else {
          this._showError(msg);
        }
      } finally {
        this.inFlight = false;
        btn.classList.remove('spinning');
      }
    },

    _showError(msg) {
      document.getElementById('pw-board').innerHTML = `
        <div class="pw-error">
          <div class="ico"><i data-icon="alert-triangle"></i></div>
          <div class="pw-error-body">
            <div class="pw-error-title">Failed to load MA Planwork</div>
            <div class="pw-error-msg">${escHtml(msg)}</div>
            <div class="pw-error-msg" style="color:var(--text-muted);margin-bottom:12px">
              Common fixes: <b>logout &amp; login again</b> · check <code>data/logs/security.json</code> on server · verify <code>JWT_SECRET</code> in <code>.env</code> hasn't changed
            </div>
            <div class="pw-error-actions">
              <button onclick="MAPlan.refresh(true)">↻ Retry</button>
              <button class="secondary" onclick="location.reload()">Reload page</button>
            </div>
          </div>
        </div>`;
      document.getElementById('pw-sub').textContent = 'Failed to fetch — click Retry above';
    },

    render(d) {
      const pipeline = d.pipeline || { total: 0, todo: 0, inProgress: 0, items: [] };
      const items = pipeline.items || [];

      // KPIs
      const today = new Date(); today.setHours(0,0,0,0);
      const overdueCount = items.filter(it => it.due && new Date(it.due) < today).length;
      document.getElementById('pw-kpi-total').textContent   = pipeline.total ?? 0;
      document.getElementById('pw-kpi-backlog').textContent = pipeline.todo ?? 0;
      document.getElementById('pw-kpi-inprog').textContent  = pipeline.inProgress ?? 0;
      document.getElementById('pw-kpi-overdue').textContent = overdueCount;

      // Filter by search
      const q = this.search;
      const filtered = q
        ? items.filter(it =>
            (it.key || '').toLowerCase().includes(q) ||
            (it.summary || '').toLowerCase().includes(q) ||
            (it.owner || '').toLowerCase().includes(q) ||
            (it.description || '').toLowerCase().includes(q))
        : items;

      // Group by status name (Jira board columns feel natural like this)
      const groups = new Map();
      for (const it of filtered) {
        const key = it.status || '—';
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(it);
      }

      // Column ordering preference: In Progress ish first, then Backlog, then rest
      const order = (name) => {
        const n = (name || '').toLowerCase();
        if (n.includes('progress'))                return 1;
        if (n.includes('review'))                  return 2;
        if (n.includes('board') || n.includes('backlog') || n.includes('to do') || n.includes('open')) return 3;
        return 4;
      };
      const sortedCols = [...groups.entries()].sort((a,b) => order(a[0]) - order(b[0]));

      // Update sub-line + visible count
      document.getElementById('pw-visible-count').textContent =
        q ? `${filtered.length} / ${items.length} items` : `${items.length} items`;
      const when = new Date().toLocaleTimeString('th-TH', { hour12:false });
      document.getElementById('pw-sub').textContent =
        `Fetched ${when} · ${items.length} open items across ${groups.size} column(s)`;

      // Render board
      const board = document.getElementById('pw-board');
      if (!sortedCols.length) {
        // Only claim "no items" if we have a real answer from the server —
        // otherwise the user might see this flash during a slow first fetch.
        if (this.firstLoad || this.inFlight) {
          board.innerHTML = `
            <div class="pw-loading">
              <div class="spin"></div>
              <div class="txt">Fetching MA Planwork…</div>
              <div class="dots">Loading upcoming maintenance tickets from Jira</div>
            </div>`;
        } else if (q) {
          board.innerHTML = `
            <div class="pw-loading">
              <div class="txt">no matches for "${escHtml(q)}"</div>
              <div class="dots">try clearing the search box above</div>
            </div>`;
        } else {
          board.innerHTML = `
            <div class="pw-loading">
              <div style="font-size:36px"><i data-icon="check-circle"></i></div>
              <div class="txt">No active MA items right now</div>
              <div class="dots">Nothing scheduled in Jira · click Refresh to check again</div>
            </div>`;
        }
        return;
      }
      board.innerHTML = sortedCols.map(([name, list]) => this.renderCol(name, list)).join('');
    },

    renderCol(name, list) {
      const swatch = this.colorFor(name);
      return `
        <div class="pw-col">
          <div class="pw-col-head">
            <span class="pw-col-title">
              <span class="swatch" style="background:${swatch}"></span>${escHtml(name)}
            </span>
            <span class="pw-col-count">${list.length}</span>
          </div>
          ${list.length
            ? list.map(it => this.renderCard(it, name)).join('')
            : '<div class="pw-col-empty">no items</div>'}
        </div>`;
    },

    renderCard(it, colName) {
      const colClass = this.colorClassFor(colName);
      const initials = (it.owner || '?').split(' ').map(s => s[0]).slice(0,2).join('').toUpperCase() || '?';
      const prio = (it.priority || '').toLowerCase();
      const prioCls = prio.includes('high') || prio.includes('crit') || prio.includes('block') ? 'high'
                    : prio.includes('med') ? 'medium'
                    : prio ? 'low' : '';
      // Date badge state
      const today = new Date(); today.setHours(0,0,0,0);
      const dateShown = it.due || it.created || '';
      let dateCls = '';
      if (it.due) {
        const d = new Date(it.due);
        const diff = Math.floor((d - today) / 86400000);
        if (diff < 0)  dateCls = 'overdue';
        else if (diff <= 3) dateCls = 'soon';
      }
      const dateLabel = it.due ? `due ${dateShown}` : `created ${dateShown}`;
      const jiraUrl = this.JIRA_BASE + encodeURIComponent(it.key);

      // ── Meta rows (Key details block) ───────────────────
      const metaRows = [];
      const row = (label, val, opts) => {
        if (val === null || val === undefined || val === '' || (Array.isArray(val) && !val.length)) {
          if (!opts?.alwaysShow) return;
          val = 'None';
        }
        metaRows.push([label, val, opts]);
      };
      row('Reporter',      it.reporter);
      row('Reference',     it.reference);
      row('MOP link',      it.mopLink ? `<a href="${escAttr(it.mopLink)}" target="_blank" rel="noopener">${escHtml(it.mopLink.length > 46 ? it.mopLink.slice(0,43)+'…' : it.mopLink)}</a>` : null, { html: true });
      row('Start',         it.startAt);
      row('End',           it.endAt);
      if (it.reviewers && it.reviewers.length) {
        row('Manager Review', it.reviewers.map(n => `<span class="reviewer">${escHtml(n)}</span>`).join(''), { html: true });
      }
      row('Toggle Features', it.toggle1);
      row('Toggle Features.', it.toggle2);
      row('Main Type',     it.mainType);

      const metaHtml = metaRows.length
        ? `<dl class="pw-card-meta">${metaRows.map(([l, v, opts]) =>
            `<dt>${escHtml(l)}</dt><dd${(v==='None')?' class="dim"':''}>${opts?.html ? v : escHtml(v)}</dd>`
          ).join('')}</dl>`
        : '';

      // ── MA Messages (TH / EN) ─────────────────────────────
      const msgs = [];
      if (it.maMsgTh) msgs.push(`<div class="pw-card-msg-block"><span class="lbl">MA Message (TH)</span>${escHtml(it.maMsgTh)}</div>`);
      if (it.maMsgEn) msgs.push(`<div class="pw-card-msg-block"><span class="lbl">MA Message (EN)</span>${escHtml(it.maMsgEn)}</div>`);
      const msgsHtml = msgs.length ? `<div class="pw-card-msg">${msgs.join('')}</div>` : '';

      return `
        <div class="pw-card ${colClass}">
          <div class="pw-card-head">
            <span class="pw-card-key">
              <a href="${jiraUrl}" target="_blank" rel="noopener" title="Open ${escAttr(it.key)} in Jira">${escHtml(it.key)}</a>
              ${it.priority ? `<span class="prio ${prioCls}">${escHtml(it.priority)}</span>` : ''}
            </span>
            <span class="pw-card-date ${dateCls}">${escHtml(dateLabel)}</span>
          </div>
          <div class="pw-card-title">${escHtml(it.summary || '(no title)')}</div>
          ${it.description ? `<div class="pw-card-desc${(it.description || '').length > 1500 ? ' is-huge' : ''}">${escHtml(it.description)}</div>` : ''}
          ${metaHtml}
          ${msgsHtml}
          <div class="pw-card-foot">
            <span class="pw-card-owner"><span class="avatar">${escHtml(initials)}</span>${escHtml(it.owner || '')}</span>
            <a class="pw-card-jira" href="${jiraUrl}" target="_blank" rel="noopener" title="Open in Jira">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" x2="21" y1="14" y2="3"/></svg>
              open
            </a>
          </div>
        </div>`;
    },

    colorFor(name) {
      const n = (name || '').toLowerCase();
      if (n.includes('progress')) return '#f59e0b';
      if (n.includes('review'))   return '#3b82f6';
      if (n.includes('board') || n.includes('backlog') || n.includes('to do')) return '#a855f7';
      return '#94a3b8';
    },
    colorClassFor(name) {
      const n = (name || '').toLowerCase();
      if (n.includes('progress')) return 'color-inprog';
      if (n.includes('review'))   return 'color-open';
      if (n.includes('board'))    return 'color-jira';
      return 'color-backlog';
    },
  };

  function escHtml(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function escAttr(s) { return escHtml(s); }

  MAPlan.init();
  window.MAPlan = MAPlan;
</script>
</body>
</html>
