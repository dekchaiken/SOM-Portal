<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paused Alerts — SOM-Portal</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/ui-themes.css">
  <link rel="stylesheet" href="assets/css/dark.css">
  <style>
    /* ══ Grafana Paused Alerts — blocks.so / shadcn design system (scoped) ══ */
    .ga-wrap {
      --bg-card:    #ffffff;
      --bg-subtle:  #fafafa;
      --border:     #e4e4e7;   /* zinc-200 */
      --border-str: #d4d4d8;   /* zinc-300 */
      --text:       #09090b;   /* zinc-950 */
      --text-muted: #71717a;   /* zinc-500 */
      --text-soft:  #a1a1aa;   /* zinc-400 */
      --hover:      rgba(9,9,11,.04);
      --r-card:     14px;
      --r-btn:      8px;
      --r-tag:      6px;
      --shadow:     0 1px 2px rgba(9,9,11,.05);
      --shadow-md:  0 4px 16px -4px rgba(9,9,11,.10);
      --paused:     #2563eb;
      --ok:         #16a34a;
      --warn:       #d97706;
      --skel:       linear-gradient(90deg,#f4f4f5 25%,#e9e9ec 37%,#f4f4f5 63%);
      color: var(--text);
    }
    html[data-theme="dark"] .ga-wrap {
      --bg-card:    #0a0a0a;
      --bg-subtle:  #18181b;
      --border:     #27272a;   /* zinc-800 */
      --border-str: #3f3f46;   /* zinc-700 */
      --text:       #fafafa;
      --text-muted: #a1a1aa;
      --text-soft:  #71717a;
      --hover:      rgba(255,255,255,.05);
      --shadow:     none;
      --shadow-md:  0 4px 20px -4px rgba(0,0,0,.6);
      --paused:     #60a5fa;
      --ok:         #4ade80;
      --warn:       #fbbf24;
      --skel:       linear-gradient(90deg,#18181b 25%,#232326 37%,#18181b 63%);
    }
    .ga-wrap { font-variant-numeric: tabular-nums; }
    .ga-wrap .ico { width:1em; height:1em; display:inline-block; vertical-align:-.14em; stroke-width:2; }

    /* ── KPI stat cards ── */
    .ga-kpi-strip { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:22px; }
    .ga-kpi {
      position:relative; background:var(--bg-card); border:1px solid var(--border);
      border-radius:var(--r-card); padding:18px 20px; box-shadow:var(--shadow);
      transition:box-shadow .15s, transform .15s, border-color .15s;
    }
    .ga-kpi:hover { box-shadow:var(--shadow-md); transform:translateY(-1px); border-color:var(--border-str); }
    .ga-kpi-top { display:flex; align-items:center; gap:7px; margin-bottom:12px; }
    .ga-kpi-ico {
      width:26px; height:26px; display:grid; place-items:center; border-radius:7px;
      background:var(--bg-subtle); color:var(--text-muted); font-size:14px;
    }
    .ga-kpi-lbl { font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:var(--text-muted); font-weight:600; }
    .ga-kpi-val { font-size:30px; font-weight:700; letter-spacing:-.025em; line-height:1; }
    .ga-kpi-val.paused { color:var(--paused); }
    .ga-kpi-sub { font-size:11.5px; color:var(--text-muted); margin-top:7px; }

    /* ── Source card ── */
    .ga-source {
      background:var(--bg-card); border:1px solid var(--border);
      border-radius:var(--r-card); box-shadow:var(--shadow);
      margin-bottom:14px; overflow:hidden;
    }
    .ga-source-head { display:flex; align-items:center; gap:11px; padding:15px 20px; }
    .ga-source:has(.ga-table) .ga-source-head { border-bottom:1px solid var(--border); }
    .ga-dot { width:9px; height:9px; border-radius:50%; flex:none; box-shadow:0 0 0 3px color-mix(in srgb,currentColor 0%,transparent); }
    .ga-source-name { font-size:14.5px; font-weight:650; letter-spacing:-.01em; }
    .ga-source-org { font-size:11px; color:var(--text-soft); margin-top:1px; }
    .ga-count-badge {
      margin-left:auto; display:inline-flex; align-items:center; gap:5px;
      font-size:12px; font-weight:650; padding:4px 11px; border-radius:999px;
      background:color-mix(in srgb,var(--paused) 12%,transparent); color:var(--paused);
    }
    .ga-count-badge.zero { background:color-mix(in srgb,var(--ok) 12%,transparent); color:var(--ok); }
    .ga-count-badge.err  { background:color-mix(in srgb,var(--warn) 14%,transparent); color:var(--warn); }

    /* ── Table ── */
    .ga-table { width:100%; border-collapse:collapse; font-size:13px; }
    .ga-table th {
      text-align:left; font-size:10.5px; letter-spacing:.05em; text-transform:uppercase;
      color:var(--text-soft); font-weight:600; padding:10px 20px;
      background:var(--bg-subtle); border-bottom:1px solid var(--border);
    }
    .ga-table th.right, .ga-table td.right { text-align:right; }
    .ga-table td { padding:12px 20px; border-bottom:1px solid var(--border); vertical-align:middle; }
    .ga-table tbody tr:last-child td { border-bottom:none; }
    .ga-table tbody tr { transition:background .12s; }
    .ga-table tbody tr:hover { background:var(--hover); }
    .ga-alert-name { font-weight:550; }
    .ga-tag {
      display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:650;
      letter-spacing:.04em; padding:3px 9px; border-radius:var(--r-tag);
      background:color-mix(in srgb,var(--paused) 12%,transparent); color:var(--paused);
    }
    .ga-tag .pd { width:5px; height:5px; border-radius:50%; background:currentColor; }
    .ga-since { color:var(--text-muted); font-size:12px; white-space:nowrap; }

    /* ── Buttons (blocks.so) ── */
    .ga-btn {
      display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600;
      padding:5px 11px; border-radius:var(--r-btn); border:1px solid var(--border);
      background:var(--bg-card); color:var(--text-muted); cursor:pointer; white-space:nowrap;
      text-decoration:none; transition:all .13s; line-height:1;
    }
    .ga-btn:hover { color:var(--text); background:var(--hover); border-color:var(--border-str); }
    .ga-btn:disabled { opacity:.5; cursor:default; }
    .ga-btn.resume { color:var(--ok); border-color:color-mix(in srgb,var(--ok) 30%,var(--border)); margin-right:7px; }
    .ga-btn.resume:hover { background:color-mix(in srgb,var(--ok) 10%,transparent); border-color:var(--ok); }

    /* ── Empty / error rows ── */
    .ga-state { display:flex; align-items:center; gap:10px; padding:18px 20px; font-size:13px; }
    .ga-state .ga-state-ico { width:28px; height:28px; border-radius:8px; display:grid; place-items:center; flex:none; }
    .ga-empty  .ga-state-ico { background:color-mix(in srgb,var(--ok) 12%,transparent);   color:var(--ok); }
    .ga-err    .ga-state-ico { background:color-mix(in srgb,var(--warn) 14%,transparent); color:var(--warn); }
    .ga-empty { color:var(--text-muted); }
    .ga-err   { color:var(--warn); }

    /* ── Skeleton loading (shimmer) ── */
    .ga-skel { border-radius:6px; background:var(--skel); background-size:400% 100%; animation:ga-shimmer 1.4s ease infinite; }
    @keyframes ga-shimmer { 0%{background-position:100% 0} 100%{background-position:0 0} }
    @keyframes ga-spin { to { transform:rotate(360deg); } }
    .ga-wrap .ico.spin { animation:ga-spin .7s linear infinite; }
    .ga-skel-card {
      background:var(--bg-card); border:1px solid var(--border); border-radius:var(--r-card);
      box-shadow:var(--shadow); padding:18px 20px; margin-bottom:14px;
    }
    .ga-hidden { display:none !important; }

    @media (max-width:640px) {
      .ga-kpi-strip { grid-template-columns:1fr; }
      .ga-table th:nth-child(3), .ga-table td:nth-child(3) { display:none; }
    }
  </style>
</head>
<body>

<div class="app-shell">
  <aside id="sidebar-mount"></aside>
  <script>/* sb-restore */(function(){try{var h=sessionStorage.getItem('_sm_sb_html');if(!h)return;var n=sessionStorage.getItem('_sm_sb_next')||'';var d=document.createElement('div');d.innerHTML=h;var sb=d.querySelector('.sidebar');if(!sb)return;sb.querySelectorAll('.nav-item').forEach(function(a){var f=(a.getAttribute('href')||'').split('/').pop().replace(/\.html.*$/,'');a.classList.toggle('active',!!n&&f===n);});var p=sb.querySelector('#nav-active-pill');if(p)p.style.opacity='0';var m=document.getElementById('sidebar-mount');if(m)m.replaceWith(sb);}catch(e){}})();</script>
  <div class="main-content">

    <header class="topbar">
      <div class="topbar-title">
        <div class="page-title">Paused Alerts</div>
        <div class="page-sub">Grafana alerting · state = paused · live</div>
      </div>
      <div class="topbar-actions">
        <span id="ga-last-updated" style="font-size:11px;color:var(--text-muted)"></span>
        <button class="btn btn-ghost" style="font-size:11px;display:inline-flex;align-items:center;gap:6px" onclick="loadPaused()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>รีเฟรช
        </button>
      </div>
    </header>

    <main class="page-content">
      <div class="ga-wrap">

        <!-- Loading skeleton -->
        <div id="ga-loading">
          <div class="ga-kpi-strip">
            <div class="ga-kpi"><div class="ga-skel" style="height:14px;width:60%"></div><div class="ga-skel" style="height:30px;width:40%;margin-top:14px"></div><div class="ga-skel" style="height:11px;width:70%;margin-top:12px"></div></div>
            <div class="ga-kpi"><div class="ga-skel" style="height:14px;width:60%"></div><div class="ga-skel" style="height:30px;width:40%;margin-top:14px"></div><div class="ga-skel" style="height:11px;width:70%;margin-top:12px"></div></div>
            <div class="ga-kpi"><div class="ga-skel" style="height:14px;width:60%"></div><div class="ga-skel" style="height:30px;width:40%;margin-top:14px"></div><div class="ga-skel" style="height:11px;width:70%;margin-top:12px"></div></div>
          </div>
          <div class="ga-skel-card"><div style="display:flex;gap:10px;align-items:center"><div class="ga-skel" style="height:10px;width:10px;border-radius:50%"></div><div class="ga-skel" style="height:15px;width:160px"></div><div class="ga-skel" style="height:22px;width:80px;border-radius:999px;margin-left:auto"></div></div></div>
          <div class="ga-skel-card"><div style="display:flex;gap:10px;align-items:center"><div class="ga-skel" style="height:10px;width:10px;border-radius:50%"></div><div class="ga-skel" style="height:15px;width:120px"></div><div class="ga-skel" style="height:22px;width:80px;border-radius:999px;margin-left:auto"></div></div></div>
          <div style="text-align:center;color:var(--text-soft);font-size:12px;margin-top:16px">กำลังดึงสถานะ Paused จาก Grafana ทุก org…</div>
        </div>

        <!-- Content (revealed after fetch) -->
        <div id="ga-content" class="ga-hidden">
          <div class="ga-kpi-strip">
            <div class="ga-kpi">
              <div class="ga-kpi-top"><span class="ga-kpi-ico" id="ga-ico-total"></span><span class="ga-kpi-lbl">Total paused</span></div>
              <div class="ga-kpi-val paused" id="ga-total">–</div>
              <div class="ga-kpi-sub" id="ga-total-sub"></div>
            </div>
            <div class="ga-kpi">
              <div class="ga-kpi-top"><span class="ga-kpi-ico" id="ga-ico-src"></span><span class="ga-kpi-lbl">Sources</span></div>
              <div class="ga-kpi-val" id="ga-sources">–</div>
              <div class="ga-kpi-sub" id="ga-sources-sub"></div>
            </div>
            <div class="ga-kpi">
              <div class="ga-kpi-top"><span class="ga-kpi-ico" id="ga-ico-clock"></span><span class="ga-kpi-lbl">Fetched at</span></div>
              <div class="ga-kpi-val" id="ga-fetched" style="font-size:22px">–</div>
              <div class="ga-kpi-sub">Asia/Bangkok</div>
            </div>
          </div>

          <div id="ga-sources-list"></div>
        </div>

        <!-- Hard error -->
        <div id="ga-error" class="ga-hidden ga-source ga-err"></div>

      </div>
    </main>
  </div>
</div>

<script src="assets/js/theme.js"></script>
<script src="assets/js/utils.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/maintenance.js"></script>
<script>
  Auth.requireAuth();
  Layout.render('grafana-alerts');

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  // ── lucide-style inline icons (blocks.so aesthetic) ──
  const ICO = {
    pause:    '<rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/>',
    database: '<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/>',
    clock:    '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
    play:     '<polygon points="6 3 20 12 6 21 6 3"/>',
    external: '<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
    check:    '<path d="M20 6 9 17l-5-5"/>',
    alert:    '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
    refresh:  '<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>',
    spinner:  '<line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"/><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"/>',
  };
  const icon = (n, cls = '') => `<svg class="ico ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">${ICO[n] || ''}</svg>`;

  // Grafana newStateDate → "2 days ago" (+ absolute in title)
  function relSince(iso) {
    if (!iso) return { rel: '—', abs: '' };
    const t = new Date(iso);
    if (isNaN(t)) return { rel: '—', abs: '' };
    const now = Date.now();
    const diff = Math.max(0, now - t.getTime());
    const min = Math.floor(diff / 60000);
    const hr  = Math.floor(min / 60);
    const day = Math.floor(hr / 24);
    let rel;
    if (day >= 1)      rel = day + (day === 1 ? ' day ago' : ' days ago');
    else if (hr >= 1)  rel = hr + (hr === 1 ? ' hr ago' : ' hrs ago');
    else if (min >= 1) rel = min + ' min ago';
    else               rel = 'just now';
    const abs = t.toLocaleString('en-GB', { timeZone: 'Asia/Bangkok', dateStyle: 'medium', timeStyle: 'short' });
    return { rel, abs };
  }

  function fmtClock(iso) {
    const t = iso ? new Date(iso) : new Date();
    if (isNaN(t)) return '–';
    return t.toLocaleTimeString('en-GB', { timeZone: 'Asia/Bangkok', hour: '2-digit', minute: '2-digit' });
  }

  function badgeHtml(slug, n, kind) {
    // kind: 'paused' | 'zero' | 'err'
    if (kind === 'err') return `<span class="ga-count-badge err" id="badge-${esc(slug)}">${icon('alert')} error</span>`;
    if (kind === 'zero') return `<span class="ga-count-badge zero" id="badge-${esc(slug)}">${icon('check')} 0 paused</span>`;
    return `<span class="ga-count-badge" id="badge-${esc(slug)}">${icon('pause')} ${n} paused</span>`;
  }

  function sourceCard(s) {
    const org = s.orgId ? `org ${s.orgId}` : '';
    const head = (badge) => `
      <div class="ga-source-head">
        <span class="ga-dot" style="background:${esc(s.color || '#71717a')}"></span>
        <div>
          <div class="ga-source-name">${esc(s.name)}</div>
          <div class="ga-source-org">${esc(org)}</div>
        </div>
        ${badge}
      </div>`;

    if (s.error) {
      return `<div class="ga-source" data-slug="${esc(s.slug)}">
        ${head(badgeHtml(s.slug, 0, 'err'))}
        <div class="ga-state ga-err"><span class="ga-state-ico">${icon('alert')}</span><span>${esc(s.error)}</span></div>
      </div>`;
    }

    if (!s.alerts || s.alerts.length === 0) {
      return `<div class="ga-source" data-slug="${esc(s.slug)}">
        ${head(badgeHtml(s.slug, 0, 'zero'))}
        <div class="ga-state ga-empty"><span class="ga-state-ico">${icon('check')}</span><span>ไม่มี alert ที่ถูก paused ไว้</span></div>
      </div>`;
    }

    const rows = s.alerts.map(a => {
      const since = relSince(a.newStateDate);
      const link = a.url
        ? `<a class="ga-btn" href="${esc(a.url)}" target="_blank" rel="noopener">${icon('external')} Grafana</a>`
        : '';
      const resumeBtn = `<button class="ga-btn resume" data-action="write" data-name="${esc(a.name)}" onclick="resumeAlert('${esc(s.slug)}', ${a.id}, this)">${icon('play')} Resume</button>`;
      return `<tr id="al-${esc(s.slug)}-${a.id}">
        <td><span class="ga-alert-name">${esc(a.name)}</span></td>
        <td><span class="ga-tag"><span class="pd"></span>PAUSED</span></td>
        <td><span class="ga-since" title="${esc(since.abs)}">${esc(since.rel)}</span></td>
        <td class="right" style="white-space:nowrap">${resumeBtn}${link}</td>
      </tr>`;
    }).join('');

    return `<div class="ga-source" data-slug="${esc(s.slug)}">
      ${head(badgeHtml(s.slug, s.alerts.length, 'paused'))}
      <table class="ga-table">
        <thead><tr>
          <th>Alert rule</th><th>State</th><th>Paused since</th><th class="right">Action</th>
        </tr></thead>
        <tbody id="tbody-${esc(s.slug)}">${rows}</tbody>
      </table>
    </div>`;
  }

  // Resume (un-pause) a single alert. Writes to production Grafana — confirm first.
  async function resumeAlert(slug, id, btn) {
    const name = btn.dataset.name || 'this alert';
    const ok = await confirmDialog(
      `"${name}" — ถ้าเงื่อนไข alert กำลัง breach อยู่ จะยิง notification ทันที (อาจเข้า on-call / Google Chat) ยืนยัน resume?`,
      'Resume alert',
      { confirmText: '<i data-icon=\"play\"></i> Resume', cancelText: 'ยกเลิก', variant: 'primary' }
    );
    if (!ok) return;

    btn.disabled = true;
    const original = btn.innerHTML;
    btn.innerHTML = icon('spinner', 'spin') + ' …';

    const res = await API.grafanaAlerts.resume(slug, id);
    if (!res || !res.ok) {
      btn.disabled = false;
      btn.innerHTML = original;
      const msg = 'Resume ไม่สำเร็จ: ' + (res?.data?.message || `HTTP ${res?.status || '?'}`);
      if (window.Toast) Toast.error(msg); else console.error(msg);
      return;
    }

    // Remove the row and update counts inline.
    const row = document.getElementById(`al-${slug}-${id}`);
    if (row) row.remove();

    const totalEl = $('ga-total');
    const newTotal = Math.max(0, (parseInt(totalEl.textContent, 10) || 0) - 1);
    totalEl.textContent = newTotal;
    $('ga-total-sub').textContent = newTotal === 0 ? 'ทุก alert ทำงานปกติ' : $('ga-total-sub').textContent;

    const badge = document.getElementById(`badge-${slug}`);
    const tbody = document.getElementById(`tbody-${slug}`);
    const remaining = tbody ? tbody.querySelectorAll('tr').length : 0;
    if (badge) {
      badge.innerHTML = remaining === 0 ? icon('check') + ' 0 paused' : icon('pause') + ` ${remaining} paused`;
      if (remaining === 0) badge.classList.add('zero');
    }
    if (remaining === 0) {
      const card = document.querySelector(`.ga-source[data-slug="${CSS.escape(slug)}"]`);
      const table = card?.querySelector('.ga-table');
      if (table) {
        const empty = document.createElement('div');
        empty.className = 'ga-state ga-empty';
        empty.innerHTML = `<span class="ga-state-ico">${icon('check')}</span><span>resume ครบแล้ว — ไม่มี alert ที่ paused</span>`;
        table.replaceWith(empty);
      }
    }

    if (window.Toast) Toast.success(`Resumed · ${name}`);
  }

  async function loadPaused() {
    // Always fetch fresh: show loading, hide content/error.
    $('ga-loading').classList.remove('ga-hidden');
    $('ga-content').classList.add('ga-hidden');
    $('ga-error').classList.add('ga-hidden');
    $('ga-last-updated').textContent = '';

    const res = await API.get('/grafana-alerts/paused.php');
    if (!res) return; // auth flow handled by api.js

    if (!res.ok) {
      $('ga-loading').classList.add('ga-hidden');
      $('ga-error').classList.remove('ga-hidden');
      $('ga-error').innerHTML = `<div class="ga-state ga-err"><span class="ga-state-ico">${icon('alert')}</span><span>${esc(res.data?.message || `HTTP ${res.status}`)}</span></div>`;
      return;
    }

    const p = res.data?.data || {};
    const sources = p.sources || [];
    const total = p.total || 0;
    const okSources = sources.filter(s => !s.error).length;
    const errSources = sources.length - okSources;

    $('ga-total').textContent = total;
    $('ga-total-sub').textContent = total === 0 ? 'ทุก alert ทำงานปกติ' : 'across ' + okSources + ' sources';
    $('ga-sources').textContent = sources.length;
    $('ga-sources-sub').textContent = errSources > 0 ? (errSources + ' source มีปัญหาในการดึง') : 'ดึงสำเร็จทั้งหมด';
    $('ga-fetched').textContent = fmtClock(p.fetched_at);

    // Sort: sources with paused alerts first (desc), then errors, then clean.
    const ordered = [...sources].sort((a, b) => {
      const av = a.error ? -1 : (a.count || 0);
      const bv = b.error ? -1 : (b.count || 0);
      return bv - av;
    });

    $('ga-sources-list').innerHTML = ordered.map(sourceCard).join('');

    $('ga-loading').classList.add('ga-hidden');
    $('ga-content').classList.remove('ga-hidden');
    $('ga-last-updated').textContent = 'อัปเดต ' + fmtClock(p.fetched_at) + ' น.';
  }

  // Static KPI icons
  $('ga-ico-total').innerHTML = icon('pause');
  $('ga-ico-src').innerHTML   = icon('database');
  $('ga-ico-clock').innerHTML = icon('clock');

  // Fetch fresh on every page load.
  loadPaused();
</script>
</body>
</html>
