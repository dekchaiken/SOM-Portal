<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Documentation — SOM-Portal</title>
  <link rel="icon" href="./favicon.ico" type="image/x-icon">

  <!-- Theme system -->
  <script src="./assets/js/theme.js"></script>
  <link rel="stylesheet" href="./assets/css/dark.css">
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="stylesheet" href="./assets/css/ui-themes.css">

  <!-- Documentation viewer -->
  <link rel="stylesheet" href="./assets/css/hljs-theme.css">
  <link rel="stylesheet" href="./assets/css/docs-viewer.css">

  <!-- Markdown + syntax highlighting (scripts allowed by CSP script-src) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/php.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/css.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/json.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/bash.min.js"></script>
</head>
<body>

<div class="app-shell">
  <aside id="sidebar-mount"></aside>
  <script>/* sb-restore */(function(){try{var h=sessionStorage.getItem('_sm_sb_html');if(!h)return;var n=sessionStorage.getItem('_sm_sb_next')||'';var d=document.createElement('div');d.innerHTML=h;var sb=d.querySelector('.sidebar');if(!sb)return;sb.querySelectorAll('.nav-item').forEach(function(a){var f=(a.getAttribute('href')||'').split('/').pop().replace(/\.html.*$/,'');a.classList.toggle('active',!!n&&f===n);});var p=sb.querySelector('#nav-active-pill');if(p)p.style.opacity='0';var m=document.getElementById('sidebar-mount');if(m)m.replaceWith(sb);}catch(e){}})();</script>

  <div class="main-content">
    <!-- Topbar -->
    <header class="topbar">
      <div class="topbar-title">
        <div class="page-title">
          <i data-icon="book"></i>
          <span>Documentation</span>
        </div>
        <div class="page-sub" id="breadcrumb">SOM-Portal · Multi-Team คู่มือใช้งาน</div>
      </div>
      <div class="topbar-actions"></div>
    </header>

    <!-- Documentation Viewer -->
    <div class="docs-viewer-wrap">
      <!-- Table of Contents Sidebar -->
      <aside class="docs-toc" id="docs-toc">
        <div class="docs-toc-header">
          <h3>สารบัญ · Contents</h3>
          <button class="tb-icon-btn" id="toc-close" title="Close" style="width:28px;height:28px">
            <i data-icon="x"></i>
          </button>
        </div>
        <div class="docs-toc-body" id="toc-tree">
          <div class="toc-loading">
            <div class="spinner"></div>
            <p>Loading table of contents…</p>
          </div>
        </div>
      </aside>

      <!-- Content Area -->
      <main class="docs-content-wrap">
        <!-- Doc-specific action bar (sticky above content) -->
        <div class="docs-actionbar">
          <div class="docs-actionbar-left">
            <button class="doc-action" id="toc-toggle" title="Toggle Table of Contents">
              <i data-icon="menu"></i>
              <span>สารบัญ</span>
            </button>
          </div>
          <div class="docs-actionbar-right">
            <button class="doc-action" id="doc-search-btn" title="Search this documentation (Ctrl+K)">
              <i data-icon="search"></i>
              <span>ค้นหา</span>
              <kbd>⌘K</kbd>
            </button>
            <button class="doc-action icon-only" id="bookmarks-btn" title="Open bookmarks">
              <i data-icon="star"></i>
            </button>
            <button class="doc-action icon-only" id="bookmark-btn" title="Bookmark current page">
              <i data-icon="bookmark"></i>
            </button>
            <button class="doc-action icon-only" id="print-btn" title="Print current page">
              <i data-icon="printer"></i>
            </button>
          </div>
        </div>

        <div class="docs-page" id="docs-page">
          <div class="docs-page-inner" id="page-content">
            <div class="docs-loading">
              <div class="spinner-lg"></div>
              <p>Loading documentation…</p>
            </div>
          </div>
        </div>

        <!-- Navigation Footer (big card-style prev/next) -->
        <footer class="docs-nav-footer" id="docs-nav-footer" style="display:none">
          <button class="docs-nav-card prev" id="prev-btn" disabled>
            <span class="nav-icon"><i data-icon="chevron-left"></i></span>
            <span class="nav-labels">
              <span class="nav-hint">← Previous</span>
              <span class="nav-title-text" id="prev-title">—</span>
            </span>
          </button>
          <div class="docs-page-info">
            <span id="current-page">1</span>
            <span class="of">/</span>
            <span id="total-pages">1</span>
          </div>
          <button class="docs-nav-card next" id="next-btn">
            <span class="nav-labels">
              <span class="nav-hint">Next →</span>
              <span class="nav-title-text" id="next-title">—</span>
            </span>
            <span class="nav-icon"><i data-icon="chevron-right"></i></span>
          </button>
        </footer>
      </main>
    </div>
  </div>
</div>

<!-- Search Modal -->
<div class="modal" id="search-modal" style="display:none">
  <div class="modal-backdrop" onclick="closeSearchModal()"></div>
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h3>ค้นหาเอกสาร · Search</h3>
        <button class="btn-icon-sm" onclick="closeSearchModal()">
          <i data-icon="x"></i>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <input type="text" id="search-input" class="form-control" placeholder="พิมพ์คำที่ต้องการค้นหา…" autofocus>
        </div>
        <div id="search-results" class="search-results">
          <p class="text-muted">พิมพ์เพื่อค้นหาในเอกสารทั้งหมด</p>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Bookmarks Modal -->
<div class="modal" id="bookmarks-modal" style="display:none">
  <div class="modal-backdrop" onclick="closeBookmarksModal()"></div>
  <div class="modal-dialog" style="max-width:600px">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Bookmarks · บุ๊กมาร์ก</h3>
        <button class="btn-icon-sm" onclick="closeBookmarksModal()">
          <i data-icon="x"></i>
        </button>
      </div>
      <div class="modal-body">
        <div id="bookmarks-list" class="bookmarks-list">
          <p class="text-muted">ยังไม่มีบุ๊กมาร์ก · คลิกไอคอน bookmark ในหน้าใด ๆ เพื่อบันทึก</p>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Scripts -->
<script src="./assets/js/layout.js"></script>
<script src="./assets/js/auth.js"></script>
<script src="./assets/js/api.js"></script>
<script src="./assets/js/utils.js"></script>
<script src="./assets/js/docs-viewer.js"></script>

<script>
if (!Auth.requireAuth()) {}
Layout.render('documentation');
</script>

</body>
</html>
