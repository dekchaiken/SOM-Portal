<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Onboarding — SOM-Portal</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <script src="assets/js/theme.js"></script>
  <link rel="stylesheet" href="assets/css/dark.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    /* ════════════════════════════════════════════════
       BRUTALIST ONBOARDING — bold borders, hard shadows,
       big numbers, mono type. Light + dark adaptive.
       ════════════════════════════════════════════════ */

    /* Local design tokens (per-page, derived from theme vars) */
    :root {
      --ob-ink: var(--text);
      --ob-frame: var(--text);                /* main border/ink color */
      --ob-surface: var(--bg-card);
      --ob-surface-alt: var(--bg);
      --ob-shadow: 4px 4px 0 var(--text);     /* hard shadow */
      --ob-shadow-sm: 2px 2px 0 var(--text);
      --ob-shadow-hover: 6px 6px 0 var(--text);
      --ob-radius: 0px;
      --ob-radius-soft: 4px;
      --ob-bd: 2px;
      --ob-accent: var(--orange);
      --ob-accent-ink: #fff;
      --ob-ok: #10b981;
      --ob-danger: #ef4444;
      --ob-info: #3b82f6;
    }
    html[data-theme="dark"] {
      --ob-frame: #f5f5f5;
      --ob-shadow: 4px 4px 0 #f5f5f5;
      --ob-shadow-sm: 2px 2px 0 #f5f5f5;
      --ob-shadow-hover: 6px 6px 0 #f5f5f5;
    }

    /* ── Hero ─────────────────────────────────────── */
    .ob-hero {
      background: var(--ob-surface);
      border: var(--ob-bd) solid var(--ob-frame);
      box-shadow: var(--ob-shadow);
      border-radius: var(--ob-radius);
      padding: 26px 28px;
      margin-bottom: 26px;
      display: flex;
      justify-content: space-between;
      gap: 24px;
      align-items: stretch;
      flex-wrap: wrap;
      position: relative;
    }
    .ob-hero::before {
      content: 'ONBOARDING'; position: absolute; top: -11px; left: 18px;
      font-size: 10px; font-weight: 800; letter-spacing: .15em;
      background: var(--ob-frame); color: var(--ob-surface);
      padding: 3px 10px;
    }
    .ob-hero h1 { margin: 0 0 6px; font-size: 28px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1 }
    .ob-hero p { margin: 0; color: var(--text-muted); font-size: 13px; line-height: 1.65; font-weight: 500 }
    .ob-stats {
      display: flex; gap: 0; flex-shrink: 0;
      border: var(--ob-bd) solid var(--ob-frame);
    }
    .ob-stat {
      text-align: center; padding: 14px 22px;
      border-right: var(--ob-bd) solid var(--ob-frame);
      background: var(--ob-surface-alt);
      min-width: 90px;
    }
    .ob-stat:last-child { border-right: none }
    .ob-stat-n { font-size: 32px; font-weight: 900; color: var(--ob-frame); line-height: 1; letter-spacing: -.04em }
    .ob-stat-l {
      font-size: 9.5px; color: var(--text-muted); margin-top: 6px;
      text-transform: uppercase; letter-spacing: .12em; font-weight: 700;
    }

    /* ── Main tabs ─────────────────────────────────── */
    .ob-main-tabs {
      display: inline-flex; gap: 0; padding: 0;
      background: var(--ob-surface); border: var(--ob-bd) solid var(--ob-frame);
      box-shadow: var(--ob-shadow-sm);
      border-radius: var(--ob-radius); margin-bottom: 22px;
    }
    .ob-main-tab {
      padding: 10px 22px; border: none; background: none; cursor: pointer;
      font-family: var(--font); font-size: 12px; font-weight: 700;
      letter-spacing: .04em; text-transform: uppercase;
      border-right: var(--ob-bd) solid var(--ob-frame);
      color: var(--text-muted); transition: .12s;
    }
    .ob-main-tab:last-child { border-right: none }
    .ob-main-tab:hover { color: var(--ob-frame); background: var(--ob-surface-alt) }
    .ob-main-tab.active { background: var(--ob-frame); color: var(--ob-surface) }
    .ob-view { display: none }
    .ob-view.active { display: block }

    /* ── Chapter tabs ─────────────────────────────── */
    .ob-chap-tabs {
      display: flex; flex-wrap: wrap; gap: 0; margin-bottom: 24px;
      background: var(--ob-surface);
      border: var(--ob-bd) solid var(--ob-frame);
      box-shadow: var(--ob-shadow-sm);
      border-radius: var(--ob-radius); padding: 0;
    }
    .ob-chap-tab {
      flex: 1; min-width: 92px;
      padding: 12px 10px; border-radius: 0; font-size: 11px; font-weight: 700;
      letter-spacing: .04em; text-transform: uppercase;
      border: none; border-right: var(--ob-bd) solid var(--ob-frame); background: none;
      color: var(--text-muted); cursor: pointer; font-family: var(--font);
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: all .12s;
    }
    .ob-chap-tab:last-child { border-right: none }
    .ob-chap-tab:hover:not(.locked) { background: var(--ob-surface-alt); color: var(--ob-frame) }
    .ob-chap-tab.active {
      background: var(--ob-accent); color: var(--ob-accent-ink); box-shadow: none;
    }
    .ob-chap-tab.done { color: var(--ob-ok); background: var(--ob-surface-alt) }
    .ob-chap-tab.done:hover:not(.locked) { background: rgba(16,185,129,.12) }
    .ob-chap-tab.locked { opacity: .35; cursor: not-allowed }
    .ob-chap-tab .dot { display: none }
    .ob-chap-num {
      width: 22px; height: 22px; border-radius: 0; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 800;
      background: var(--ob-frame); color: var(--ob-surface);
      transition: background .12s;
    }
    .ob-chap-tab.active .ob-chap-num { background: var(--ob-accent-ink); color: var(--ob-accent) }
    .ob-chap-tab.done .ob-chap-num { background: var(--ob-ok); color: #fff }

    /* ── Chapter panel ─────────────────────────────── */
    .ob-chap { display: none }
    .ob-chap.active { display: block }
    .ob-chap-eyebrow {
      display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: .15em;
      text-transform: uppercase; color: var(--ob-accent-ink); background: var(--ob-accent);
      padding: 4px 10px; margin-bottom: 12px;
    }
    .ob-chap-title { font-size: 30px; font-weight: 900; margin-bottom: 8px; letter-spacing: -.025em; line-height: 1.1 }
    .ob-chap-desc {
      font-size: 13px; color: var(--text-muted); line-height: 1.7; margin-bottom: 24px;
      padding-bottom: 18px; border-bottom: var(--ob-bd) solid var(--ob-frame); font-weight: 500;
    }

    /* ── Cards ─────────────────────────────────────── */
    .ob-card {
      background: var(--ob-surface);
      border: var(--ob-bd) solid var(--ob-frame);
      box-shadow: var(--ob-shadow-sm);
      border-radius: var(--ob-radius);
      padding: 20px 22px; margin-bottom: 18px;
      transition: box-shadow .15s, transform .15s;
    }
    .ob-card:hover { box-shadow: var(--ob-shadow); transform: translate(-2px, -2px) }
    .ob-card-head {
      font-size: 11px; font-weight: 800; letter-spacing: .12em;
      text-transform: uppercase; color: var(--ob-frame);
      margin-bottom: 16px; display: flex; align-items: center; gap: 10px;
      padding-bottom: 10px; border-bottom: var(--ob-bd) solid var(--ob-frame);
    }
    .ob-card-head .ico {
      background: var(--ob-frame); color: var(--ob-surface);
      font-size: 11px; width: 22px; height: 22px;
      display: inline-flex; align-items: center; justify-content: center;
    }

    /* ── Checklist ─────────────────────────────────── */
    .ob-check {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 12px 0; border-bottom: var(--ob-bd) dashed var(--border);
      cursor: pointer; user-select: none; transition: padding .12s;
    }
    .ob-check:last-child { border-bottom: none }
    .ob-check:hover { padding-left: 4px }
    .ob-check:hover .ob-check-box { background: var(--ob-accent); border-color: var(--ob-accent) }
    .ob-check-box {
      width: 22px; height: 22px; border-radius: 0;
      border: var(--ob-bd) solid var(--ob-frame); flex-shrink: 0; margin-top: 1px;
      display: flex; align-items: center; justify-content: center;
      transition: all .15s; background: var(--ob-surface);
    }
    .ob-check-box.done { background: var(--ob-ok); border-color: var(--ob-frame) }
    .ob-check-box.done::after { content: "✓"; color: #fff; font-size: 14px; line-height: 1; font-weight: 900 }
    .ob-check-text { font-size: 13px; line-height: 1.55; flex: 1; font-weight: 500 }
    .ob-check-text.done { color: var(--text-muted); text-decoration: line-through }

    /* ── System list (ช่องทาง access) ──────────────── */
    .ob-syslist {
      width: 100%; border-collapse: collapse;
      border: var(--ob-bd) solid var(--ob-frame);
    }
    .ob-syslist th {
      font-size: 10px; text-transform: uppercase; letter-spacing: .12em;
      color: var(--ob-surface); background: var(--ob-frame);
      text-align: left; padding: 10px 12px;
      border-right: var(--ob-bd) solid var(--ob-surface);
      font-weight: 800;
    }
    .ob-syslist th:last-child { border-right: none }
    .ob-syslist td {
      font-size: 12.5px; padding: 12px;
      border-top: var(--ob-bd) solid var(--ob-frame);
      border-right: 1px dashed var(--border);
      vertical-align: top; font-weight: 500;
    }
    .ob-syslist td:last-child { border-right: none }
    .ob-syslist tr:nth-child(even) td { background: var(--ob-surface-alt) }
    .ob-syslist td.sys { font-weight: 800; text-transform: uppercase; letter-spacing: .04em }
    .ob-syslist td.url a { color: var(--ob-accent); text-decoration: none; font-size: 12px; word-break: break-all; font-weight: 700 }
    .ob-syslist td.url a:hover { text-decoration: underline }
    .cred-wrap { display:flex; flex-direction:column; gap:4px }
    .cred-user { font-size:12px; color:var(--text-muted); font-weight:600 }
    .cred-pass-row { display:flex; align-items:center; gap:4px }
    .cred-pass { font-family:var(--font); font-size:12px; letter-spacing:.04em; font-weight:700 }
    .cred-copy {
      border:var(--ob-bd) solid var(--ob-frame); background:var(--ob-surface);
      cursor:pointer; color:var(--ob-frame); padding:2px 6px; border-radius:0;
      font-size:11px; line-height:1; font-weight:700;
    }
    .cred-copy:hover { background:var(--ob-frame); color:var(--ob-surface) }

    /* ── Card list (info cards) ────────────────────── */
    .ob-cardlist {
      display: flex; flex-direction: column;
      border: var(--ob-bd) solid var(--ob-frame); border-radius: 0; overflow: hidden;
    }
    .ob-info {
      background: var(--ob-surface);
      padding: 14px 18px 14px 16px;
      border-bottom: var(--ob-bd) solid var(--ob-frame);
      border-left: 6px solid var(--ob-accent);
    }
    .ob-info:last-child { border-bottom: none }
    .ob-info-head { font-size: 13px; font-weight: 800; color: var(--ob-frame); margin-bottom: 4px; letter-spacing: -.005em }
    .ob-info-body { font-size: 12.5px; color: var(--text-muted); line-height: 1.7; font-weight: 500 }

    /* ── Dot card grid ──────────────────────────────── */
    .ob-dot-grid { display: grid; gap: 14px; grid-template-columns: repeat(4, 1fr) }
    .ob-dot-grid[data-cols="5"] { grid-template-columns: repeat(5, 1fr) }
    .ob-dot-grid[data-cols="3"] { grid-template-columns: repeat(3, 1fr) }
    .ob-dot-card {
      border-radius: 0; border: var(--ob-bd) solid var(--ob-frame);
      box-shadow: var(--ob-shadow-sm);
      padding: 16px; background: var(--ob-surface);
      transition: transform .15s, box-shadow .15s;
    }
    .ob-dot-card:hover {
      transform: translate(-2px, -2px);
      box-shadow: var(--ob-shadow);
    }
    .ob-dot-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px }
    .ob-dot { width: 12px; height: 12px; border-radius: 0; flex-shrink: 0; border: 2px solid var(--ob-frame) }
    .ob-dot-title { font-size: 14px; font-weight: 800; line-height: 1.25; letter-spacing: -.01em }
    .ob-dot-text { font-size: 11.5px; color: var(--text); line-height: 1.7; padding-left: 22px; font-weight: 500 }

    /* ── Slideshow (ch3 screens) ─────────────────── */
    .ob-slide-layout {
      display: grid; grid-template-columns: 55% 45%;
      border-radius: 0; overflow: hidden;
      border: var(--ob-bd) solid var(--ob-frame);
      box-shadow: var(--ob-shadow-sm);
      height: 500px;
    }
    .ob-slide-img-pane {
      background: var(--ob-surface-alt); position: relative; overflow: hidden;
      height: 100%; border-right: var(--ob-bd) solid var(--ob-frame);
    }
    .ob-slide-img {
      position: absolute; inset: 0;
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .ob-slide-img-empty {
      display: none; align-items: center; justify-content: center;
      height: 100%; font-size: 48px;
      color: var(--text-muted); flex-direction: column; gap: 8px;
    }
    .ob-slide-content-pane {
      padding: 24px 22px; background: var(--ob-surface);
      display: flex; flex-direction: column; gap: 12px;
      overflow-y: auto;
    }
    .ob-slide-eyebrow {
      display: inline-block; width: fit-content;
      font-size: 10px; font-weight: 800; letter-spacing: .15em;
      text-transform: uppercase; background: var(--ob-frame); color: var(--ob-surface);
      padding: 3px 8px;
    }
    .ob-slide-title { font-size: 18px; font-weight: 800; line-height: 1.3; letter-spacing: -.015em }
    .ob-slide-body {
      font-size: 12.5px; color: var(--text-muted);
      line-height: 1.75; flex: 1; font-weight: 500;
    }
    .ob-slide-nav {
      display: flex; align-items: center;
      justify-content: space-between; gap: 8px; margin-top: 8px;
      padding-top: 12px; border-top: var(--ob-bd) solid var(--ob-frame);
    }
    .ob-slide-dots { display: flex; gap: 5px; align-items: center }
    .ob-slide-dot {
      width: 12px; height: 12px; border-radius: 0;
      border: var(--ob-bd) solid var(--ob-frame); background: var(--ob-surface); cursor: pointer;
      padding: 0; transition: background .15s;
    }
    .ob-slide-dot.active { background: var(--ob-frame) }

    /* ── Lightbox ────────────────────────────────── */
    .ob-lightbox {
      position: fixed; inset: 0; z-index: 9999;
      background: rgba(0,0,0,.92);
      display: flex; align-items: center; justify-content: center;
      cursor: zoom-out; opacity: 0; pointer-events: none;
      transition: opacity .2s;
    }
    .ob-lightbox.show { opacity: 1; pointer-events: all }
    .ob-lightbox img {
      max-width: 92vw; max-height: 90vh;
      object-fit: contain; border-radius: 0;
      border: 3px solid #fff;
      box-shadow: 8px 8px 0 var(--ob-accent);
      cursor: default;
    }
    .ob-lightbox-close {
      position: fixed; top: 18px; right: 22px;
      background: #fff; border: 3px solid #000; color: #000;
      font-size: 18px; line-height: 1; width: 40px; height: 40px;
      border-radius: 0; cursor: pointer; display: flex;
      align-items: center; justify-content: center; font-weight: 900;
      transition: transform .15s;
    }
    .ob-lightbox-close:hover { transform: rotate(90deg) }
    .ob-slide-img-pane { cursor: zoom-in }

    @media (max-width: 700px) {
      .ob-slide-layout { grid-template-columns: 1fr }
      .ob-slide-img-pane { min-height: 180px }
    }
    @media (max-width: 900px) {
      .ob-dot-grid,
      .ob-dot-grid[data-cols="5"],
      .ob-dot-grid[data-cols="3"] { grid-template-columns: repeat(2, 1fr) }
    }
    @media (max-width: 480px) {
      .ob-dot-grid,
      .ob-dot-grid[data-cols="5"],
      .ob-dot-grid[data-cols="3"] { grid-template-columns: 1fr }
    }

    /* ── Quiz block ────────────────────────────────── */
    .ob-quiz-item {
      padding: 16px 0; border-bottom: var(--ob-bd) dashed var(--border);
    }
    .ob-quiz-item:last-child { border-bottom: none }
    .ob-quiz-q {
      font-size: 13px; font-weight: 700; color: var(--ob-frame); margin-bottom: 10px;
      display: flex; gap: 10px; align-items: flex-start; letter-spacing: -.005em;
    }
    .ob-quiz-num {
      flex-shrink: 0; width: 24px; height: 24px; border-radius: 0;
      background: var(--ob-frame); color: var(--ob-surface);
      font-size: 12px; font-weight: 900; display: flex; align-items: center; justify-content: center;
    }
    .ob-quiz-wrap { position: relative }
    .ob-quiz-ans {
      width: 100%; min-height: 90px; resize: vertical;
      font-family: var(--font); font-size: 13px; line-height: 1.6;
      padding: 12px 14px;
      background: var(--ob-surface-alt); color: var(--ob-frame);
      border: var(--ob-bd) solid var(--ob-frame); border-radius: 0;
      transition: box-shadow .12s; font-weight: 500;
    }
    .ob-quiz-ans:focus { outline: none; box-shadow: var(--ob-shadow-sm) }
    .ob-quiz-status {
      position: absolute; top: 8px; right: 10px; font-size: 10px;
      color: var(--ob-surface); background: var(--ob-frame);
      border: var(--ob-bd) solid var(--ob-frame); padding: 3px 8px; border-radius: 0;
      pointer-events: none; opacity: 0; transition: opacity .2s;
      font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
    }
    .ob-quiz-status.show { opacity: 1 }
    .ob-quiz-hint {
      font-size: 11px; color: var(--text-muted); margin-top: 6px;
      display: flex; align-items: center; gap: 4px; font-weight: 600;
    }

    /* ── Scored Quiz (MCQ) ────────────────────────── */
    .sq-question {
      padding: 18px 20px; border-bottom: var(--ob-bd) solid var(--ob-frame);
    }
    .sq-question:last-child { border-bottom: none }
    .sq-q-text {
      font-size: 13px; font-weight: 700; color: var(--ob-frame);
      display: flex; gap: 12px; align-items: flex-start; margin-bottom: 14px;
      letter-spacing: -.005em;
    }
    .sq-q-num {
      flex-shrink: 0; min-width: 28px; height: 28px; border-radius: 0;
      background: var(--ob-frame); color: var(--ob-surface);
      font-size: 12px; font-weight: 900; display: flex; align-items: center; justify-content: center;
    }
    .sq-choices { display: flex; flex-direction: column; gap: 8px }
    .sq-choice {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 12px 14px; border-radius: 0;
      border: var(--ob-bd) solid var(--ob-frame); background: var(--ob-surface);
      cursor: pointer; transition: transform .12s, box-shadow .12s; font-size: 13px;
      font-weight: 500;
    }
    .sq-choice:hover:not(.locked) { transform: translate(-2px, -2px); box-shadow: var(--ob-shadow-sm) }
    .sq-choice input[type=radio] { display: none }
    .sq-radio {
      flex-shrink: 0; width: 18px; height: 18px; border-radius: 0;
      border: var(--ob-bd) solid var(--ob-frame); margin-top: 1px;
      display: flex; align-items: center; justify-content: center;
      transition: background .12s; background: var(--ob-surface);
    }
    .sq-choice.selected .sq-radio { background: var(--ob-accent); border-color: var(--ob-frame) }
    .sq-choice.selected .sq-radio::after {
      content: '✓'; color: #fff; font-size: 13px; font-weight: 900; line-height: 1;
    }
    .sq-choice.selected { background: var(--ob-surface-alt); transform: translate(-2px, -2px); box-shadow: var(--ob-shadow-sm) }
    .sq-choice.correct-shown  { background: rgba(16,185,129,.15); border-color: var(--ob-ok) }
    .sq-choice.correct-shown .sq-radio { background: var(--ob-ok); border-color: var(--ob-ok) }
    .sq-choice.correct-shown .sq-radio::after { content: '✓'; color: #fff }
    .sq-choice.wrong-shown    { background: rgba(239,68,68,.12); border-color: var(--ob-danger) }
    .sq-choice.wrong-shown .sq-radio { background: var(--ob-danger); border-color: var(--ob-danger) }
    .sq-choice.wrong-shown .sq-radio::after { content: '✕'; color: #fff; font-weight: 900; font-size: 12px }
    .sq-choice.locked { cursor: default }
    .sq-choice.locked:hover { transform: none; box-shadow: none }
    .sq-choice-label { flex: 1; line-height: 1.55 }
    .sq-result-badge {
      flex-shrink: 0; font-size: 16px; margin-left: auto; font-weight: 900;
    }
    .sq-explain {
      margin-top: 10px; padding: 10px 14px;
      background: var(--ob-surface-alt); border: var(--ob-bd) dashed var(--ob-frame); border-radius: 0;
      font-size: 12px; color: var(--ob-frame); line-height: 1.65; font-weight: 500;
    }
    .sq-footer {
      padding: 18px 20px; display: flex; align-items: center; gap: 12px;
      border-top: var(--ob-bd) solid var(--ob-frame); background: var(--ob-surface-alt);
    }
    .sq-submit-btn {
      padding: 11px 26px; border-radius: 0; font-size: 12px; font-weight: 900;
      letter-spacing: .08em; text-transform: uppercase;
      background: var(--ob-frame); color: var(--ob-surface);
      border: var(--ob-bd) solid var(--ob-frame); cursor: pointer;
      box-shadow: var(--ob-shadow-sm);
      transition: transform .12s, box-shadow .12s;
      font-family: var(--font);
    }
    .sq-submit-btn:hover:not(:disabled) { transform: translate(-2px, -2px); box-shadow: var(--ob-shadow) }
    .sq-submit-btn:disabled { opacity: .35; cursor: not-allowed; box-shadow: none }
    .sq-submit-hint { font-size: 11.5px; color: var(--text-muted); flex: 1; font-weight: 600 }
    .sq-score-banner {
      margin: 14px 20px; padding: 18px 20px; border-radius: 0;
      text-align: center; border: var(--ob-bd) solid var(--ob-frame);
      box-shadow: var(--ob-shadow-sm);
    }
    .sq-score-banner.pass { background: rgba(16,185,129,.15) }
    .sq-score-banner.fail { background: rgba(242,100,25,.12) }
    .sq-score-num { font-size: 40px; font-weight: 900; line-height: 1; letter-spacing: -.04em }
    .sq-score-banner.pass .sq-score-num { color: var(--ob-ok) }
    .sq-score-banner.fail .sq-score-num { color: var(--ob-accent) }
    .sq-score-label { font-size: 11px; color: var(--text-muted); margin-top: 6px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em }
    .sq-attempts-badge {
      font-size: 10px; color: var(--ob-frame); padding: 4px 10px;
      border: var(--ob-bd) solid var(--ob-frame); border-radius: 0;
      white-space: nowrap; font-weight: 800; text-transform: uppercase; letter-spacing: .08em;
    }

    /* Exam status card */
    .sq-status-card {
      padding: 16px 20px; display: flex; align-items: center; gap: 14px;
    }
    .sq-status-score { font-size: 28px; font-weight: 900; letter-spacing: -.03em }
    .sq-status-score.pass { color: var(--ob-ok) }
    .sq-status-score.fail { color: var(--ob-accent) }

    /* ── Free text (notebook) ──────────────────────── */
    .ob-notebook-wrap { position: relative }
    .ob-notebook {
      width: 100%; min-height: 170px; resize: vertical;
      font-family: var(--font); font-size: 13px; line-height: 1.65;
      padding: 14px 16px;
      background: var(--ob-surface-alt); color: var(--ob-frame);
      border: var(--ob-bd) solid var(--ob-frame); border-radius: 0;
      transition: box-shadow .12s; font-weight: 500;
    }
    .ob-notebook:focus { outline: none; box-shadow: var(--ob-shadow-sm) }
    .ob-notebook-status {
      position: absolute; top: 10px; right: 12px; font-size: 10px;
      color: var(--ob-surface); background: var(--ob-frame);
      border: var(--ob-bd) solid var(--ob-frame); padding: 3px 8px; border-radius: 0;
      pointer-events: none; opacity: 0; transition: opacity .2s;
      font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
    }
    .ob-notebook-status.show { opacity: 1 }

    /* ── PDF list ──────────────────────────────────── */
    .ob-pdf-row {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 16px; border: var(--ob-bd) solid var(--ob-frame);
      box-shadow: var(--ob-shadow-sm);
      border-radius: 0; margin-bottom: 10px; background: var(--ob-surface);
      transition: transform .12s, box-shadow .12s;
    }
    .ob-pdf-row:hover { transform: translate(-2px, -2px); box-shadow: var(--ob-shadow) }
    .ob-pdf-icon {
      font-size: 18px; line-height: 1; flex-shrink: 0;
      width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
      background: var(--ob-frame); color: var(--ob-surface);
    }
    .ob-pdf-info { flex: 1; min-width: 0 }
    .ob-pdf-name { font-size: 13px; font-weight: 800; word-break: break-all; letter-spacing: -.005em }
    .ob-pdf-meta { font-size: 11px; color: var(--text-muted); margin-top: 3px; font-weight: 600 }
    .ob-pdf-actions { display: flex; gap: 6px; flex-shrink: 0 }
    .ob-pdf-actions a, .ob-pdf-actions button {
      padding: 7px 14px; border-radius: 0; font-size: 11px; font-weight: 800;
      letter-spacing: .06em; text-transform: uppercase;
      border: var(--ob-bd) solid var(--ob-frame); background: var(--ob-surface);
      color: var(--ob-frame); text-decoration: none; cursor: pointer;
      font-family: var(--font); transition: background .12s, color .12s;
    }
    .ob-pdf-actions a:hover, .ob-pdf-actions button:hover {
      background: var(--ob-frame); color: var(--ob-surface);
    }
    .ob-pdf-actions a.primary { background: var(--ob-accent); border-color: var(--ob-frame); color: var(--ob-accent-ink) }
    .ob-pdf-empty { color: var(--text-muted); font-size: 12.5px; padding: 22px 0; text-align: center; font-weight: 600 }

    /* ── Nav row ───────────────────────────────────── */
    .ob-nav-row {
      display: flex; justify-content: space-between; margin-top: 26px; gap: 12px;
      padding-top: 18px; border-top: var(--ob-bd) dashed var(--border);
    }
    .ob-btn {
      padding: 11px 22px; border-radius: 0; font-size: 12px; font-weight: 800;
      letter-spacing: .06em; text-transform: uppercase;
      border: var(--ob-bd) solid var(--ob-frame); background: var(--ob-surface);
      box-shadow: var(--ob-shadow-sm);
      color: var(--ob-frame); cursor: pointer; font-family: var(--font);
      display: inline-flex; align-items: center; gap: 8px; transition: transform .12s, box-shadow .12s;
    }
    .ob-btn:hover:not(:disabled) { transform: translate(-2px, -2px); box-shadow: var(--ob-shadow) }
    .ob-btn:disabled { opacity: .35; cursor: not-allowed; box-shadow: none }
    .ob-btn.primary {
      background: var(--ob-accent); border-color: var(--ob-frame); color: var(--ob-accent-ink);
    }
    .ob-btn.primary:hover:not(:disabled) {
      background: var(--ob-accent); border-color: var(--ob-frame); color: var(--ob-accent-ink);
    }
    .ob-btn.success { background: var(--ob-ok); border-color: var(--ob-frame); color: #fff }
    .ob-btn.success:hover:not(:disabled) { background: var(--ob-ok); color: #fff }

    /* ── Progress bar (hero) ──────────────────────── */
    .ob-progress {
      height: 10px; background: var(--ob-surface-alt);
      border: var(--ob-bd) solid var(--ob-frame); border-radius: 0; overflow: hidden;
      margin-top: 14px;
    }
    .ob-progress > div {
      height: 100%;
      background: repeating-linear-gradient(
        45deg,
        var(--ob-accent),
        var(--ob-accent) 6px,
        var(--ob-accent-ink) 6px,
        var(--ob-accent-ink) 12px
      );
      background-color: var(--ob-accent);
      transition: width .4s;
    }

    /* ── Flow & Architecture ──────────────────────── */
    .ob-flow-tabs { display: flex; gap: 0; margin-bottom: 20px; border: var(--ob-bd) solid var(--ob-frame); width: fit-content }
    .ob-flow-tab {
      padding: 9px 18px; border-radius: 0; font-size: 11px; font-weight: 800;
      letter-spacing: .06em; text-transform: uppercase;
      border: none; border-right: var(--ob-bd) solid var(--ob-frame);
      background: var(--ob-surface); cursor: pointer;
      color: var(--text-muted); font-family: var(--font);
    }
    .ob-flow-tab:last-child { border-right: none }
    .ob-flow-tab:hover { color: var(--ob-frame); background: var(--ob-surface-alt) }
    .ob-flow-tab.active { background: var(--ob-frame); color: var(--ob-surface) }
    .ob-flow-panel { display: none }
    .ob-flow-panel.active { display: block }

    .ob-arch-layers { display: grid; gap: 14px; grid-template-columns: repeat(3, 1fr); margin-bottom: 16px }
    @media (max-width: 768px) { .ob-arch-layers { grid-template-columns: 1fr } }
    .ob-arch-layer {
      background: var(--ob-surface); border: var(--ob-bd) solid var(--ob-frame);
      box-shadow: var(--ob-shadow-sm);
      border-radius: 0; padding: 16px;
    }
    .ob-layer-head {
      font-size: 10px; font-weight: 800; letter-spacing: .15em;
      text-transform: uppercase; margin-bottom: 14px;
      padding-bottom: 8px; border-bottom: var(--ob-bd) solid var(--ob-frame);
    }
    .ob-arch-node {
      padding: 10px 12px; border-radius: 0; margin-bottom: 8px;
      font-size: 12px; font-weight: 700;
      border: var(--ob-bd) solid currentColor;
    }
    .ob-arch-node .sub { font-size: 11px; font-weight: 500; opacity: .85; margin-top: 3px }

    .ob-reqflow {
      background: var(--ob-surface); border: var(--ob-bd) solid var(--ob-frame);
      box-shadow: var(--ob-shadow-sm);
      border-radius: 0; padding: 18px; margin-bottom: 16px;
    }
    .ob-reqflow-title {
      font-size: 10px; font-weight: 800; letter-spacing: .15em; text-transform: uppercase;
      color: var(--ob-frame); margin-bottom: 14px;
      padding-bottom: 8px; border-bottom: var(--ob-bd) solid var(--ob-frame);
    }
    .ob-reqflow-row {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px;
    }
    .ob-flow-node {
      padding: 6px 14px; border-radius: 0; font-size: 12px; font-weight: 800;
      color: #fff; border: 2px solid var(--ob-frame);
    }
    .ob-flow-arrow { color: var(--ob-frame); font-size: 18px; font-weight: 900 }
    .ob-reqflow-note {
      font-size: 12.5px; color: var(--text-muted); line-height: 1.75; font-weight: 500;
      padding-top: 14px; border-top: var(--ob-bd) dashed var(--border);
    }

    .ob-wf-step { display: flex; gap: 16px; padding: 16px 0; border-bottom: var(--ob-bd) dashed var(--border) }
    .ob-wf-step:last-child { border-bottom: none }
    .ob-wf-num {
      width: 36px; height: 36px; border-radius: 0; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; font-weight: 900; color: #fff;
      border: 2px solid var(--ob-frame);
    }
    .ob-wf-title { font-size: 15px; font-weight: 800; margin-bottom: 5px; letter-spacing: -.01em }
    .ob-wf-desc { font-size: 12.5px; color: var(--text-muted); line-height: 1.7; font-weight: 500 }
    .ob-wf-tags { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap }
    .ob-wf-tag {
      font-size: 10px; font-weight: 800; padding: 3px 10px; border-radius: 0;
      background: var(--ob-surface-alt); border: var(--ob-bd) solid var(--ob-frame);
      color: var(--ob-frame); letter-spacing: .04em; text-transform: uppercase;
    }

    /* ── Finish banner ────────────────────────────── */
    .ob-finish {
      text-align: center; padding: 40px 24px;
      background: var(--ob-surface);
      border: var(--ob-bd) solid var(--ob-frame);
      box-shadow: var(--ob-shadow);
      border-radius: 0; margin-bottom: 18px;
      position: relative;
    }
    .ob-finish::before {
      content: '★ COMPLETE'; position: absolute; top: -12px; left: 50%;
      transform: translateX(-50%);
      font-size: 11px; font-weight: 900; letter-spacing: .2em;
      background: var(--ob-ok); color: #fff; padding: 4px 14px;
      border: var(--ob-bd) solid var(--ob-frame);
    }
    .ob-finish .big { font-size: 48px; margin-bottom: 10px; line-height: 1 }
    .ob-finish h2 { margin: 0 0 10px; font-size: 24px; font-weight: 900; letter-spacing: -.02em }
    .ob-finish p { margin: 0 0 22px; color: var(--text-muted); font-size: 13px; font-weight: 500; line-height: 1.65 }

    /* ── Load skeleton ────────────────────────────── */
    .ob-skel {
      padding: 60px 20px; text-align: center; color: var(--text-muted);
      font-weight: 700; text-transform: uppercase; letter-spacing: .08em;
    }

    /* ── Process Flow Diagrams (Chapter 4) ─────────── */
    .pf-badge {
      display: inline-block; font-size: 10px; font-weight: 900; letter-spacing: .15em;
      text-transform: uppercase; padding: 4px 12px; border-radius: 0;
      background: var(--ob-frame); color: var(--ob-surface); margin-bottom: 16px;
    }
    .pf-node {
      display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 10px 14px; border-radius: 0; text-align: center;
      border: var(--ob-bd) solid var(--ob-frame); background: var(--ob-surface);
      font-size: 12px; font-weight: 800; line-height: 1.4; flex-shrink: 0;
      color: var(--ob-frame);
      box-shadow: var(--ob-shadow-sm);
    }
    .pf-node.sm     { font-size: 11px; padding: 7px 10px; box-shadow: 1px 1px 0 var(--ob-frame) }
    .pf-node.hub    { background: var(--ob-accent); color: var(--ob-accent-ink); border-color: var(--ob-frame); font-size: 13px; padding: 14px 22px; border-radius: 0; font-weight: 900 }
    .pf-node.green  { background: rgba(16,185,129,.15); border-color: var(--ob-frame); color: var(--ob-ok) }
    .pf-node.orange { background: rgba(242,100,25,.15);  border-color: var(--ob-frame);  color: var(--ob-accent) }
    .pf-node.red    { background: rgba(239,68,68,.15);   border-color: var(--ob-frame);   color: var(--ob-danger) }
    .pf-node.blue   { background: rgba(59,130,246,.15);  border-color: var(--ob-frame);   color: var(--ob-info) }
    .pf-node.purple { background: rgba(139,92,246,.15);  border-color: var(--ob-frame);   color: #8b5cf6 }
    .pf-node.pink   { background: rgba(236,72,153,.15);  border-color: var(--ob-frame);   color: #ec4899 }
    .pf-arr  { color: var(--ob-frame); font-size: 20px; flex-shrink: 0; line-height: 1; font-weight: 900 }
    .pf-row  { display: flex; align-items: center; gap: 10px }
    .pf-col  { display: flex; flex-direction: column; gap: 10px }
    .pf-wrap { overflow-x: auto; padding-bottom: 6px }
    .pf-dashed { border: var(--ob-bd) dashed var(--ob-frame); border-radius: 0; padding: 14px }
    .pf-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px }
    .pf-label {
      font-size: 10px; font-weight: 800; color: var(--ob-frame);
      letter-spacing: .12em; text-transform: uppercase; margin-bottom: 6px;
    }
    .pf-note {
      font-size: 11.5px; color: var(--ob-frame); line-height: 1.7; padding: 12px 14px;
      background: var(--ob-surface-alt); border-radius: 0; margin-top: 14px;
      border: var(--ob-bd) solid var(--ob-frame); border-left-width: 6px;
      border-left-color: var(--ob-accent); font-weight: 500;
    }
    @media (max-width: 600px) { .pf-grid { grid-template-columns: repeat(2, 1fr) } }

    /* ── Misc — content inside cards (h3/h4, paragraphs) ──── */
    .ob-chap h3 { font-size: 16px; font-weight: 800; margin: 16px 0 8px; letter-spacing: -.01em }
    .ob-chap h4 { font-size: 14px; font-weight: 800; margin: 12px 0 6px; letter-spacing: -.005em }
    .ob-chap p { font-size: 13px; line-height: 1.75; color: var(--text); margin: 0 0 10px; font-weight: 500 }
    .ob-chap strong, .ob-chap b { font-weight: 800 }
    .ob-chap code {
      background: var(--ob-surface-alt); border: 1px solid var(--ob-frame);
      padding: 1px 6px; font-family: var(--font); font-size: 12px; font-weight: 700;
    }
  </style>
</head>
<body>

<div class="app-shell">
  <aside id="sidebar-mount"></aside>

  <div class="main-content">
    <header class="topbar">
      <div class="topbar-title">
        <div class="page-title">🧭 Team Onboarding</div>
        <div class="page-sub">ปฐมนิเทศก่อนเริ่มเรียนรู้คอร์สทั้งหมด</div>
      </div>
    </header>

    <main class="page-content" id="page">
      <div class="ob-skel">⏳ กำลังโหลด…</div>
    </main>
  </div>
</div>

<script src="assets/js/utils.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/api.js?v=cb1"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/maintenance.js"></script>
<script>
  if (!Auth.requireAuth()) {}
  Layout.render('learn');

  const state = {
    config: null,
    progress: null,
    currentChapterIdx: 0,
    mainView: 'plan',
    flowView: 'arch',
    notebookTimers: {}, // chapter_id → timeout id
    pdfFiles: [],
    slideIdx: {},       // blockId → current slide index
    examDraft: {},      // chapter_id → { question_id → choice_id }
    examLastResult: {}, // chapter_id → last submit result payload
  };

  (async function init() {
    try {
      const [cfgRes, progRes, pdfRes] = await Promise.all([
        API.onboarding.getConfig(),
        API.onboarding.myProgress(),
        API.onboarding.listPdfs(),
      ]);

      if (!cfgRes?.ok || !progRes?.ok) {
        document.getElementById('page').innerHTML =
          '<div class="ob-skel">ไม่สามารถโหลดข้อมูล onboarding ได้</div>';
        return;
      }

      state.config   = cfgRes.data.data;
      state.progress = progRes.data.data;
      state.pdfFiles = (pdfRes?.ok ? pdfRes.data.data : []) || [];

      // If user already finished → go to learn (unless opened in review mode from learn.html)
      const _reviewMode = new URLSearchParams(location.search).get('review') === '1';
      if (state.progress.finished_at && !_reviewMode) {
        window.location.replace('learn.html');
        return;
      }

      // Jump to first non-completed chapter
      const chs = state.config.chapters || [];
      const chState = state.progress.chapter_state || [];
      const firstIncomplete = chState.findIndex(c => !c.completed && (chState[0]?.id === c.id || isUnlocked(c.id)));
      state.currentChapterIdx = Math.max(0, chs.findIndex(c => {
        const cs = chState.find(x => x.id === c.id);
        return cs && !cs.completed && cs.unlocked !== false;
      }));
      if (state.currentChapterIdx < 0) state.currentChapterIdx = 0;

      render();
    } catch (e) {
      console.error(e);
      document.getElementById('page').innerHTML =
        '<div class="ob-skel">เกิดข้อผิดพลาด: ' + escHtml(e.message || e) + '</div>';
    }
  })();

  function isUnlocked(chapterId) {
    const cs = (state.progress.chapter_state || []).find(x => x.id === chapterId);
    return cs ? cs.unlocked : false;
  }

  function isDone(chapterId) {
    const cs = (state.progress.chapter_state || []).find(x => x.id === chapterId);
    return cs ? cs.completed : false;
  }

  function taskChecked(chapterId, taskId) {
    const ct = state.progress.completed_tasks || {};
    const arr = ct[chapterId] || [];
    return arr.includes(taskId);
  }

  function render() {
    const { config, progress } = state;
    const intro = config.intro || {};
    const chapters = config.chapters || [];
    const pct = progress.percent || 0;

    const page = document.getElementById('page');
    page.innerHTML = `
      <div class="ob-hero">
        <div>
          <h1>${escHtml(intro.title || 'ยินดีต้อนรับเข้าทีม 👋')}</h1>
          <p>${escHtml(intro.subtitle || '')}${intro.description ? '<br>' + escHtml(intro.description) : ''}</p>
          <div class="ob-progress"><div style="width:${pct}%"></div></div>
        </div>
        <div class="ob-stats">
          <div class="ob-stat"><div class="ob-stat-n">${chapters.length}</div><div class="ob-stat-l">บท</div></div>
          <div class="ob-stat"><div class="ob-stat-n">${progress.done_tasks || 0}</div><div class="ob-stat-l">งานเสร็จ</div></div>
          <div class="ob-stat"><div class="ob-stat-n">${progress.total_tasks || 0}</div><div class="ob-stat-l">งานทั้งหมด</div></div>
        </div>
      </div>

      <div class="ob-main-tabs">
        <button class="ob-main-tab active" style="cursor:default">📋 แผน ${chapters.length} บท เริ่มต้นการเป็น SM</button>
      </div>

      <div class="ob-view active">${renderPlanView()}</div>
    `;

    bindNotebooks();
    bindQuizzes();
    bindScoredQuizChoices();
  }

  // ─── Plan view ────────────────────────────────────────────
  function renderPlanView() {
    const chapters = state.config.chapters || [];
    const allDone = state.progress.all_done;

    const tabs = chapters.map((ch, i) => {
      const locked = !isUnlocked(ch.id);
      const done = isDone(ch.id);
      const active = i === state.currentChapterIdx;
      const cls = [
        active ? 'active' : (done ? 'done' : ''),
        locked && !active ? 'locked' : '',
      ].filter(Boolean).join(' ');
      return `<button class="ob-chap-tab ${cls}"
                      onclick="${locked ? `Toast.warning('ทำบทก่อนหน้าให้ครบก่อนจึงจะปลดล็อก')` : `switchChapter(${i})`}"
                      title="${locked ? 'ยังล็อกอยู่ — ทำบทก่อนหน้าให้ครบก่อน' : ''}">
        <span class="ob-chap-num">${done ? '✓' : (i + 1)}</span>
        <span>${escHtml(ch.title || ch.label)}</span>
      </button>`;
    }).join('');

    const finishBanner = allDone ? `
      <div class="ob-finish">
        <div class="big">🎉</div>
        <h2>ทำครบทุกบทแล้ว!</h2>
        <p>กด "เข้าสู่ Learning" เพื่อเริ่มเรียนคอร์สต่อไป หลังจากนี้จะไม่เห็นหน้า Onboarding อีก</p>
        <button class="ob-btn success" onclick="finishOnboarding()">เข้าสู่ Learning →</button>
      </div>
    ` : '';

    const panels = chapters.map((ch, i) => renderChapterPanel(ch, i)).join('');

    return `
      ${finishBanner}
      <div class="ob-chap-tabs">${tabs}</div>
      ${panels}
    `;
  }

  function renderChapterPanel(ch, idx) {
    const active = idx === state.currentChapterIdx;
    const blocks = (ch.blocks || []).map(b => renderBlock(ch, b)).join('');
    const tasks  = renderTaskChecklist(ch);
    const notebook = renderNotebook(ch);
    const nextLocked = idx < (state.config.chapters.length - 1) && !isDone(ch.id);

    return `
      <div class="ob-chap ${active ? 'active' : ''}" id="chap-${escHtml(ch.id)}">
        <div class="ob-chap-eyebrow">${escHtml(ch.label || ('บทที่ ' + (idx+1)))}</div>
        <div class="ob-chap-title">${escHtml(ch.title || '')}</div>
        <div class="ob-chap-desc">${escHtml(ch.description || '')}</div>

        ${blocks}
        ${tasks}
        ${notebook}

        <div class="ob-nav-row">
          <button class="ob-btn" onclick="switchChapter(${idx - 1})" ${idx === 0 ? 'disabled' : ''}>← บทก่อนหน้า</button>
          <button class="ob-btn primary"
                  onclick="switchChapter(${idx + 1})"
                  ${idx === state.config.chapters.length - 1 || nextLocked ? 'disabled' : ''}
                  title="${nextLocked ? 'ทำ task ให้ครบก่อน' : ''}">
            ${idx === state.config.chapters.length - 1 ? 'บทสุดท้าย' : 'บทถัดไป →'}
          </button>
        </div>
      </div>
    `;
  }

  function renderBlock(ch, block) {
    if (block.id === 'b3_overview_img') return '';
    const t = block.type || '';

    if (t === 'checklist') {
      const items = (block.items || []).map(it => `
        <div class="ob-check" style="cursor:default">
          <div class="ob-check-box"></div>
          <div class="ob-check-text">${escHtml(it)}</div>
        </div>
      `).join('');
      return `<div class="ob-card">
        <div class="ob-card-head"><span class="ico">☰</span>${escHtml(block.title || '')}</div>
        ${items}
      </div>`;
    }

    if (t === 'system_list') {
      const hasCreds = (block.items || []).some(it => it.user || it.pass);
      const rows = (block.items || []).map(it => {
        let credCell = '-';
        if (it.user || it.pass) {
          const uid = 'p' + Math.random().toString(36).slice(2,8);
          const safePass = escHtml(it.pass || '');
          credCell = `<div class="cred-wrap">
            ${it.user ? `<span class="cred-user">👤 ${escHtml(it.user)}</span>` : ''}
            ${it.pass ? `<div class="cred-pass-row">
              <span class="cred-pass" id="${uid}">••••••••</span>
              <button class="cred-copy" data-pass="${safePass}" data-target="${uid}" onclick="sysPassToggle(this)" title="แสดง/ซ่อน" style="display:inline-flex;align-items:center;justify-content:center"><svg style="width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
              <button class="cred-copy" data-pass="${safePass}" onclick="sysPassCopy(this)" title="คัดลอก">📋</button>
            </div>` : ''}
          </div>`;
        }
        return `<tr>
          <td class="sys">${escHtml(it.system || '')}</td>
          <td>${escHtml(it.process || '')}</td>
          <td class="url">${it.url ? `<a href="${escHtml(it.url)}" target="_blank" rel="noopener">${escHtml(it.url)}</a>` : '-'}</td>
          ${hasCreds ? `<td>${credCell}</td>` : ''}
        </tr>`;
      }).join('');
      return `<div class="ob-card">
        <div class="ob-card-head"><span class="ico">⚙</span>${escHtml(block.title || '')}</div>
        <table class="ob-syslist">
          <thead><tr><th>System</th><th>Access Process</th><th>URL</th>${hasCreds ? '<th>User / Pass</th>' : ''}</tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
    }

    if (t === 'link_list') {
      const rows = (block.items || []).map(it => `
        <li style="margin-bottom:6px"><a href="${escHtml(it.url || '#')}" target="_blank" rel="noopener"
          style="color:var(--orange);text-decoration:none">${escHtml(it.label || it.url || '')}</a>
          ${it.note ? `<span style="color:var(--text-muted); font-size:11.5px"> — ${escHtml(it.note)}</span>` : ''}</li>
      `).join('');
      return `<div class="ob-card">
        <div class="ob-card-head"><span class="ico">🔗</span>${escHtml(block.title || '')}</div>
        <ul style="list-style:none; padding-left:0; margin:0; font-size:13px">${rows}</ul>
      </div>`;
    }

    if (t === 'card_list') {
      if (block.id === 'b3_screens') return renderSlideshow(ch, block);
      const items = block.items || [];
      const n = items.length;
      let cols = Math.min(n, 4);
      if (block.id === 'b2_tiers') cols = 3;
      else if (n === 5)            cols = 5;
      const cards = items.map(it => {
        const color = it.color || '#F26419';
        return `
          <div class="ob-dot-card">
            <div class="ob-dot-head">
              <div class="ob-dot" style="background:${escHtml(color)}"></div>
              <div class="ob-dot-title" style="color:${escHtml(color)}">${escHtml(it.title || '')}</div>
            </div>
            ${it.body ? `<div class="ob-dot-text">${escHtml(it.body).replace(/\n/g, '<br>')}</div>` : ''}
          </div>`;
      }).join('');
      return `<div class="ob-card">
        <div class="ob-card-head"><span class="ico">▤</span>${escHtml(block.title || '')}</div>
        <div class="ob-dot-grid" data-cols="${cols}">${cards}</div>
      </div>`;
    }

    if (t === 'pdf_list') {
      const pdfs = state.pdfFiles || [];
      const rows = pdfs.length ? pdfs.map(f => `
        <div class="ob-pdf-row">
          <div class="ob-pdf-icon">📄</div>
          <div class="ob-pdf-info">
            <div class="ob-pdf-name">${escHtml(f.filename)}</div>
            <div class="ob-pdf-meta">${formatSize(f.size)} · อัปโหลดเมื่อ ${formatDate(f.uploaded_at)}</div>
          </div>
          <div class="ob-pdf-actions">
            <a href="${escHtml(f.url)}" target="_blank" rel="noopener" class="primary">เปิดอ่าน</a>
            <a href="${escHtml(f.url)}" download>ดาวน์โหลด</a>
          </div>
        </div>
      `).join('') : '<div class="ob-pdf-empty">ยังไม่มีเอกสารอัปโหลด</div>';

      return `<div class="ob-card">
        <div class="ob-card-head"><span class="ico">📄</span>${escHtml(block.title || 'เอกสาร PDF')}</div>
        ${rows}
      </div>`;
    }

    if (t === 'html') {
      // Admin-editable HTML. Since only admins can edit config, and frontend renders it trusted,
      // we still do a light-touch sanitation: strip <script> tags.
      const safe = String(block.html || '').replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi, '');
      return `<div class="ob-card">
        <div class="ob-card-head"><span class="ico">✎</span>${escHtml(block.title || '')}</div>
        <div style="font-size:13px; line-height:1.7; color:var(--text-muted)">${safe}</div>
      </div>`;
    }

    if (t === 'freetext') {
      return `<div class="ob-card">
        <div class="ob-card-head"><span class="ico">✎</span>${escHtml(block.title || '')}</div>
        <div style="font-size:13px; line-height:1.7; color:var(--text-muted); white-space:pre-wrap">${escHtml(block.text || '')}</div>
      </div>`;
    }

    if (t === 'scored_quiz') {
      return renderScoredQuizBlock(ch, block);
    }

    if (t === 'quiz') {
      const savedQuizzes = (state.progress.quizzes || {})[ch.id] || {};
      const items = (block.questions || []).map((q, idx) => {
        const uid  = 'quiz_' + escHtml(ch.id) + '_' + escHtml(q.id);
        const val  = escHtml(savedQuizzes[q.id] || '');
        return `<div class="ob-quiz-item">
          <div class="ob-quiz-q">
            <span class="ob-quiz-num">${idx + 1}</span>
            <span>${escHtml(q.text || '')}</span>
          </div>
          <div class="ob-quiz-wrap">
            <textarea class="ob-quiz-ans"
              id="${uid}"
              data-chapter="${escHtml(ch.id)}"
              data-question="${escHtml(q.id)}"
              placeholder="พิมพ์คำตอบของคุณที่นี่…"
            >${val}</textarea>
            <div class="ob-quiz-status" id="${uid}_st">บันทึกแล้ว</div>
          </div>
          <div class="ob-quiz-hint">📋 Lead จะเห็นคำตอบนี้เพื่อ verify ความเข้าใจของคุณ</div>
        </div>`;
      }).join('');
      return `<div class="ob-card">
        <div class="ob-card-head"><span class="ico">✏</span>${escHtml(block.title || 'แบบทดสอบความเข้าใจ')}
          <span style="margin-left:auto; font-size:10.5px; color:var(--orange); font-weight:600; text-transform:none">Lead จะ verify</span>
        </div>
        ${items}
      </div>`;
    }

    return '';
  }

  function renderScoredQuizBlock(ch, block) {
    const chState   = (state.progress.chapter_state || []).find(s => s.id === ch.id) || {};
    const examResult = chState.exam_result || null;
    const lastResult = state.examLastResult?.[ch.id] || null; // set after submit

    const passScore  = block.pass_score || 80;
    const questions  = block.questions  || [];
    const blockId    = escHtml(block.id);
    const chId       = escHtml(ch.id);

    // After submit: show result screen instead of questions
    if (lastResult) {
      const passed    = lastResult.exam_passed;
      const newAttempts = (examResult?.attempts ?? lastResult.exam_total) > 0
                          ? (examResult?.attempts ?? 0) : 0;
      const actualAttempts = newAttempts || 1;

      if (passed) {
        // Graduation moment
        return `<div class="ob-card" id="sq-card-${blockId}" style="border-color:rgba(16,185,129,.4)">
          <div class="ob-card-head">
            <span class="ico">📝</span>${escHtml(block.title || 'แบบทดสอบ')}
            <span style="margin-left:auto; font-size:10.5px; color:#10b981; font-weight:600; text-transform:none">ผ่านแล้ว ✓</span>
          </div>
          <div style="text-align:center; padding:36px 24px">
            <div style="font-size:48px; margin-bottom:12px">🎉</div>
            <div style="font-size:28px; font-weight:700; color:#10b981; margin-bottom:6px">${lastResult.exam_score}%</div>
            <div style="font-size:15px; font-weight:600; margin-bottom:4px">ผ่านแล้ว! ยินดีด้วย</div>
            <div style="font-size:12.5px; color:var(--text-muted); margin-bottom:20px">ตอบถูก ${lastResult.exam_correct}/${lastResult.exam_total} ข้อ · ทำ ${actualAttempts} ครั้ง</div>
            <div style="font-size:13px; color:var(--text-muted); max-width:380px; margin:0 auto; line-height:1.7">
              คุณผ่านการ Onboarding ทั้ง 6 บทเรียบร้อยแล้ว<br>พร้อมเริ่มทำงานกับทีม SM ได้เลย!
            </div>
          </div>
        </div>`;
      } else {
        // Failed — show score + retry
        const bestScore = examResult?.best_score ?? lastResult.exam_score;
        return `<div class="ob-card" id="sq-card-${blockId}">
          <div class="ob-card-head">
            <span class="ico">📝</span>${escHtml(block.title || 'แบบทดสอบ')}
            <span style="margin-left:auto; font-size:10.5px; color:var(--orange); font-weight:600; text-transform:none">ผ่านเกณฑ์ ${passScore}%</span>
          </div>
          <div style="text-align:center; padding:32px 24px">
            <div style="font-size:42px; font-weight:700; color:var(--orange); margin-bottom:8px">${lastResult.exam_score}%</div>
            <div style="font-size:14px; font-weight:600; margin-bottom:4px">ยังไม่ผ่าน</div>
            <div style="font-size:12.5px; color:var(--text-muted); margin-bottom:24px">
              ตอบถูก ${lastResult.exam_correct}/${lastResult.exam_total} ข้อ · ต้องการ ${passScore}% ขึ้นไป · ทำแล้ว ${actualAttempts} ครั้ง
              ${bestScore > lastResult.exam_score ? ` · คะแนนสูงสุด ${bestScore}%` : ''}
            </div>
            <button class="sq-submit-btn" onclick="retryExamBlock('${chId}')">กลับไปทำใหม่</button>
            <div style="font-size:11.5px; color:var(--text-muted); margin-top:12px">
              แนะนำให้ทบทวนบทที่ 1–5 ก่อนลองใหม่
            </div>
          </div>
        </div>`;
      }
    }

    // Build question HTML (before submit)
    const qHtml = questions.map((q, idx) => {
      const choicesHtml = (q.choices || []).map(c => {
        const selected = state.examDraft?.[ch.id]?.[q.id] === c.id;
        const cls = 'sq-choice' + (selected ? ' selected' : '');
        return `<label class="${cls}" data-chid="${chId}" data-qid="${escHtml(q.id)}" data-cid="${escHtml(c.id)}">
          <div class="sq-radio"></div>
          <span class="sq-choice-label">${escHtml(c.text || '')}</span>
        </label>`;
      }).join('');

      return `<div class="sq-question">
        <div class="sq-q-text">
          <span class="sq-q-num">${idx + 1}</span>
          <span>${escHtml(q.text || '')}</span>
        </div>
        <div class="sq-choices">${choicesHtml}</div>
      </div>`;
    }).join('');

    // Footer: submit button
    const totalQ   = questions.length;
    const answered = Object.keys(state.examDraft?.[ch.id] || {}).length;
    const attempts = examResult?.attempts ?? 0;

    const footer = `<div class="sq-footer">
      <button class="sq-submit-btn" id="sq-submit-${blockId}"
              onclick="submitExamBlock('${chId}','${blockId}')"
              ${answered < totalQ ? 'disabled' : ''}>
        ส่งคำตอบ
      </button>
      <span class="sq-submit-hint">ตอบ ${answered}/${totalQ} ข้อ${answered < totalQ ? ' — ตอบให้ครบก่อน submit' : ' — พร้อม submit'}</span>
      ${attempts > 0 ? `<span class="sq-attempts-badge">ครั้งที่ ${attempts + 1}</span>` : ''}
    </div>`;

    return `<div class="ob-card" id="sq-card-${blockId}">
      <div class="ob-card-head">
        <span class="ico">📝</span>${escHtml(block.title || 'แบบทดสอบ')}
        <span style="margin-left:auto; font-size:10.5px; color:var(--orange); font-weight:600; text-transform:none">ผ่านเกณฑ์ ${passScore}%</span>
      </div>
      ${qHtml}
      ${footer}
    </div>`;
  }

  function renderSlideshow(ch, block) {
    const items = block.items || [];
    const n = items.length;
    const idx = Math.max(0, Math.min(state.slideIdx[block.id] || 0, n - 1));
    const item = items[idx] || {};
    const color = item.color || '#F26419';
    const cId = escHtml(ch.id);
    const bId = escHtml(block.id);
    const imgSrc = item.image || 'uploads/onboarding/monitor-overview.jpg';

    const dots = items.map((_, i) =>
      `<button class="ob-slide-dot ${i === idx ? 'active' : ''}"
               onclick="gotoSlide('${cId}','${bId}',${i})"
               title="Screen ${i + 1}"></button>`
    ).join('');

    return `<div class="ob-card" style="padding:0;overflow:hidden" id="slide-${bId}">
      <div style="padding:16px 20px 14px" class="ob-card-head">
        <span class="ico">🖥</span>${escHtml(block.title || '')}
        <span style="margin-left:auto;font-size:11px;color:var(--text-muted);font-weight:600;text-transform:none;letter-spacing:0">${idx + 1} / ${n}</span>
      </div>
      <div class="ob-slide-layout">
        <div class="ob-slide-img-pane" onclick="showLightbox('${escHtml(imgSrc)}')" title="คลิกเพื่อดูรูปเต็มจอ">
          <img src="${escHtml(imgSrc)}" alt="Screen ${idx + 1}" class="ob-slide-img"
               onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
          <div class="ob-slide-img-empty">🖥<span style="font-size:13px;margin-top:6px">ยังไม่มีรูป</span></div>
        </div>
        <div class="ob-slide-content-pane">
          <div class="ob-slide-eyebrow" style="color:${escHtml(color)}">Screen ${idx + 1}</div>
          <div class="ob-slide-title" style="color:${escHtml(color)}">${escHtml(item.title || '')}</div>
          <div class="ob-slide-body">${escHtml(item.body || '').replace(/\n/g, '<br>')}</div>
          <div class="ob-slide-nav">
            <button class="ob-btn" onclick="gotoSlide('${cId}','${bId}',${idx - 1})" ${idx === 0 ? 'disabled' : ''}>← ก่อนหน้า</button>
            <div class="ob-slide-dots">${dots}</div>
            <button class="ob-btn primary" onclick="gotoSlide('${cId}','${bId}',${idx + 1})" ${idx === n - 1 ? 'disabled' : ''}>ถัดไป →</button>
          </div>
        </div>
      </div>
    </div>`;
  }

  function renderExamStatusCard(ch) {
    const chState   = (state.progress.chapter_state || []).find(s => s.id === ch.id) || {};
    const examResult = chState.exam_result || null;
    const passed    = examResult?.passed ?? false;
    const bestScore = examResult?.best_score ?? 0;
    const attempts  = examResult?.attempts  ?? 0;
    const borderColor = passed ? 'rgba(16,185,129,.4)' : 'var(--border)';
    const statusColor = passed ? '#10b981' : 'var(--orange)';

    let content = '';
    if (!attempts) {
      content = `<div class="sq-status-card"><span style="font-size:13px; color:var(--text-muted)">ยังไม่ได้ทำแบบทดสอบ — เลื่อนขึ้นด้านบนเพื่อเริ่ม</span></div>`;
    } else if (passed) {
      content = `<div class="sq-status-card">
        <span class="sq-status-score pass">${bestScore}%</span>
        <div style="flex:1">
          <div style="font-size:13px; font-weight:600; color:#10b981">ผ่านแล้ว ✓</div>
          <div style="font-size:11px; color:var(--text-muted); margin-top:2px">คะแนนสูงสุด ${bestScore}% · ทำ ${attempts} ครั้ง</div>
        </div>
        <span style="font-size:18px">🎉</span>
      </div>`;
    } else {
      const block = (ch.blocks || []).find(b => b.type === 'scored_quiz');
      const passScore = block?.pass_score || 80;
      content = `<div class="sq-status-card">
        <span class="sq-status-score fail">${bestScore}%</span>
        <div style="flex:1">
          <div style="font-size:13px; font-weight:600; color:var(--orange)">ยังไม่ผ่าน</div>
          <div style="font-size:11px; color:var(--text-muted); margin-top:2px">ต้องการ ${passScore}% · ทำแล้ว ${attempts} ครั้ง</div>
        </div>
      </div>`;
    }

    return `<div class="ob-card" id="tasklist-${escHtml(ch.id)}" style="border-color:${borderColor}">
      <div class="ob-card-head">
        <span class="ico">📝</span>ผลการทดสอบ
        <span style="margin-left:auto; font-size:11px; font-weight:600; color:${statusColor}">
          ${passed ? 'ผ่านแล้ว ✓' : (attempts ? `${bestScore}% · ยังไม่ผ่าน` : 'ยังไม่ได้ทำ')}
        </span>
      </div>
      ${content}
    </div>`;
  }

  function renderTaskChecklist(ch) {
    // Chapters with scored_quiz blocks: show exam status card instead
    const hasScoredQuiz = (ch.blocks || []).some(b => b.type === 'scored_quiz');
    if (hasScoredQuiz) return renderExamStatusCard(ch);

    const tasks = ch.tasks || [];
    if (!tasks.length) return '';
    const items = tasks.map(t => {
      const done = taskChecked(ch.id, t.id);
      return `<div class="ob-check" onclick="toggleTask('${escHtml(ch.id)}','${escHtml(t.id)}')">
        <div class="ob-check-box ${done ? 'done' : ''}"></div>
        <div class="ob-check-text ${done ? 'done' : ''}">${escHtml(t.label || '')}</div>
      </div>`;
    }).join('');
    const doneCount   = tasks.filter(t => taskChecked(ch.id, t.id)).length;
    const tasksDone   = doneCount === tasks.length;

    // Quiz progress from server-side chapter_state
    const chState     = (state.progress.chapter_state || []).find(s => s.id === ch.id) || {};
    const quizTotal   = chState.quiz_total || 0;
    const quizDone    = chState.quiz_done  || 0;
    const quizAllDone = quizTotal === 0 || quizDone === quizTotal;
    const chapterDone = tasksDone && quizAllDone;

    const statusColor = chapterDone ? '#10b981' : 'var(--orange)';
    const borderColor = chapterDone ? 'rgba(16,185,129,.4)' : 'var(--border)';

    let statusText = `${doneCount}/${tasks.length}`;
    if (quizTotal > 0) statusText += ` · Quiz ${quizDone}/${quizTotal}`;
    if (chapterDone) statusText += ' · ปลดล็อกบทถัดไปแล้ว ✓';

    const quizWarning = tasksDone && !quizAllDone
      ? `<div style="margin-top:8px; padding:8px 12px; background:rgba(242,100,25,.08); border:1px solid rgba(242,100,25,.25); border-radius:6px; font-size:12px; color:var(--orange)">
           ✏ ตอบคำถาม "ตรวจสอบความเข้าใจ" ด้านบนให้ครบ (${quizDone}/${quizTotal}) เพื่อปลดล็อกบทถัดไป
         </div>`
      : '';

    return `<div class="ob-card" id="tasklist-${escHtml(ch.id)}" style="border-color:${borderColor}">
      <div class="ob-card-head">
        <span class="ico">✔</span>Checklist บทนี้
        <span style="margin-left:auto; font-size:11px; font-weight:600; color:${statusColor}">
          ${statusText}
        </span>
      </div>
      ${items}
      ${quizWarning}
    </div>`;
  }

  function renderNotebook(ch) {
    const nb = state.progress.notebook || {};
    const text = nb[ch.id] || '';
    return `<div class="ob-card">
      <div class="ob-card-head"><span class="ico">📓</span>Notebook ส่วนตัว <span style="margin-left:auto; font-size:10.5px; color:var(--text-muted); font-weight:400; text-transform:none; letter-spacing:0">เห็นเฉพาะของคุณ</span></div>
      <div class="ob-notebook-wrap">
        <textarea class="ob-notebook"
                  data-chapter="${escHtml(ch.id)}"
                  placeholder="จดสิ่งที่เรียนรู้ ความสงสัย หรือแผนของบทนี้…">${escHtml(text)}</textarea>
        <div class="ob-notebook-status" data-chapter="${escHtml(ch.id)}">บันทึกแล้ว</div>
      </div>
    </div>`;
  }

  // ─── Flow view ────────────────────────────────────────────
  function renderFlowView() {
    const fa = state.config.flow_architecture || {};
    const arch = fa.system_arch || null;
    const wf   = fa.workflow || null;

    return `
      <div class="ob-flow-tabs">
        <button class="ob-flow-tab ${state.flowView === 'arch' ? 'active' : ''}" onclick="switchFlow('arch')">System Architecture</button>
        <button class="ob-flow-tab ${state.flowView === 'workflow' ? 'active' : ''}" onclick="switchFlow('workflow')">Team Workflow</button>
      </div>
      <div class="ob-flow-panel ${state.flowView === 'arch' ? 'active' : ''}">${arch ? renderArch(arch) : emptyFlow()}</div>
      <div class="ob-flow-panel ${state.flowView === 'workflow' ? 'active' : ''}">${wf ? renderWorkflow(wf) : emptyFlow()}</div>
    `;
  }

  function emptyFlow() { return '<div class="ob-skel">ยังไม่มีข้อมูล</div>'; }

  function renderArch(a) {
    const layers = (a.layers || []).map(l => {
      const nodes = (l.nodes || []).map(n => `
        <div class="ob-arch-node" style="background:${hexToBg(l.color)}; color:${l.color}; border:1px solid ${hexToBg(l.color, .5)}">
          ${escHtml(n.title || '')}
          ${n.sub ? `<div class="sub">${escHtml(n.sub)}</div>` : ''}
        </div>
      `).join('');
      return `<div class="ob-arch-layer">
        <div class="ob-layer-head" style="color:${escHtml(l.color || '#F26419')}">${escHtml(l.label || '')}</div>
        ${nodes}
      </div>`;
    }).join('');

    let reqFlow = '';
    if (a.request_flow) {
      const r = a.request_flow;
      const nodes = (r.nodes || []).map((n, i, arr) => {
        const sep = i < arr.length - 1 ? '<span class="ob-flow-arrow">→</span>' : '';
        return `<span class="ob-flow-node" style="background:${escHtml(n.color || '#F26419')}">${escHtml(n.label || '')}</span>${sep}`;
      }).join('');
      reqFlow = `<div class="ob-reqflow">
        <div class="ob-reqflow-title">${escHtml(r.title || '')}</div>
        <div class="ob-reqflow-row">${nodes}</div>
        ${r.note ? `<div class="ob-reqflow-note">${escHtml(r.note)}</div>` : ''}
      </div>`;
    }

    return `
      <div class="ob-chap-title" style="margin-bottom:6px">${escHtml(a.title || '')}</div>
      <div class="ob-chap-desc">${escHtml(a.description || '')}</div>
      <div class="ob-arch-layers">${layers}</div>
      ${reqFlow}
    `;
  }

  function renderWorkflow(wf) {
    const steps = (wf.steps || []).map(s => `
      <div class="ob-wf-step">
        <div class="ob-wf-num" style="background:${escHtml(s.color || '#F26419')}">${escHtml(String(s.num))}</div>
        <div style="flex:1">
          <div class="ob-wf-title">${escHtml(s.title || '')}</div>
          <div class="ob-wf-desc">${escHtml(s.desc || '')}</div>
          <div class="ob-wf-tags">${(s.tags || []).map(t => `<span class="ob-wf-tag">${escHtml(t)}</span>`).join('')}</div>
        </div>
      </div>
    `).join('');
    return `
      <div class="ob-chap-title" style="margin-bottom:6px">${escHtml(wf.title || '')}</div>
      <div class="ob-chap-desc">${escHtml(wf.description || '')}</div>
      <div class="ob-card" style="padding:6px 18px">${steps}</div>
    `;
  }

  // ─── Helpers ──────────────────────────────────────────────
  function hexToBg(hex, alpha = .12) {
    if (!hex) return 'rgba(242,100,25,' + alpha + ')';
    const h = hex.replace('#','');
    if (h.length !== 6) return hex;
    const r = parseInt(h.slice(0,2), 16);
    const g = parseInt(h.slice(2,4), 16);
    const b = parseInt(h.slice(4,6), 16);
    return `rgba(${r},${g},${b},${alpha})`;
  }
  const _SVG_EYE_ON  = `<svg style="width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
  const _SVG_EYE_OFF = `<svg style="width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;
  function sysPassToggle(btn) {
    const el = document.getElementById(btn.dataset.target);
    if (el.dataset.shown) {
      el.textContent = '••••••••';
      delete el.dataset.shown;
      btn.innerHTML = _SVG_EYE_ON;
    } else {
      el.textContent = btn.dataset.pass;
      el.dataset.shown = '1';
      btn.innerHTML = _SVG_EYE_OFF;
    }
  }
  function sysPassCopy(btn) {
    const text = btn.dataset.pass;
    const done = () => { btn.textContent = '✓'; setTimeout(() => btn.textContent = '📋', 1200); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
    } else {
      fallbackCopy(text, done);
    }
  }
  function fallbackCopy(text, cb) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    try { document.execCommand('copy'); cb(); } catch(e) {}
    document.body.removeChild(ta);
  }
  function formatSize(bytes) {
    if (!bytes && bytes !== 0) return '';
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / 1048576).toFixed(1) + ' MB';
  }
  function formatDate(iso) {
    if (!iso) return '';
    try { return new Date(iso).toLocaleDateString('th-TH', { year:'numeric', month:'short', day:'numeric' }); }
    catch { return iso; }
  }

  // ─── Actions ──────────────────────────────────────────────
  window.switchMain = function (v) {
    state.mainView = v;
    render();
  };
  window.switchFlow = function (v) {
    state.flowView = v;
    render();
  };
  window.switchChapter = function (i) {
    const chapters = state.config.chapters || [];
    if (i < 0 || i >= chapters.length) return;
    if (!isUnlocked(chapters[i].id)) {
      Toast.warning('ทำบทก่อนหน้าให้ครบก่อนจึงจะปลดล็อก');
      return;
    }
    state.currentChapterIdx = i;
    render();
    // Scroll smoothly
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  window.toggleTask = async function (chId, tId) {
    // Optimistic UI
    const ct = { ...(state.progress.completed_tasks || {}) };
    const arr = ct[chId] ? [...ct[chId]] : [];
    const i = arr.indexOf(tId);
    if (i >= 0) arr.splice(i, 1); else arr.push(tId);
    ct[chId] = arr;
    state.progress = { ...state.progress, completed_tasks: ct };
    render();

    const res = await API.onboarding.toggleTask(chId, tId);
    if (!res?.ok) {
      Toast.error('บันทึกไม่สำเร็จ');
      // Reload from server
      const r2 = await API.onboarding.myProgress();
      if (r2?.ok) state.progress = r2.data.data;
      render();
      return;
    }
    state.progress = res.data.data;
    // If newly all done, auto-jump to finish UX but don't auto-redirect
    render();
  };

  // ── Scored Quiz (MCQ) interactions ───────────────────────────
  function bindScoredQuizChoices() {
    document.querySelectorAll('.sq-choice:not(.locked)').forEach(el => {
      el.addEventListener('click', onChoiceClick);
    });
  }

  function onChoiceClick(e) {
    const el    = e.currentTarget;
    const chId  = el.dataset.chid;
    const qId   = el.dataset.qid;
    const cId   = el.dataset.cid;
    if (!chId || !qId || !cId) return;

    if (!state.examDraft[chId]) state.examDraft[chId] = {};
    state.examDraft[chId][qId] = cId;

    // Update UI without full re-render
    const container = el.closest('.sq-choices');
    container.querySelectorAll('.sq-choice').forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');

    // Update submit button state
    const ch = (state.config.chapters || []).find(c => c.id === chId);
    if (!ch) return;
    const block = (ch.blocks || []).find(b => b.type === 'scored_quiz');
    if (!block) return;
    const total    = (block.questions || []).length;
    const answered = Object.keys(state.examDraft[chId] || {}).length;
    const btn      = document.getElementById('sq-submit-' + block.id);
    if (btn) {
      btn.disabled = answered < total;
      const hint = btn.nextElementSibling;
      if (hint) hint.textContent = `ตอบครบ ${answered}/${total} ข้อ${answered < total ? ' — กรุณาตอบให้ครบ' : ' — พร้อม submit'}`;
    }
  }

  window.submitExamBlock = async function (chId, blockId) {
    const ch    = (state.config.chapters || []).find(c => c.id === chId);
    const block = ch?.blocks?.find(b => b.id === blockId);
    if (!block) return;
    const answers = state.examDraft[chId] || {};
    const total   = (block.questions || []).length;
    if (Object.keys(answers).length < total) { Toast.warning('กรุณาตอบให้ครบทุกข้อ'); return; }

    const btn = document.getElementById('sq-submit-' + blockId);
    if (btn) { btn.disabled = true; btn.textContent = 'กำลังตรวจ…'; }

    const res = await API.onboarding.submitExam(chId, answers);
    if (!res?.ok) {
      Toast.error(res?.data?.message || 'ส่งคำตอบไม่สำเร็จ');
      if (btn) { btn.disabled = false; btn.textContent = 'ส่งคำตอบ'; }
      return;
    }
    const data = res.data.data;
    state.progress = data;
    state.examLastResult[chId] = data;
    state.examDraft[chId] = {};

    if (data.exam_passed) Toast.success(`ผ่านแล้ว! คะแนน ${data.exam_score}% 🎉`);
    else Toast.warning(`คะแนน ${data.exam_score}% — ยังไม่ผ่าน (เกณฑ์ ${data.exam_pass_score}%)`);
    render();
  };

  window.retryExamBlock = function (chId) {
    state.examLastResult[chId] = null;
    state.examDraft[chId] = {};
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  function bindNotebooks() {
    document.querySelectorAll('.ob-notebook').forEach(el => {
      el.addEventListener('input', onNotebookInput);
      el.addEventListener('blur', () => flushNotebook(el.dataset.chapter, el.value));
    });
  }

  function onNotebookInput(e) {
    const chId = e.target.dataset.chapter;
    const val  = e.target.value;
    clearTimeout(state.notebookTimers[chId]);
    state.notebookTimers[chId] = setTimeout(() => flushNotebook(chId, val), 700);
  }

  async function flushNotebook(chId, text) {
    const current = (state.progress.notebook || {})[chId] || '';
    if (current === text) return;
    const res = await API.onboarding.saveNotebook(chId, text);
    if (res?.ok) {
      state.progress = res.data.data;
      const s = document.querySelector(`.ob-notebook-status[data-chapter="${chId}"]`);
      if (s) { s.classList.add('show'); setTimeout(() => s.classList.remove('show'), 1400); }
    }
  }

  // ── Quiz autosave ─────────────────────────────────────────
  const quizTimers = {};

  function bindQuizzes() {
    document.querySelectorAll('.ob-quiz-ans').forEach(el => {
      el.addEventListener('input', onQuizInput);
      el.addEventListener('blur', () => flushQuiz(el.dataset.chapter, el.dataset.question, el.value, el.id + '_st'));
    });
  }

  function onQuizInput(e) {
    const chId = e.target.dataset.chapter;
    const qId  = e.target.dataset.question;
    const key  = chId + '_' + qId;
    clearTimeout(quizTimers[key]);
    quizTimers[key] = setTimeout(() => flushQuiz(chId, qId, e.target.value, e.target.id + '_st'), 800);
  }

  async function flushQuiz(chId, qId, text, statusId) {
    const saved = ((state.progress.quizzes || {})[chId] || {})[qId] || '';
    if (saved === text) return;
    // Optimistic local update
    if (!state.progress.quizzes) state.progress.quizzes = {};
    if (!state.progress.quizzes[chId]) state.progress.quizzes[chId] = {};
    state.progress.quizzes[chId][qId] = text;

    const res = await API.onboarding.saveQuiz(chId, qId, text);
    if (res?.ok) {
      // Update full state (chapter_state now has updated quiz_done counts)
      state.progress = res.data.data;
      // Re-render only the checklist card so quiz-done count + unlock status refresh
      // without disrupting focus on other quiz textareas in the same chapter
      const ch = (state.config.chapters || []).find(c => c.id === chId);
      if (ch) {
        const card = document.getElementById('tasklist-' + chId);
        if (card) card.outerHTML = renderTaskChecklist(ch);
      }
      const s = document.getElementById(statusId);
      if (s) { s.classList.add('show'); setTimeout(() => s.classList.remove('show'), 1400); }
    }
  }

  // ── Lightbox ──────────────────────────────────────────────
  (function() {
    const lb = document.createElement('div');
    lb.className = 'ob-lightbox';
    lb.id = 'ob-lightbox';
    lb.innerHTML = `<button class="ob-lightbox-close" onclick="closeLightbox()">×</button><img id="ob-lightbox-img" onclick="event.stopPropagation()">`;
    lb.addEventListener('click', () => closeLightbox());
    document.body.appendChild(lb);
  })();

  window.showLightbox = function(src) {
    document.getElementById('ob-lightbox-img').src = src;
    document.getElementById('ob-lightbox').classList.add('show');
  };
  window.closeLightbox = function() {
    document.getElementById('ob-lightbox').classList.remove('show');
  };
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

  window.gotoSlide = function(chId, blockId, idx) {
    const ch = (state.config.chapters || []).find(c => c.id === chId);
    if (!ch) return;
    const block = (ch.blocks || []).find(b => b.id === blockId);
    if (!block) return;
    const n = (block.items || []).length;
    if (idx < 0 || idx >= n) return;
    state.slideIdx[blockId] = idx;
    const el = document.getElementById('slide-' + blockId);
    if (el) el.outerHTML = renderSlideshow(ch, block);
  };

  window.finishOnboarding = async function () {
    const res = await API.onboarding.finish();
    if (res?.ok) {
      Toast.success('เรียบร้อย! พาไปหน้า Learning');
      setTimeout(() => { window.location.replace('learn.html'); }, 500);
    } else {
      Toast.error(res?.data?.message || 'ไม่สามารถจบ onboarding ได้');
    }
  };
</script>
</body>
</html>
