<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exam Reports — SOM-Portal</title>
  <link rel="icon" href="./favicon.ico" type="image/x-icon">
  <script src="./assets/js/theme.js"></script>
  <link rel="stylesheet" href="./assets/css/dark.css">
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="stylesheet" href="./assets/css/ui-themes.css">
  <style>
    :root {
      --accent:      #6366F1;
      --accent-soft: rgba(99,102,241,.10);
      --accent-line: rgba(99,102,241,.35);
      --accent-glow: rgba(99,102,241,.18);
    }

    /* ── Page hero ── */
    .page-hero {
      position:relative; overflow:hidden;
      border:1px solid var(--border); border-radius:14px;
      padding:20px 24px; margin-bottom:18px;
      background:var(--panel-bg);
      display:flex; align-items:center; gap:16px;
    }
    .page-hero-mark {
      width:46px; height:46px; border-radius:12px; flex-shrink:0;
      display:flex; align-items:center; justify-content:center;
      background:linear-gradient(135deg, var(--accent-soft), transparent);
      border:1px solid var(--accent-line);
      color:var(--accent); font-size:20px; font-weight:700;
    }
    .page-hero-body { flex:1; min-width:0 }
    .page-hero-eyebrow {
      font-size:10.5px; font-weight:700; color:var(--accent);
      text-transform:uppercase; letter-spacing:.08em; margin-bottom:4px;
    }
    .page-hero h1 { margin:0 0 4px; font-size:18px; font-weight:700; letter-spacing:-.015em }
    .page-hero p  { margin:0; color:var(--text-muted); font-size:12.5px; line-height:1.6 }

    .read-only-tag {
      display:inline-flex; align-items:center; gap:5px;
      font-size:10px; font-weight:700; letter-spacing:.06em;
      color:var(--accent); background:var(--accent-soft);
      border:1px solid var(--accent-line);
      padding:2px 8px; border-radius:999px; text-transform:uppercase;
    }

    /* ── Exam catalog grid ── */
    .exam-toolbar {
      display:flex; gap:8px; align-items:center; flex-wrap:wrap;
      margin-bottom:14px;
    }
    .exam-toolbar input {
      min-width:220px; padding:8px 12px;
      border:1px solid var(--border); border-radius:8px;
      background:var(--panel-bg); color:var(--text); font-size:13px;
    }
    .exam-grid {
      display:grid; gap:14px;
      grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));
    }
    .exam-card {
      border:1px solid var(--border); border-radius:14px; padding:16px 18px;
      background:var(--panel-bg); display:flex; flex-direction:column; gap:12px;
      transition:transform .15s, border-color .15s, box-shadow .15s;
    }
    .exam-card:hover {
      border-color:var(--accent-line);
      box-shadow:0 4px 16px color-mix(in srgb, var(--accent) 12%, transparent);
    }
    .exam-card-head { display:flex; align-items:flex-start; gap:12px }
    .exam-card-ico {
      width:44px; height:44px; border-radius:10px; flex-shrink:0;
      display:flex; align-items:center; justify-content:center; font-size:22px;
      background:var(--bg); border:1px solid var(--border);
    }
    .exam-card-title { font-size:14px; font-weight:700; letter-spacing:-.005em; margin:0 0 3px }
    .exam-card-sub   { font-size:11.5px; color:var(--text-muted); margin:0; line-height:1.4 }
    .exam-card-meta  {
      display:flex; gap:10px; flex-wrap:wrap;
      font-size:11px; color:var(--text-muted);
    }
    .exam-card-meta b { color:var(--text); font-weight:700 }
    .exam-card-foot {
      display:flex; align-items:center; gap:8px;
      border-top:1px solid var(--border); padding-top:10px; margin-top:auto;
    }
    .status-chip {
      display:inline-block; font-size:9.5px; font-weight:800;
      padding:2px 8px; border-radius:999px; text-transform:uppercase; letter-spacing:.06em;
    }
    .status-chip.published { background:rgba(16,185,129,.15); color:#10b981 }
    .status-chip.draft     { background:rgba(100,116,139,.18); color:#64748b }
    .status-chip.archived  { background:rgba(148,163,184,.18); color:#94a3b8 }

    /* ════════════════════════════════════════════════════════
       REPORT MODAL — ported from admin/exams.html (read-only)
       ════════════════════════════════════════════════════════ */
    .modal-overlay.active { display:flex }
    .modal.xl { max-width:1000px; width:96vw }
    #rep-modal .modal-header { gap:8px; }

    .rep-hero {
      position:relative; overflow:hidden;
      border:1px solid var(--border); border-radius:14px;
      background:var(--panel-bg);
      padding:18px 22px; margin-bottom:18px;
      display:flex; align-items:center; gap:16px;
    }
    .rep-hero::before {
      content:''; position:absolute; top:0; left:0; right:0; height:2px;
      background:var(--rep-accent, var(--accent));
    }
    .rep-hero-ico {
      width:48px; height:48px; border-radius:12px; flex-shrink:0;
      display:flex; align-items:center; justify-content:center; font-size:24px;
      background:color-mix(in srgb, var(--rep-accent, var(--accent)) 14%, transparent);
      color:var(--rep-accent, var(--accent));
    }
    .rep-hero-body { flex:1; min-width:0 }
    .rep-hero-eyebrow {
      font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.1em;
      color:var(--text-muted); margin-bottom:4px;
    }
    .rep-hero-body h2 { margin:0; font-size:18px; font-weight:700; letter-spacing:-.005em }
    .rep-hero-body p  { margin:4px 0 0; font-size:12px; color:var(--text-muted) }
    .rep-hero-meta {
      display:flex; gap:6px 12px; flex-wrap:wrap; margin-top:8px;
      font-size:11px; color:var(--text-muted);
    }
    .rep-hero-meta b { color:var(--text); font-weight:700 }

    .rep-section-label {
      font-size:10.5px; font-weight:800; color:var(--text-muted);
      text-transform:uppercase; letter-spacing:.08em;
      margin:18px 0 10px; display:flex; align-items:center; gap:8px;
    }
    .rep-section-label::before {
      content:''; width:5px; height:5px; border-radius:50%; background:var(--accent);
      box-shadow:0 0 0 3px var(--accent-soft);
    }
    .rep-section-label .ct {
      margin-left:auto; font-size:10px; color:var(--text-muted);
      background:var(--bg); border:1px solid var(--border); border-radius:999px;
      padding:2px 8px;
    }

    .rep-kpis {
      display:grid; gap:10px; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr));
      margin-bottom:18px;
    }
    .rep-kpi {
      border:1px solid var(--border); border-radius:12px; padding:14px 16px;
      background:var(--panel-bg); position:relative; overflow:hidden;
    }
    .rep-kpi .n {
      font-size:24px; font-weight:800; line-height:1;
      font-variant-numeric:tabular-nums; letter-spacing:-.015em;
    }
    .rep-kpi .n .u { font-size:13px; opacity:.55; vertical-align:top; margin-left:2px }
    .rep-kpi .l {
      font-size:10px; color:var(--text-muted); margin-top:6px;
      text-transform:uppercase; letter-spacing:.05em; font-weight:700;
    }
    .rep-kpi .sub { font-size:11px; color:var(--text-muted); margin-top:3px }
    .rep-kpi.accent .n { color:var(--accent) }
    .rep-kpi.green  .n { color:#10b981 }
    .rep-kpi.red    .n { color:#ef4444 }
    .rep-kpi.blue   .n { color:#3b82f6 }
    .rep-kpi.amber  .n { color:#f59e0b }

    .rep-grid-2 {
      display:grid; gap:14px; grid-template-columns:1fr 1fr; margin-bottom:18px;
    }
    @media (max-width:780px) { .rep-grid-2 { grid-template-columns:1fr } }

    .rep-card {
      border:1px solid var(--border); border-radius:12px; padding:16px 18px;
      background:var(--panel-bg);
    }
    .rep-card-head {
      font-size:11px; font-weight:700; color:var(--text-muted);
      text-transform:uppercase; letter-spacing:.06em; margin-bottom:14px;
      display:flex; align-items:center; gap:8px;
    }
    .rep-card-head .sub { margin-left:auto; font-size:10.5px; font-weight:600 }

    .rep-bars { display:flex; flex-direction:column; gap:10px }
    .rep-bar-row { display:grid; grid-template-columns:60px 1fr 38px; gap:10px; align-items:center }
    .rep-bar-label { font-size:11px; color:var(--text-muted); font-weight:600; font-variant-numeric:tabular-nums }
    .rep-bar-track {
      position:relative; height:18px; background:var(--bg);
      border-radius:6px; overflow:hidden; border:1px solid var(--border);
    }
    .rep-bar-fill {
      position:absolute; left:0; top:0; bottom:0;
      background:linear-gradient(90deg, var(--bar-color, var(--accent)), color-mix(in srgb, var(--bar-color, var(--accent)) 65%, transparent));
      border-radius:5px; transition:width .35s ease;
      min-width:3px;
    }
    .rep-bar-count {
      font-size:12px; font-weight:700; text-align:right;
      font-variant-numeric:tabular-nums; color:var(--text);
    }

    .rep-spark {
      display:flex; align-items:flex-end; gap:2px;
      height:90px; padding:6px 4px; background:var(--bg);
      border:1px solid var(--border); border-radius:8px;
    }
    .rep-spark-bar {
      flex:1; min-width:0; background:var(--accent);
      border-radius:2px 2px 0 0; opacity:.78;
      transition:opacity .15s, transform .15s;
    }
    .rep-spark-bar:hover { opacity:1; transform:scaleY(1.04); transform-origin:bottom }
    .rep-spark-bar.zero { background:var(--border); opacity:.35 }
    .rep-spark-meta {
      display:flex; justify-content:space-between; margin-top:8px;
      font-size:10px; color:var(--text-muted); font-variant-numeric:tabular-nums;
    }

    .rep-table-wrap {
      border:1px solid var(--border); border-radius:12px; overflow:hidden;
      background:var(--panel-bg);
    }
    .rep-table { width:100%; border-collapse:collapse; font-size:12.5px }
    .rep-table th, .rep-table td {
      padding:11px 14px; text-align:left;
      border-bottom:1px solid var(--border);
      vertical-align:middle;
    }
    .rep-table tbody tr:last-child td { border-bottom:none }
    .rep-table th {
      font-size:10px; text-transform:uppercase; letter-spacing:.06em;
      color:var(--text-muted); background:var(--bg); font-weight:800;
      position:sticky; top:0;
    }
    .rep-table th.right, .rep-table td.right { text-align:right; font-variant-numeric:tabular-nums }
    .rep-table tbody tr { transition:background .12s }
    .rep-table tbody tr:hover { background:color-mix(in srgb, var(--accent) 6%, transparent) }
    .rep-rank {
      display:inline-flex; width:24px; height:24px; border-radius:50%;
      align-items:center; justify-content:center; font-size:11px; font-weight:800;
      background:var(--bg); color:var(--text-muted); border:1px solid var(--border);
    }
    .rep-rank.gold   { background:linear-gradient(135deg,#fbbf24,#f59e0b); color:#fff; border-color:transparent }
    .rep-rank.silver { background:linear-gradient(135deg,#cbd5e1,#94a3b8); color:#fff; border-color:transparent }
    .rep-rank.bronze { background:linear-gradient(135deg,#fdba74,#c2410c); color:#fff; border-color:transparent }
    .rep-user { display:flex; align-items:center; gap:10px }
    .rep-avatar {
      width:30px; height:30px; border-radius:50%; flex-shrink:0;
      display:flex; align-items:center; justify-content:center;
      background:linear-gradient(135deg, var(--accent-soft), transparent);
      border:1px solid var(--accent-line);
      color:var(--accent); font-weight:800; font-size:11.5px;
    }
    img.rep-avatar-img { object-fit:cover; background:var(--bg); }
    .rep-user-name { font-weight:600; letter-spacing:-.005em }
    .rep-score-pill {
      display:inline-block; padding:3px 10px; border-radius:999px;
      font-size:11.5px; font-weight:800; font-variant-numeric:tabular-nums;
      background:var(--bg); border:1px solid var(--border);
    }
    .rep-score-pill.pass { background:rgba(16,185,129,.13); color:#10b981; border-color:rgba(16,185,129,.30) }
    .rep-score-pill.fail { background:rgba(239,68,68,.10);  color:#ef4444; border-color:rgba(239,68,68,.28) }
    .rep-score-pill.idle { color:var(--text-muted) }
    .rep-status-pill {
      display:inline-block; padding:2px 8px; border-radius:999px;
      font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.04em;
    }
    .rep-status-pill.passed      { background:rgba(16,185,129,.13); color:#10b981 }
    .rep-status-pill.failed      { background:rgba(239,68,68,.10);  color:#ef4444 }
    .rep-status-pill.in_progress { background:rgba(245,158,11,.13); color:#f59e0b }
    .rep-status-pill.never       { background:var(--bg); color:var(--text-muted); border:1px dashed var(--border) }

    /* Team badge — colored per team (color pulled from _sa_teams_data cache) */
    .team-pill {
      display:inline-block; font-size:10px; font-weight:800;
      padding:2px 8px; border-radius:999px; letter-spacing:.06em;
      color:var(--tp-color, #6366F1);
      background:color-mix(in srgb, var(--tp-color, #6366F1) 12%, transparent);
      border:1px solid color-mix(in srgb, var(--tp-color, #6366F1) 35%, transparent);
    }

    .rep-qrow {
      display:grid; grid-template-columns:1fr 110px 110px; gap:12px;
      align-items:center; padding:10px 14px;
      border-bottom:1px solid var(--border); font-size:12.5px;
    }
    .rep-qrow:last-child { border-bottom:none }
    .rep-qrow:hover { background:color-mix(in srgb, var(--accent) 4%, transparent) }
    .rep-q-prompt { color:var(--text); line-height:1.4 }
    .rep-q-prompt .cat {
      display:inline-block; font-size:10px; font-weight:700;
      color:var(--accent); background:var(--accent-soft);
      padding:2px 7px; border-radius:999px; margin-right:6px;
    }
    .rep-q-rate {
      position:relative; height:8px; background:var(--bg);
      border:1px solid var(--border); border-radius:4px; overflow:hidden;
    }
    .rep-q-rate-fill {
      position:absolute; left:0; top:0; bottom:0; border-radius:3px;
      background:linear-gradient(90deg, var(--q-color, #10b981), color-mix(in srgb, var(--q-color, #10b981) 70%, transparent));
    }
    .rep-q-rate-label {
      font-size:11.5px; font-weight:800; font-variant-numeric:tabular-nums;
      text-align:right; color:var(--q-color, var(--text));
    }
    .rep-q-asked {
      font-size:10.5px; color:var(--text-muted);
      text-align:right; font-variant-numeric:tabular-nums;
    }

    .rep-empty {
      text-align:center; padding:60px 20px; color:var(--text-muted);
      border:1.5px dashed var(--border); border-radius:12px;
    }
    .rep-empty .icon { font-size:42px; margin-bottom:10px; opacity:.45 }

    @media print {
      body * { visibility:hidden !important; }
      #rep-modal, #rep-modal * { visibility:visible !important; }
      #rep-modal { position:absolute !important; left:0; top:0; width:100%; background:#fff !important; }
      #rep-modal .modal {
        max-width:100% !important; border:none !important; box-shadow:none !important;
        background:#fff !important; color:#000 !important;
      }
      #rep-modal .modal-header button,
      #rep-modal .modal-close { display:none !important }
      .rep-table tbody tr:hover { background:transparent !important }
      #rep-modal .rep-card, #rep-modal .rep-hero, #rep-modal .rep-kpi, #rep-modal .rep-table-wrap {
        background:#fff !important; color:#000 !important; border-color:#ccc !important;
      }
    }
    @media (max-width:640px) {
      .rep-qrow { grid-template-columns:1fr 90px; }
      .rep-q-asked { display:none }
    }
  </style>
</head>
<body>

<div class="app-shell">
  <aside id="sidebar-mount"></aside>

  <div class="main-content">
    <header class="topbar">
      <div class="topbar-title">
        <div class="page-title"><i data-icon="trending-up"></i> Exam Reports</div>
        <div class="page-sub">Cross-team exam analytics — oversight view</div>
      </div>
      <div class="topbar-actions"></div>
    </header>

    <main class="page-content" style="padding:22px 24px 40px;">

      <div class="page-hero">
        <div class="page-hero-mark"><i data-icon="edit"></i></div>
        <div class="page-hero-body">
          <div class="page-hero-eyebrow">Oversight · Read-only</div>
          <h1>Exam Progress ข้ามทีม</h1>
          <p>เลือก exam เพื่อดู leaderboard, pass rate, distribution และ per-question analytics ของทุกทีม (สลับทีมจาก view-as switcher มุมบนขวา)</p>
        </div>
        <div><span class="read-only-tag">Read-only</span></div>
      </div>

      <div class="exam-toolbar">
        <input type="text" id="exam-search" placeholder="🔎 ค้นหา exam ตามชื่อ...">
      </div>

      <div id="exam-grid" class="exam-grid">
        <div data-skel="cards" data-count="6" data-cols="3"></div>
      </div>

    </main>
  </div>
</div>

<!-- ═════ Report modal (read-only, no reminder / no attempt-mgmt) ═════ -->
<div class="modal-overlay" id="rep-modal">
  <div class="modal xl">
    <div class="modal-header">
      <h3 id="rep-title"><i data-icon="trending-up"></i> Report</h3>
      <div style="display:flex; gap:6px; align-items:center; margin-left:auto;">
        <button class="btn btn-ghost btn-sm" onclick="reportExportCsv()" title="Export CSV"><i data-icon="inbox"></i> CSV</button>
        <button class="btn btn-ghost btn-sm" onclick="reportPrint()" title="พิมพ์รายงาน"><i data-icon="printer"></i> Print</button>
        <button class="btn btn-ghost btn-sm" onclick="reportCopySummary()" title="คัดลอกสรุป"><i data-icon="clipboard"></i> Copy</button>
        <button class="modal-close" onclick="closeReportModal()">×</button>
      </div>
    </div>
    <div class="modal-body">
      <div id="rep-body"></div>
    </div>
  </div>
</div>

<script src="./assets/js/utils.js"></script>
<script src="./assets/js/skeletons.js"></script>
<script src="./assets/js/auth.js"></script>
<script src="./assets/js/api.js"></script>
<script src="./assets/js/layout.js"></script>
<script>
  if (!Auth.requireAuth()) {}

  (() => {
    const u = Auth.getUser();
    if (!['super_viewer', 'super_admin'].includes(u?.role)) {
      location.replace('./dashboard.html');
    }
  })();

  Layout.render('exam-reports');

  let _exams = [];
  let _report = null;
  let _teamsById = {};
  (() => {
    try {
      const raw = sessionStorage.getItem('_sa_teams_data');
      (JSON.parse(raw || '[]') || []).forEach(t => {
        if (t?.slug) _teamsById[t.slug] = t;
      });
    } catch {}
  })();
  function teamPill(slug) {
    if (!slug) return '';
    const t = _teamsById[slug] || {};
    const label = (t.name || slug).toUpperCase();
    const color = t.color || '#6366F1';
    return `<span class="team-pill" title="${escHtml(t.name || slug)}"
      style="--tp-color:${color}">${escHtml(label)}</span>`;
  }

  function fmtDate(s) {
    try { return new Date(s).toLocaleString('th-TH', { dateStyle:'short', timeStyle:'short' }); }
    catch { return s; }
  }
  function fmtDur(sec) {
    sec = Math.max(0, Math.round(sec || 0));
    if (sec < 60) return sec + ' วินาที';
    const m = Math.floor(sec / 60), s = sec % 60;
    if (m < 60) return `${m} น. ${s} วิ`;
    const h = Math.floor(m / 60), mm = m % 60;
    return `${h} ชม. ${mm} น.`;
  }
  function fmtDateOnly(s) {
    try { return new Date(s).toLocaleDateString('th-TH', { month:'short', day:'numeric' }); }
    catch { return s; }
  }
  function repInitials(name) {
    if (!name) return '?';
    const parts = name.trim().split(/\s+/);
    return ((parts[0]?.[0] || '') + (parts[1]?.[0] || '')).toUpperCase();
  }

  function closeReportModal() {
    document.getElementById('rep-modal').classList.remove('active');
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeReportModal(); });
  document.getElementById('rep-modal').addEventListener('click', e => {
    if (e.target.id === 'rep-modal') closeReportModal();
  });

  // ═══════════════ Exam catalog ═══════════════
  async function loadExams() {
    const res = await API.exams.list();
    if (!res?.ok) {
      document.getElementById('exam-grid').innerHTML =
        '<div class="empty-state"><p>โหลด exam ไม่สำเร็จ</p></div>';
      return;
    }
    _exams = res.data.data || [];
    renderExams();
  }

  function renderExams() {
    const q = (document.getElementById('exam-search').value || '').trim().toLowerCase();
    const grid = document.getElementById('exam-grid');
    const list = q
      ? _exams.filter(e => (e.title || '').toLowerCase().includes(q)
                       || (e.subtitle || '').toLowerCase().includes(q))
      : _exams;

    if (!list.length) {
      grid.innerHTML = '<div class="empty-state"><p>ไม่มี exam</p></div>';
      return;
    }

    grid.innerHTML = list.map(e => {
      const sub = e.attempts_submitted ?? 0;
      const ip  = e.attempts_in_progress ?? 0;
      return `
        <div class="exam-card">
          <div class="exam-card-head">
            <div class="exam-card-ico" style="background:${escHtml(e.cover_color || '#6366F1')}22; color:${escHtml(e.cover_color || '#6366F1')}">${renderIcon(e.icon, '<i data-icon="edit"></i>')}</div>
            <div style="flex:1; min-width:0">
              <h3 class="exam-card-title">${escHtml(e.title)}</h3>
              ${e.subtitle ? `<p class="exam-card-sub">${escHtml(e.subtitle)}</p>` : ''}
            </div>
            <span class="status-chip ${escHtml(e.status || 'draft')}">${escHtml(e.status || 'draft')}</span>
          </div>
          <div class="exam-card-meta">
            ${e.owner_team ? `<span>👥 ${teamPill(e.owner_team)}</span>` : ''}
            <span><i data-icon="file"></i> <b>${e.questions_count || 0}</b> ข้อ</span>
            <span><i data-icon="target"></i> ผ่าน <b>${e.pass_score || 0}%</b></span>
            <span><i data-icon="check-circle"></i> <b>${sub}</b> submitted</span>
            ${ip > 0 ? `<span>⏳ <b>${ip}</b> in progress</span>` : ''}
          </div>
          <div class="exam-card-foot">
            <button class="btn btn-primary btn-sm" style="flex:1"
              onclick='openReport(${JSON.stringify(e.id)}, ${JSON.stringify(e.title)})'>
              <i data-icon="trending-up"></i> View Report
            </button>
          </div>
        </div>`;
    }).join('');
  }

  document.getElementById('exam-search').addEventListener('input', renderExams);

  // ═══════════════ Report (ported from admin/exams.html — read-only) ═══════════════
  async function openReport(examId, title) {
    document.getElementById('rep-title').innerHTML = '<i data-icon="trending-up"></i> Report — ' + title;
    document.getElementById('rep-body').innerHTML = '<div data-skel="list" data-rows="3"></div>';
    document.getElementById('rep-modal').classList.add('active');

    const res = await API.exams.report(examId);
    if (!res?.ok) {
      document.getElementById('rep-body').innerHTML =
        '<div class="rep-empty"><div class="icon"><i data-icon="alert-triangle"></i></div><div>โหลด report ไม่สำเร็จ</div></div>';
      return;
    }
    _report = res.data?.data || null;
    renderReport();
  }

  function renderReport() {
    const r = _report;
    if (!r) return;
    const body = document.getElementById('rep-body');
    const ex   = r.exam;
    const ov   = r.overview;
    const accent = ex.cover_color || '#6366F1';

    if (ov.total_attempts === 0) {
      body.innerHTML = `
        <div class="rep-hero" style="--rep-accent:${escHtml(accent)}">
          <div class="rep-hero-ico">${renderIcon(ex.icon, '<i data-icon="trending-up"></i>')}</div>
          <div class="rep-hero-body">
            <div class="rep-hero-eyebrow">Report · Snapshot · ${escHtml(new Date().toLocaleString('th-TH', {dateStyle:'medium', timeStyle:'short'}))}</div>
            <h2>${escHtml(ex.title)}</h2>
            <p>${ex.questions_count} ข้อ · ${ex.pass_score > 0 ? `เกณฑ์ผ่าน ${ex.pass_score}%` : 'ไม่มีเกณฑ์ผ่าน'}</p>
          </div>
        </div>
        <div class="rep-empty">
          <div class="icon"><i data-icon="inbox"></i></div>
          <div>ยังไม่มีคนทำข้อสอบนี้</div>
        </div>`;
      return;
    }

    const heroHtml = `
      <div class="rep-hero" style="--rep-accent:${escHtml(accent)}">
        <div class="rep-hero-ico">${renderIcon(ex.icon, '<i data-icon="trending-up"></i>')}</div>
        <div class="rep-hero-body">
          <div class="rep-hero-eyebrow">Report · Snapshot · ${escHtml(new Date().toLocaleString('th-TH', {dateStyle:'medium', timeStyle:'short'}))}</div>
          <h2>${escHtml(ex.title)}</h2>
          <p>${ex.questions_count} ข้อ · ${ex.pass_score > 0 ? `เกณฑ์ผ่าน <b>${ex.pass_score}%</b>` : '<b>ไม่มีเกณฑ์ผ่าน</b>'}</p>
          <div class="rep-hero-meta">
            ${ov.first_attempt_at ? `<span>📅 เริ่มมีคนทำ <b>${escHtml(fmtDate(ov.first_attempt_at))}</b></span>` : ''}
            ${ov.last_attempt_at  ? `<span>·</span><span>🕒 ล่าสุด <b>${escHtml(fmtDate(ov.last_attempt_at))}</b></span>` : ''}
          </div>
        </div>
      </div>`;

    const kpisHtml = `
      <div class="rep-kpis">
        <div class="rep-kpi accent">
          <div class="n">${ov.unique_users}</div>
          <div class="l">ผู้เข้าสอบ</div>
          <div class="sub">${ov.total_attempts} ครั้งทั้งหมด</div>
        </div>
        <div class="rep-kpi green">
          <div class="n">${ov.passed}</div>
          <div class="l">ผ่าน</div>
          <div class="sub">${ov.pass_rate}% pass rate</div>
        </div>
        <div class="rep-kpi red">
          <div class="n">${ov.failed}</div>
          <div class="l">ไม่ผ่าน</div>
          <div class="sub">${ov.submitted} ส่งทั้งหมด</div>
        </div>
        <div class="rep-kpi blue">
          <div class="n">${ov.avg_score}<span class="u">%</span></div>
          <div class="l">เฉลี่ย</div>
          <div class="sub">median ${ov.median_score}% · ดีสุด ${ov.max_score}%</div>
        </div>
        <div class="rep-kpi amber">
          <div class="n">${fmtDur(ov.avg_duration_sec).replace(/\s.+$/,'')}<span class="u">${fmtDur(ov.avg_duration_sec).split(' ').slice(1).join(' ')}</span></div>
          <div class="l">เวลาเฉลี่ย</div>
          <div class="sub">ต่อ attempt</div>
        </div>
        ${ov.in_progress > 0 ? `
          <div class="rep-kpi amber">
            <div class="n">${ov.in_progress}</div>
            <div class="l">กำลังทำ</div>
            <div class="sub">ยังไม่ส่ง</div>
          </div>` : ''}
        ${ov.total_violations > 0 ? `
          <div class="rep-kpi red">
            <div class="n">${ov.total_violations}</div>
            <div class="l">Violations</div>
            <div class="sub">รวมทุกประเภท</div>
          </div>` : ''}
      </div>`;

    const maxBucket = Math.max(1, ...r.distribution.map(b => b.count));
    const bucketColor = ['#ef4444','#f97316','#eab308','#3b82f6','#10b981'];
    const distHtml = `
      <div class="rep-card">
        <div class="rep-card-head"><i data-icon="bar-chart"></i> Score Distribution <span class="sub">${ov.submitted} attempts ที่ส่งแล้ว</span></div>
        <div class="rep-bars">
          ${r.distribution.map((b, i) => `
            <div class="rep-bar-row">
              <div class="rep-bar-label">${b.label}</div>
              <div class="rep-bar-track">
                <div class="rep-bar-fill" style="--bar-color:${bucketColor[i]}; width:${(b.count / maxBucket * 100).toFixed(1)}%"></div>
              </div>
              <div class="rep-bar-count">${b.count}</div>
            </div>
          `).join('')}
        </div>
      </div>`;

    const tl = r.timeline;
    const tlMax = Math.max(1, ...tl.map(d => d.count));
    const tlTotal = tl.reduce((s, d) => s + d.count, 0);
    const tlHtml = `
      <div class="rep-card">
        <div class="rep-card-head"><i data-icon="clock"></i> Activity — 30 วันหลัง <span class="sub">${tlTotal} submissions</span></div>
        <div class="rep-spark">
          ${tl.map(d => `
            <div class="rep-spark-bar ${d.count === 0 ? 'zero' : ''}"
                 style="height:${d.count === 0 ? 4 : Math.max(4, d.count / tlMax * 100)}%"
                 title="${d.date} — ${d.count} attempts"></div>
          `).join('')}
        </div>
        <div class="rep-spark-meta">
          <span>${fmtDateOnly(tl[0]?.date)}</span>
          <span>${fmtDateOnly(tl[tl.length-1]?.date)}</span>
        </div>
      </div>`;

    const lbRows = r.leaderboard.map((u, i) => {
      const rankClass = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';
      const statusLabel = ({passed:'PASSED', failed:'FAILED', in_progress:'IN PROGRESS', never:'NEVER'})[u.status] || u.status;
      const bestScoreCell = u.best_score === null
        ? `<span class="rep-score-pill idle">—</span>`
        : `<span class="rep-score-pill ${u.best_passed ? 'pass' : 'fail'}">${u.best_score}%</span>`;
      const latestScoreCell = u.latest_score === null
        ? `<span style="color:var(--text-muted)">—</span>`
        : `${u.latest_score}%`;
      const avatarHtml = u.avatar_url
        ? `<img class="rep-avatar rep-avatar-img" src="${escHtml(u.avatar_url)}" alt=""
            onerror="this.outerHTML='<div class=\\'rep-avatar\\'>${escHtml(repInitials(u.user_name))}</div>'">`
        : `<div class="rep-avatar">${escHtml(repInitials(u.user_name))}</div>`;
      return `
        <tr>
          <td><span class="rep-rank ${rankClass}">${i+1}</span></td>
          <td>
            <div class="rep-user">
              ${avatarHtml}
              <div>
                <div class="rep-user-name">${escHtml(u.user_name)}</div>
                <div style="font-size:10.5px; color:var(--text-muted)">${u.last_attempted_at ? 'ทำล่าสุด ' + fmtDate(u.last_attempted_at) : '—'}</div>
              </div>
            </div>
          </td>
          <td>${teamPill(u.team)}</td>
          <td class="right">${u.attempts}</td>
          <td class="right">${bestScoreCell}</td>
          <td class="right">${latestScoreCell}</td>
          <td class="right">${u.total_duration_sec > 0 ? fmtDur(u.total_duration_sec) : '—'}</td>
          <td class="right">${u.violations_total > 0 ? `<span style="color:#ef4444">${u.violations_total}</span>` : '0'}</td>
          <td class="right"><span class="rep-status-pill ${u.status}">${statusLabel}</span></td>
        </tr>`;
    }).join('');

    const lbHtml = `
      <div class="rep-section-label">
        <i data-icon="trophy"></i> Leaderboard
        <span class="ct">${r.leaderboard.length} คน</span>
      </div>
      <div class="rep-table-wrap">
        <table class="rep-table">
          <thead>
            <tr>
              <th style="width:50px">#</th>
              <th>ผู้สอบ</th>
              <th>Team</th>
              <th class="right">Attempts</th>
              <th class="right">Best</th>
              <th class="right">Latest</th>
              <th class="right">Time</th>
              <th class="right">Violations</th>
              <th class="right">Status</th>
            </tr>
          </thead>
          <tbody>${lbRows}</tbody>
        </table>
      </div>`;

    const qHtml = r.questions.length ? `
      <div class="rep-section-label">
        <i data-icon="target"></i> Question Analytics
        <span class="ct">เรียงข้อยากที่สุดก่อน</span>
      </div>
      <div class="rep-table-wrap">
        ${r.questions.map(q => {
          const rate = q.correct_rate;
          const color = q.asked === 0 ? '#94a3b8'
                      : rate < 40 ? '#ef4444'
                      : rate < 70 ? '#f59e0b'
                      : '#10b981';
          return `
            <div class="rep-qrow">
              <div class="rep-q-prompt">
                ${q.category ? `<span class="cat">${escHtml(q.category)}</span>` : ''}
                ${escHtml(q.prompt || '(ไม่มี prompt)')}
              </div>
              <div>
                <div class="rep-q-rate">
                  <div class="rep-q-rate-fill" style="--q-color:${color}; width:${rate}%"></div>
                </div>
                <div class="rep-q-rate-label" style="--q-color:${color}; margin-top:4px">
                  ${q.asked === 0 ? 'ไม่ได้สุ่ม' : rate + '%'}
                </div>
              </div>
              <div class="rep-q-asked">${q.asked > 0 ? `${q.correct}/${q.asked}` : '—'}</div>
            </div>`;
        }).join('')}
      </div>` : '';

    const na = r.not_attempted || [];
    const naHtml = na.length ? `
      <div class="rep-section-label" style="margin-top:20px">
        <i data-icon="ban"></i> ยังไม่ได้ทำข้อสอบ
        <span class="ct" style="background:rgba(239,68,68,.12);color:#ef4444">${na.length} คน</span>
      </div>
      <div class="rep-table-wrap" style="padding:10px">
        <div style="display:flex;flex-wrap:wrap;gap:8px">
          ${na.map(u => {
            const initial = escHtml((u.name || '?').charAt(0).toUpperCase());
            const fallback = `<div style=\\'width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700\\'>${initial}</div>`;
            const av = u.avatar_url
              ? `<img src="${escHtml(u.avatar_url)}" alt="" style="width:22px;height:22px;border-radius:50%;object-fit:cover;background:var(--bg)" onerror="this.outerHTML='${fallback}'">`
              : `<div style="width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700">${initial}</div>`;
            return `
            <div style="display:inline-flex;align-items:center;gap:8px;padding:6px 12px;background:var(--bg);border:1px solid var(--border);border-radius:20px;font-size:12px">
              ${av}
              <span>${escHtml(u.name)}</span>
              ${u.team ? teamPill(u.team) : ''}
            </div>`;
          }).join('')}
        </div>
      </div>` : (r.overview.eligible_users > 0 ? `
      <div class="rep-section-label" style="margin-top:20px">
        <i data-icon="sparkles"></i> ทุกคนทำข้อสอบครบแล้ว
        <span class="ct" style="background:rgba(16,185,129,.12);color:#10b981">${r.overview.eligible_users}/${r.overview.eligible_users}</span>
      </div>` : '');

    body.innerHTML = heroHtml + kpisHtml +
      `<div class="rep-grid-2">${distHtml}${tlHtml}</div>` +
      naHtml + lbHtml + qHtml;
  }

  function reportExportCsv() {
    const r = _report;
    if (!r) return;
    const rows = [
      ['Rank','Name','Team','Attempts','Best Score','Latest Score','Time (sec)','Violations','Status','Last Attempt']
    ];
    r.leaderboard.forEach((u, i) => {
      rows.push([
        i + 1, u.user_name, u.team || '', u.attempts, u.best_score ?? '', u.latest_score ?? '',
        u.total_duration_sec, u.violations_total, u.status, u.last_attempted_at || '',
      ]);
    });
    const csv = rows.map(r => r.map(cell => {
      const s = String(cell ?? '');
      return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
    }).join(',')).join('\n');
    const blob = new Blob(['﻿' + csv], { type:'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    const safeTitle = (r.exam.title || 'exam').replace(/[^\w\-]+/g, '_');
    a.download = `report_${safeTitle}_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
    URL.revokeObjectURL(a.href);
    Toast.success('ดาวน์โหลด CSV แล้ว');
  }

  function reportPrint() { window.print(); }

  async function reportCopySummary() {
    const r = _report;
    if (!r) return;
    const ov = r.overview;
    const md = [
      `# ${r.exam.title}`,
      ``,
      `📅 _${new Date().toLocaleString('th-TH', {dateStyle:'medium', timeStyle:'short'})}_`,
      ``,
      `## ภาพรวม`,
      `- ผู้สอบ: **${ov.unique_users}** คน (${ov.total_attempts} attempts)`,
      `- ผ่าน: **${ov.passed}** / ไม่ผ่าน: **${ov.failed}** — pass rate **${ov.pass_rate}%**`,
      `- คะแนนเฉลี่ย: **${ov.avg_score}%** (median ${ov.median_score}%, min ${ov.min_score}%, max ${ov.max_score}%)`,
      `- เวลาเฉลี่ยต่อ attempt: **${fmtDur(ov.avg_duration_sec)}**`,
      ov.total_violations > 0 ? `- Violations: **${ov.total_violations}**` : '',
      ``,
      `## Leaderboard`,
      `| # | ผู้สอบ | Best | Latest | Status |`,
      `|---|---|---|---|---|`,
      ...r.leaderboard.map((u, i) => `| ${i+1} | ${u.user_name} | ${u.best_score ?? '—'}% | ${u.latest_score ?? '—'}% | ${u.status} |`),
    ].filter(Boolean).join('\n');
    try {
      await navigator.clipboard.writeText(md);
      Toast.success('คัดลอกสรุป (markdown) แล้ว');
    } catch (e) {
      Toast.error('คัดลอกไม่สำเร็จ');
    }
  }

  window.openReport = openReport;
  window.closeReportModal = closeReportModal;
  window.reportExportCsv = reportExportCsv;
  window.reportPrint = reportPrint;
  window.reportCopySummary = reportCopySummary;

  loadExams();
</script>
</body>
