<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report Weekly — SOM-Portal</title>
  <link rel="icon" href="./favicon.ico" type="image/x-icon">
  <script src="./assets/js/theme.js"></script>
  <link rel="stylesheet" href="./assets/css/dark.css">
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="stylesheet" href="./assets/css/ui-themes.css">
  <style>
    .main-content  { display:flex; flex-direction:column; overflow:hidden; }
    .page-content  { flex:1; display:flex; flex-direction:column; padding:0; overflow:hidden; }

    /* Tab strip — visible only when > 1 link */
    .report-tabs {
      display:flex; gap:2px; padding:8px 16px; flex-shrink:0;
      background:var(--bg); border-bottom:1px solid var(--border); overflow-x:auto;
    }
    .report-tab {
      padding:5px 14px; border-radius:6px; font-size:11px; font-weight:600;
      cursor:pointer; border:none; background:transparent;
      color:var(--text-muted); transition:all .1s; white-space:nowrap;
    }
    .report-tab:hover  { background:var(--bg-card); color:var(--text); }
    .report-tab.active { background:var(--orange); color:#fff; }

    /* iframe */
    .report-frame-wrap { flex:1; display:flex; flex-direction:column; min-height:0; }
    .report-frame { flex:1; width:100%; border:none; display:block; }

    /* blocked fallback */
    .report-blocked {
      flex:1; display:none; flex-direction:column;
      align-items:center; justify-content:center;
      gap:8px; color:var(--text-muted); font-size:13px;
    }
    .report-blocked a { color:var(--orange); }
  </style>
</head>
<body>

<div class="app-shell">
  <aside id="sidebar-mount"></aside>

  <div class="main-content">
    <header class="topbar">
      <div class="topbar-title">
        <div class="page-title">≡ Report Weekly</div>
        <div class="page-sub" id="report-sub">SM Team weekly status reports</div>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-ghost" style="font-size:11px" onclick="reloadReport()">↺ Reload</button>
        <a id="open-newtab" href="#" target="_blank" rel="noopener" class="btn btn-ghost" style="font-size:11px">↗ เปิด Tab ใหม่</a>
      </div>
    </header>

    <!-- Tab strip (hidden until > 1 link) -->
    <div id="tab-strip" style="display:none" class="report-tabs"></div>

    <main class="page-content">
      <div class="report-frame-wrap">
        <iframe id="report-frame" class="report-frame" src=""
                sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox"
                allowfullscreen></iframe>
        <div id="report-blocked" class="report-blocked">
          <div style="font-size:32px"><i data-icon="ban"></i></div>
          <div>ไม่สามารถแสดงในหน้านี้ได้</div>
          <div style="font-size:12px">
            <a id="blocked-link" href="#" target="_blank" rel="noopener">↗ เปิดใน Tab ใหม่แทน</a>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="./assets/js/utils.js"></script>
<script src="./assets/js/auth.js"></script>
<script src="./assets/js/api.js"></script>
<script src="./assets/js/csrf.js"></script>
<script src="./assets/js/analytics.js"></script>
<script src="./assets/js/analytics-features.js"></script>
<script src="./assets/js/layout.js"></script>
<script src="./assets/js/maintenance.js"></script>
<script>
  if (!Auth.requireAuth()) {}
  Layout.render('report');
  trackReportView('report');

  let reportLinks = [];
  let currentIdx  = 0;

  async function loadLinks() {
    const res = await API.links.list('report');
    if (!res?.ok || !res.data.data?.length) {
      showBlocked('#');
      return;
    }
    reportLinks = res.data.data;

    if (reportLinks.length > 1) {
      const strip = document.getElementById('tab-strip');
      strip.style.display = '';
      strip.innerHTML = reportLinks.map((l, i) =>
        `<button class="report-tab${i === 0 ? ' active' : ''}" onclick="selectReport(${i})">${renderIcon(l.icon, '<i data-icon="menu"></i>')} ${escHtml(l.name)}</button>`
      ).join('');
    }

    selectReport(0);
  }

  function selectReport(idx) {
    currentIdx = idx;
    const link = reportLinks[idx];
    if (!link) return;

    document.querySelectorAll('.report-tab').forEach((t, i) => t.classList.toggle('active', i === idx));
    document.getElementById('report-sub').textContent  = link.description || link.url;
    document.getElementById('open-newtab').href        = link.url;
    document.getElementById('blocked-link').href       = link.url;

    const frame = document.getElementById('report-frame');
    frame.style.display = 'block';
    document.getElementById('report-blocked').style.display = 'none';
    frame.src = link.url;

    frame.onerror = () => showBlocked(link.url);
    frame.onload  = () => {
      try {
        const doc = frame.contentDocument;
        if (doc && doc.body !== null && doc.body.innerHTML === '') showBlocked(link.url);
      } catch (e) { showBlocked(link.url); }
    };
  }

  function showBlocked(url) {
    document.getElementById('report-frame').style.display   = 'none';
    document.getElementById('report-blocked').style.display = 'flex';
    if (url) document.getElementById('blocked-link').href   = url;
  }

  function reloadReport() {
    const link = reportLinks[currentIdx];
    if (!link) return;
    const frame = document.getElementById('report-frame');
    frame.src = 'about:blank';
    setTimeout(() => { frame.src = link.url; }, 80);
  }

  loadLinks();
</script>
</body>
</html>
