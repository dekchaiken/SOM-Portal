<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GenZ Team — Admin</title>
  <link rel="icon" href="../favicon.ico" type="image/x-icon">
  <script src="../assets/js/theme.js"></script>
  <link rel="stylesheet" href="../assets/css/dark.css">
  <link rel="stylesheet" href="../assets/css/style.css?v=20260724">
  <link rel="stylesheet" href="../assets/css/ui-themes.css">
  <style>
    .main-content,.page-content { min-width:0;overflow-x:hidden; }
    .gz-wrap { display:flex; flex-direction:column; gap:20px; }
    .gz-hero-stats { display:flex; gap:12px; flex-wrap:wrap; margin-top:12px; }
    .gz-stat { padding:8px 14px; border-radius:10px; background:var(--bg-card); border:1px solid var(--border); font-size:12px; color:var(--text); }
    .gz-stat strong { font-size:16px; margin-right:6px; background:linear-gradient(135deg,#d4af37,#f97316); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .gz-panel { background:var(--bg-card); border:1.5px solid var(--border); border-radius:14px; overflow:hidden; box-shadow:0 2px 12px rgba(0,0,0,.06); }
    .gz-hd { padding:14px 20px; border-bottom:1.5px solid var(--border); font-size:11px; font-weight:800; color:var(--text-muted,#666); letter-spacing:.05em; text-transform:uppercase; display:flex; align-items:center; gap:8px; }
    .gz-search { padding:12px 20px; border-bottom:1px solid var(--border); display:flex; gap:10px; align-items:center; }
    .gz-search input { flex:1; padding:8px 12px; border:1.5px solid var(--border); border-radius:8px; font-size:13px; background:var(--bg); color:var(--text); }
    .gz-list { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:1px; background:var(--border); }
    .gz-row { background:var(--bg-card); padding:14px 18px; display:flex; align-items:center; gap:12px; }
    .gz-avatar { width:38px; height:38px; border-radius:50%; background:linear-gradient(135deg,#f5d97a 0%,#d4af37 55%,#8a6a1a 100%); color:white; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; flex-shrink:0; overflow:hidden; }
    .gz-avatar img { width:100%; height:100%; object-fit:cover; }
    .gz-info { flex:1; min-width:0; }
    .gz-name { font-size:13px; font-weight:700; color:var(--text); display:flex; align-items:center; gap:6px; }
    .gz-sub  { font-size:11px; color:var(--text-muted,#999); margin-top:2px; }
    .gz-badge { font-size:9px; font-weight:900; padding:2px 8px; border-radius:999px; letter-spacing:.12em; background:linear-gradient(135deg,#f5d97a 0%,#d4af37 55%,#8a6a1a 100%); color:#3a2a05; border:1px solid rgba(255,245,200,.55); box-shadow:0 1px 4px rgba(212,175,55,.4), inset 0 1px 0 rgba(255,255,255,.5); text-transform:uppercase; text-shadow:0 1px 0 rgba(255,245,200,.6); }
    .gz-badge::before { content:'\2726'; margin-right:3px; font-size:9px; }

    /* Toggle switch */
    .gz-switch { position:relative; width:44px; height:24px; flex-shrink:0; }
    .gz-switch input { opacity:0; width:0; height:0; }
    .gz-slider { position:absolute; inset:0; background:#d4d4d8; border-radius:24px; cursor:pointer; transition:.2s; }
    .gz-slider::before { content:''; position:absolute; height:18px; width:18px; left:3px; top:3px; background:white; border-radius:50%; transition:.2s; box-shadow:0 1px 3px rgba(0,0,0,.2); }
    .gz-switch input:checked + .gz-slider { background:linear-gradient(135deg,#f5d97a 0%,#d4af37 55%,#8a6a1a 100%); }
    .gz-switch input:checked + .gz-slider::before { transform:translateX(20px); }
    .gz-switch input:disabled + .gz-slider { opacity:.5; cursor:not-allowed; }

    .gz-empty { padding:40px; text-align:center; color:var(--text-muted,#aaa); font-size:12px; grid-column:1/-1; background:var(--bg-card); }
  </style>
</head>
<body>
<div class="app-shell">
  <aside id="sidebar-mount"></aside>
  <div class="main-content">
    <header class="topbar">
      <div class="topbar-title">
        <div class="topbar-title-left">
          <div class="page-title"><i data-icon="badge"></i> GenZ Team</div>
          <div class="page-sub">SM-only role flag — เลือกสมาชิกที่เป็น GenZ Team</div>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-ghost btn-sm" onclick="loadAll()" style="font-size:11px">↺ รีเฟรช</button>
      </div>
    </header>

    <main class="page-content">
      <section class="page-hero">
        <div class="page-hero-mark" style="background:linear-gradient(135deg,#f5d97a 0%,#d4af37 55%,#8a6a1a 100%);color:white"><i data-icon="badge"></i></div>
        <div class="page-hero-body">
          <div class="page-hero-eyebrow">Admin · SM only</div>
          <h1>GenZ Team</h1>
          <p>GenZ Team คือ tag เสริมบน sm_user — access ยังเท่ากับ user ปกติ แต่จะเห็น <strong>GenZ Hub</strong> + ป้ายและธีมพิเศษ</p>
          <div class="gz-hero-stats">
            <div class="gz-stat"><strong id="stat-total">0</strong>ทั้งทีม</div>
            <div class="gz-stat"><strong id="stat-genz">0</strong>เป็น GenZ</div>
          </div>
        </div>
      </section>

      <div class="gz-wrap">
        <div class="gz-panel">
          <div class="gz-hd"><i data-icon="users"></i> สมาชิกทีม SM</div>
          <div class="gz-search">
            <i data-icon="search" style="color:var(--text-muted,#999)"></i>
            <input id="gz-q" type="text" placeholder="ค้นหาชื่อ / username ..." oninput="renderList()">
          </div>
          <div class="gz-list" id="gz-list">
            <div class="gz-empty">กำลังโหลด...</div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="../assets/js/utils.js"></script>
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/layout.js"></script>
<script src="../assets/js/admin-nav.js"></script>
<script>
if (!Auth.requireAuth()) {}
Layout.render('admin-genz-team');

// SM-only + sm_admin-only guard (defense-in-depth; API also enforces).
(function guard() {
  const u = Auth.getUser();
  if (!u) return;
  if (u.team !== 'sm' || !['sm_admin', 'dev_sm'].includes(u.role)) {
    document.querySelector('.page-content').innerHTML =
      '<div style="padding:40px;text-align:center;color:#ef4444;font-weight:700">Forbidden — GenZ Team ใช้ได้เฉพาะ sm_admin / dev_sm ในทีม SM</div>';
    throw new Error('forbidden');
  }
})();

let _users = [];
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const initials = n => (n || '?').split(/\s+/).filter(Boolean).slice(0,2).map(w => w[0].toUpperCase()).join('');

async function loadAll() {
  const r = await API.genzTeam.list();
  _users = r?.ok ? (r.data.data || []) : [];
  document.getElementById('stat-total').textContent = _users.length;
  document.getElementById('stat-genz').textContent  = _users.filter(u => u.is_genz).length;
  renderList();
}

function renderList() {
  const q = (document.getElementById('gz-q').value || '').trim().toLowerCase();
  const list = _users.filter(u => !q
    || (u.name || '').toLowerCase().includes(q)
    || (u.username || '').toLowerCase().includes(q)
    || (u.nickname || '').toLowerCase().includes(q));
  const el = document.getElementById('gz-list');
  if (!list.length) { el.innerHTML = '<div class="gz-empty">ไม่พบสมาชิก</div>'; return; }
  el.innerHTML = list.map(u => `
    <div class="gz-row" data-id="${esc(u.id)}">
      <div class="gz-avatar">${u.avatar_url ? `<img src="${esc(u.avatar_url)}" alt="">` : esc(initials(u.name))}</div>
      <div class="gz-info">
        <div class="gz-name">${esc(u.name)}${u.is_genz ? ' <span class="gz-badge">GenZ</span>' : ''}</div>
        <div class="gz-sub">@${esc(u.username)} · ${esc(u.role)}${u.nickname ? ' · ' + esc(u.nickname) : ''}</div>
      </div>
      <label class="gz-switch" title="${u.is_genz ? 'อยู่ใน GenZ Team' : 'ยังไม่ได้เป็น GenZ'}">
        <input type="checkbox" ${u.is_genz ? 'checked' : ''} onchange="toggleUser('${esc(u.id)}', this)">
        <span class="gz-slider"></span>
      </label>
    </div>`).join('');
}

async function toggleUser(id, cb) {
  cb.disabled = true;
  const next = cb.checked;
  const r = await API.genzTeam.toggle(id, next);
  cb.disabled = false;
  if (!r?.ok) {
    cb.checked = !next;
    Utils.toast?.(r?.data?.message || 'อัปเดตไม่สำเร็จ', 'error');
    return;
  }
  const u = _users.find(x => x.id === id);
  if (u) u.is_genz = next;
  document.getElementById('stat-genz').textContent = _users.filter(x => x.is_genz).length;
  Utils.toast?.(next ? 'เพิ่มเข้า GenZ Team แล้ว' : 'ถอดออกจาก GenZ Team แล้ว', 'success');
  // Update the row's badge without a full re-render.
  const row = document.querySelector(`.gz-row[data-id="${CSS.escape(id)}"] .gz-name`);
  if (row && u) row.innerHTML = esc(u.name) + (next ? ' <span class="gz-badge">GenZ</span>' : '');
}

loadAll();
</script>
</body>
</html>
