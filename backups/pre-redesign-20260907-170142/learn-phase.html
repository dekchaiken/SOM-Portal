<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phase — Learning — SOM-Portal</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <script src="assets/js/theme.js"></script>
  <link rel="stylesheet" href="assets/css/dark.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/ui-themes.css">
  <style>
    /* ────────── Page-level CSS vars (override-able from course cover_color) ────────── */
    :root {
      --accent:        #f26419;
      --accent-soft:   rgba(242,100,25,.10);
      --accent-line:   rgba(242,100,25,.35);
      --accent-glow:   rgba(242,100,25,.18);
      --card-bg:       var(--bg-card, #fff);
      --section-gap:   20px;
      --shadow-sm:     0 1px 2px rgba(15,17,23,.04), 0 1px 1px rgba(15,17,23,.03);
      --shadow-md:     0 4px 12px rgba(15,17,23,.06), 0 2px 4px rgba(15,17,23,.04);
      --shadow-lg:     0 12px 28px rgba(15,17,23,.10), 0 4px 10px rgba(15,17,23,.05);
    }
    html[data-theme="dark"] {
      --shadow-sm: 0 1px 2px rgba(0,0,0,.30);
      --shadow-md: 0 4px 14px rgba(0,0,0,.35);
      --shadow-lg: 0 14px 32px rgba(0,0,0,.45);
    }

    /* ════════════════════════════════════════════════════════
       PHASE HERO — same blocks.so design family
       ════════════════════════════════════════════════════════ */
    .lp-hero {
      position:relative; overflow:hidden;
      border:1px solid var(--border); border-radius:14px;
      padding:22px 26px; margin-bottom:var(--section-gap);
      background:var(--card-bg);
      box-shadow:var(--shadow-sm);
      display:flex; align-items:center; gap:18px;
    }
    .lp-hero::before {
      content:''; position:absolute; top:0; right:0; width:260px; height:130px;
      background-image:radial-gradient(circle, var(--accent-line) 1px, transparent 1px);
      background-size:14px 14px;
      mask-image:linear-gradient(225deg, black 0%, transparent 70%);
      -webkit-mask-image:linear-gradient(225deg, black 0%, transparent 70%);
      opacity:.5; pointer-events:none;
    }
    .lp-hero::after {
      content:''; position:absolute; bottom:-40px; left:-40px; width:200px; height:200px;
      background:radial-gradient(circle, var(--accent-glow) 0%, transparent 65%);
      pointer-events:none;
    }
    .lp-hero-mark {
      width:50px; height:50px; border-radius:12px; flex-shrink:0; position:relative; z-index:1;
      display:flex; align-items:center; justify-content:center;
      background:linear-gradient(135deg, var(--accent-soft), transparent);
      border:1px solid var(--accent-line);
      color:var(--accent);
      font-size:22px; line-height:1; font-weight:700;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.5);
    }
    .lp-hero-body { flex:1; min-width:0; position:relative; z-index:1 }
    .lp-hero-eyebrow {
      font-size:10.5px; font-weight:700; color:var(--accent);
      text-transform:uppercase; letter-spacing:.08em; margin-bottom:5px;
    }
    .lp-hero h1 { margin:0 0 4px; font-size:18px; font-weight:700; letter-spacing:-.015em }
    .lp-hero p  { margin:0; color:var(--text-muted); font-size:12.5px; line-height:1.6; max-width:680px }
    .lp-hero-status { position:relative; z-index:1; flex-shrink:0 }

    /* Pill */
    .pill {
      display:inline-flex; align-items:center; gap:5px;
      font-size:10.5px; font-weight:700;
      padding:5px 11px; border-radius:999px;
      text-transform:uppercase; letter-spacing:.04em;
    }
    .pill .dotmark { width:5px; height:5px; border-radius:50%; background:currentColor; position:relative }
    .pill-blue    { background:rgba(59,130,246,.15); color:#3b82f6 }
    .pill-orange  { background:var(--accent-soft);   color:var(--accent) }
    .pill-green   { background:rgba(16,185,129,.15); color:#10b981 }
    .pill-orange .dotmark::after {
      content:''; position:absolute; inset:-3px; border-radius:50%;
      border:2px solid currentColor; opacity:.5;
      animation:pulseRing 1.6s cubic-bezier(.4,0,.6,1) infinite;
    }
    @keyframes pulseRing {
      0% { transform:scale(.6); opacity:.5 }
      80% { transform:scale(1.6); opacity:0 }
      100% { transform:scale(1.6); opacity:0 }
    }

    /* ════════════════════════════════════════════════════════
       LESSONS LAYOUT — 2col with sticky nav
       ════════════════════════════════════════════════════════ */
    .lp-layout { display:grid; gap:20px; grid-template-columns:280px 1fr }
    @media (max-width:900px) { .lp-layout { grid-template-columns:1fr } }

    .lp-nav {
      position:sticky; top:12px;
      background:var(--card-bg); border:1px solid var(--border); border-radius:12px; padding:16px;
      box-shadow:var(--shadow-sm);
    }
    .lp-nav-label {
      display:flex; align-items:center; gap:8px;
      font-size:10px; font-weight:700; color:var(--text-muted);
      text-transform:uppercase; letter-spacing:.08em;
      margin-bottom:12px;
    }
    .lp-nav-label::before {
      content:''; width:5px; height:5px; border-radius:50%; background:var(--accent);
      box-shadow:0 0 0 3px var(--accent-soft);
    }
    .lp-nav-item {
      display:flex; align-items:flex-start; gap:10px;
      padding:9px 11px; border-radius:8px; cursor:pointer;
      font-size:12px; color:var(--text-muted); margin-bottom:3px;
      transition:background .14s, color .14s, transform .14s;
      text-decoration:none; border:1px solid transparent;
    }
    .lp-nav-item:hover {
      background:var(--accent-soft); color:var(--text);
      transform:translateX(2px);
    }
    .lp-nav-item.active {
      background:var(--accent-soft); color:var(--accent);
      border-color:var(--accent-line); font-weight:600;
    }
    .lp-nav-num {
      width:20px; height:20px; border-radius:6px; flex-shrink:0;
      display:flex; align-items:center; justify-content:center;
      background:var(--border); color:var(--text-muted);
      font-size:10.5px; font-weight:700;
      transition:background .14s, color .14s;
    }
    .lp-nav-item.active .lp-nav-num,
    .lp-nav-item:hover .lp-nav-num {
      background:var(--accent); color:#fff;
    }

    .lp-nav-divider { border:none; border-top:1px solid var(--border); margin:14px 0 12px }

    .lp-nav-cta {
      display:flex; align-items:center; justify-content:center; gap:6px;
      width:100%; padding:10px 14px; border-radius:9px;
      background:var(--accent); color:#fff; border:0; cursor:pointer;
      font-weight:600; font-size:12.5px;
      box-shadow:0 2px 8px var(--accent-glow);
      transition:filter .15s, transform .15s, box-shadow .15s;
    }
    .lp-nav-cta:hover {
      filter:brightness(1.08); transform:translateY(-1px);
      box-shadow:0 4px 14px var(--accent-glow);
    }

    /* Lesson cards */
    .lp-lesson {
      background:var(--card-bg); border:1px solid var(--border); border-radius:12px;
      padding:24px 28px; margin-bottom:14px;
      box-shadow:var(--shadow-sm);
      animation:lessonIn .45s cubic-bezier(.16,1,.3,1) both;
    }
    @keyframes lessonIn {
      from { opacity:0; transform:translateY(8px) }
      to   { opacity:1; transform:translateY(0) }
    }
    .lp-lesson:nth-child(1) { animation-delay:.05s }
    .lp-lesson:nth-child(2) { animation-delay:.10s }
    .lp-lesson:nth-child(3) { animation-delay:.15s }
    .lp-lesson:nth-child(n+4) { animation-delay:.20s }

    .lp-lesson-eyebrow {
      font-size:10.5px; font-weight:700; color:var(--accent);
      text-transform:uppercase; letter-spacing:.08em; margin-bottom:6px;
    }
    .lp-lesson h2 {
      margin:0 0 16px; font-size:18px; font-weight:700; letter-spacing:-.01em;
      padding-bottom:14px; border-bottom:1px solid var(--border);
    }
    .lp-lesson-body { line-height:1.75; font-size:14px }
    .lp-lesson-body p { margin:10px 0 }
    .lp-lesson-body ul, .lp-lesson-body ol { padding-left:24px; margin:8px 0 }
    .lp-lesson-body li { margin:5px 0 }
    .lp-lesson-body table {
      margin:14px 0; border-collapse:collapse;
      border-radius:8px; overflow:hidden;
      box-shadow:var(--shadow-sm);
    }
    .lp-lesson-body table th, .lp-lesson-body table td { border:1px solid var(--border)!important }
    .lp-lesson-body pre {
      background:#0f172a; color:#e2e8f0; padding:14px;
      border-radius:8px; overflow:auto; font-size:12.5px; line-height:1.55;
    }
    .lp-lesson-body code:not(pre code) {
      background:var(--accent-soft); color:var(--accent);
      padding:1px 6px; border-radius:5px; font-size:.92em;
    }
    .lp-lesson-body h3 { margin-top:18px; font-size:15px }

    /* ════════════════════════════════════════════════════════
       QUIZ VIEW
       ════════════════════════════════════════════════════════ */
    .lp-quiz-card {
      background:var(--card-bg); border:1px solid var(--border); border-radius:14px;
      padding:26px 30px; box-shadow:var(--shadow-sm);
      position:relative; overflow:hidden;
    }
    .lp-quiz-card::before {
      content:''; position:absolute; top:0; right:0; width:200px; height:100px;
      background-image:radial-gradient(circle, var(--accent-line) 1px, transparent 1px);
      background-size:14px 14px;
      mask-image:linear-gradient(225deg, black 0%, transparent 70%);
      -webkit-mask-image:linear-gradient(225deg, black 0%, transparent 70%);
      opacity:.4; pointer-events:none;
    }
    .lp-quiz-head {
      display:flex; justify-content:space-between; align-items:center;
      margin-bottom:24px; gap:14px; flex-wrap:wrap;
      position:relative; z-index:1;
    }
    .lp-quiz-eyebrow {
      font-size:10.5px; font-weight:700; color:var(--accent);
      text-transform:uppercase; letter-spacing:.08em; margin-bottom:5px;
    }
    .lp-quiz-head h2 { margin:0; font-size:20px; letter-spacing:-.015em }
    .lp-quiz-desc { font-size:12px; color:var(--text-muted); margin-top:5px; line-height:1.5 }

    .q-block {
      padding:20px 22px; border:1px solid var(--border); border-radius:12px;
      margin-bottom:14px; background:var(--bg-card);
      animation:qIn .35s cubic-bezier(.16,1,.3,1) both;
      transition:border-color .18s;
    }
    .q-block:hover { border-color:var(--accent-line) }
    @keyframes qIn {
      from { opacity:0; transform:translateY(8px) }
      to   { opacity:1; transform:translateY(0) }
    }
    .q-block:nth-child(1)   { animation-delay:.04s }
    .q-block:nth-child(2)   { animation-delay:.08s }
    .q-block:nth-child(3)   { animation-delay:.12s }
    .q-block:nth-child(4)   { animation-delay:.16s }
    .q-block:nth-child(5)   { animation-delay:.20s }
    .q-block:nth-child(n+6) { animation-delay:.24s }

    .q-num {
      display:inline-flex; align-items:center; justify-content:center;
      width:26px; height:26px; border-radius:8px;
      background:var(--accent-soft); color:var(--accent);
      font-size:12px; font-weight:700;
      margin-right:10px;
    }
    .q-question {
      display:flex; align-items:flex-start; gap:0;
      font-weight:600; margin-bottom:14px; line-height:1.55; font-size:14px;
    }
    .q-question .q-text { flex:1; padding-top:3px }
    .q-question .q-hint {
      font-size:11px; color:var(--text-muted); font-weight:500;
      margin-left:8px; padding:2px 9px; border-radius:999px;
      background:var(--border);
    }

    .q-option {
      display:flex; gap:12px; align-items:center;
      padding:12px 16px;
      border:1.5px solid var(--border); border-radius:9px;
      margin-bottom:8px;
      cursor:pointer;
      transition:background .14s, border-color .14s, transform .14s;
      font-size:13px; line-height:1.5;
    }
    .q-option:hover {
      background:var(--accent-soft);
      border-color:var(--accent-line);
      transform:translateX(2px);
    }
    .q-option input { margin:0; cursor:pointer; accent-color:var(--accent) }
    .q-option:has(input:checked) {
      background:var(--accent-soft);
      border-color:var(--accent);
      color:var(--accent); font-weight:600;
    }
    .q-option textarea {
      width:100%; resize:vertical; min-height:80px;
      padding:10px 12px; border:1px solid var(--border); border-radius:8px;
      background:var(--bg-card); color:var(--text);
      font-family:var(--font); font-size:13px; line-height:1.6;
      transition:border-color .14s, box-shadow .14s;
    }
    .q-option textarea:focus {
      outline:none; border-color:var(--accent);
      box-shadow:0 0 0 3px var(--accent-soft);
    }

    .lp-quiz-actions {
      display:flex; gap:10px; justify-content:flex-end;
      margin-top:22px; padding-top:18px; border-top:1px solid var(--border);
    }
    .lp-btn-primary {
      padding:10px 22px; border-radius:9px; font-weight:600; font-size:13px;
      background:var(--accent); color:#fff; border:0; cursor:pointer;
      display:inline-flex; align-items:center; gap:6px;
      box-shadow:0 2px 8px var(--accent-glow);
      transition:filter .15s, transform .15s, box-shadow .15s;
    }
    .lp-btn-primary:hover:not(:disabled) {
      filter:brightness(1.08); transform:translateY(-1px);
      box-shadow:0 4px 14px var(--accent-glow);
    }
    .lp-btn-primary:disabled { opacity:.6; cursor:not-allowed }

    /* ════════════════════════════════════════════════════════
       RESULT VIEW — Pass / Fail celebration
       ════════════════════════════════════════════════════════ */
    .lp-result {
      background:var(--card-bg); border:1px solid var(--border); border-radius:14px;
      padding:0; box-shadow:var(--shadow-sm);
      position:relative; overflow:hidden;
    }

    /* Banner — different background per pass/fail */
    .lp-result-banner {
      position:relative; overflow:hidden;
      padding:48px 28px 32px; text-align:center;
      background:linear-gradient(180deg, var(--banner-soft, var(--accent-soft)) 0%, transparent 100%);
    }
    /* Confetti rays — only on pass */
    .lp-result-banner.passed::before {
      content:''; position:absolute; inset:0; pointer-events:none;
      background-image:
        radial-gradient(circle at 15% 30%, var(--accent) 2px, transparent 3px),
        radial-gradient(circle at 85% 20%, #10b981 2px, transparent 3px),
        radial-gradient(circle at 25% 70%, #3b82f6 2px, transparent 3px),
        radial-gradient(circle at 75% 75%, #f59e0b 2px, transparent 3px),
        radial-gradient(circle at 45% 15%, #8b5cf6 2px, transparent 3px),
        radial-gradient(circle at 55% 85%, #ec4899 2px, transparent 3px);
      opacity:0; animation:confettiPop .7s cubic-bezier(.16,1,.3,1) .25s forwards;
    }
    @keyframes confettiPop {
      0% { opacity:0; transform:scale(.5) }
      60% { opacity:1; transform:scale(1.05) }
      100% { opacity:.8; transform:scale(1) }
    }

    /* Score ring */
    .lp-ring {
      width:140px; height:140px; margin:0 auto 22px;
      border-radius:50%; position:relative;
      background:conic-gradient(var(--ring-color, var(--accent)) calc(var(--ring-pct, 0) * 1%), var(--border) 0);
      display:flex; align-items:center; justify-content:center;
      animation:ringSpin .8s cubic-bezier(.16,1,.3,1);
      box-shadow:0 8px 28px var(--accent-glow);
    }
    @keyframes ringSpin {
      from { transform:scale(.7) rotate(-30deg); opacity:0 }
      to   { transform:scale(1) rotate(0); opacity:1 }
    }
    .lp-ring::before {
      content:''; position:absolute; inset:9px; border-radius:50%;
      background:var(--card-bg);
    }
    .lp-ring span {
      position:relative; font-size:32px; font-weight:800; color:var(--text);
      font-variant-numeric:tabular-nums; letter-spacing:-.01em;
    }
    .lp-ring .pct { font-size:18px; vertical-align:top; opacity:.6 }

    .lp-result-status {
      font-size:24px; font-weight:800; letter-spacing:-.01em;
      margin-bottom:6px;
      animation:fadeUp .5s cubic-bezier(.16,1,.3,1) .15s both;
    }
    .lp-result-status.passed { color:#10b981 }
    .lp-result-status.failed { color:var(--accent) }

    .lp-result-detail {
      color:var(--text-muted); font-size:12.5px; line-height:1.6;
      animation:fadeUp .5s cubic-bezier(.16,1,.3,1) .25s both;
      max-width:480px; margin:0 auto;
    }
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(8px) }
      to   { opacity:1; transform:translateY(0) }
    }

    /* Stats row */
    .lp-result-stats {
      display:grid; grid-template-columns:repeat(4, 1fr); gap:1px;
      background:var(--border);
      border-top:1px solid var(--border); border-bottom:1px solid var(--border);
    }
    .lp-stat-cell {
      background:var(--card-bg);
      padding:18px 14px; text-align:center;
    }
    .lp-stat-cell .n {
      font-size:20px; font-weight:800; color:var(--text); line-height:1;
      font-variant-numeric:tabular-nums;
    }
    .lp-stat-cell .l {
      font-size:10.5px; color:var(--text-muted); margin-top:6px;
      text-transform:uppercase; letter-spacing:.06em; font-weight:600;
    }

    /* Summary rows */
    .lp-result-body { padding:24px 28px }
    .lp-result-section-label {
      display:flex; align-items:center; gap:8px;
      font-size:10.5px; font-weight:700; color:var(--text-muted);
      text-transform:uppercase; letter-spacing:.08em;
      margin-bottom:12px;
    }
    .lp-result-section-label::before {
      content:''; width:5px; height:5px; border-radius:50%; background:var(--accent);
      box-shadow:0 0 0 3px var(--accent-soft);
    }

    .lp-summary-row {
      display:flex; justify-content:space-between; align-items:center;
      padding:11px 14px; border:1px solid var(--border); border-radius:9px;
      margin-bottom:6px;
      font-size:12.5px; gap:10px;
      animation:rowIn .35s cubic-bezier(.16,1,.3,1) both;
    }
    @keyframes rowIn {
      from { opacity:0; transform:translateX(-6px) }
      to   { opacity:1; transform:translateX(0) }
    }
    .lp-summary-row:nth-child(1) { animation-delay:.05s }
    .lp-summary-row:nth-child(2) { animation-delay:.08s }
    .lp-summary-row:nth-child(3) { animation-delay:.11s }
    .lp-summary-row:nth-child(4) { animation-delay:.14s }
    .lp-summary-row:nth-child(5) { animation-delay:.17s }
    .lp-summary-row:nth-child(n+6) { animation-delay:.20s }

    .lp-summary-row.correct {
      background:rgba(16,185,129,.06);
      border-color:rgba(16,185,129,.30); color:#10b981;
    }
    .lp-summary-row.wrong {
      background:rgba(239,68,68,.06);
      border-color:rgba(239,68,68,.30); color:#ef4444;
    }
    .lp-summary-row .check {
      width:22px; height:22px; flex-shrink:0;
      border-radius:50%; display:flex; align-items:center; justify-content:center;
      font-size:13px; font-weight:800;
    }
    .lp-summary-row.correct .check { background:#10b981; color:#fff }
    .lp-summary-row.wrong   .check { background:#ef4444; color:#fff }
    .lp-summary-row .label { flex:1; min-width:0 }
    .lp-summary-row .label .qnum {
      font-size:11px; opacity:.65; margin-right:4px; font-weight:700;
    }
    .lp-summary-row .verdict {
      font-weight:700; font-size:11.5px; flex-shrink:0;
      text-transform:uppercase; letter-spacing:.04em;
    }

    .lp-tip {
      margin-top:16px; padding:14px 16px;
      background:rgba(59,130,246,.07);
      border:1px solid rgba(59,130,246,.22);
      border-left:3px solid #3b82f6;
      border-radius:9px;
      font-size:12.5px; color:#3b82f6; line-height:1.6;
      display:flex; gap:10px; align-items:flex-start;
    }
    .lp-tip-icon { flex-shrink:0; font-size:16px }

    .lp-result-actions {
      display:flex; gap:10px; justify-content:center;
      padding:20px 28px 26px; flex-wrap:wrap;
      border-top:1px solid var(--border); background:var(--bg);
    }
    .lp-result-actions .btn { min-width:140px; justify-content:center }

    @media (max-width:640px) {
      .lp-result-stats { grid-template-columns:repeat(2, 1fr) }
      .lp-result-banner { padding:36px 18px 26px }
      .lp-result-body, .lp-result-actions { padding-left:18px; padding-right:18px }
      .lp-result-status { font-size:20px }
      .lp-ring { width:110px; height:110px }
      .lp-ring span { font-size:26px }
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      .lp-lesson, .q-block, .lp-ring, .lp-result-status,
      .lp-result-detail, .lp-summary-row, .lp-result-banner.passed::before {
        animation:none !important; transition:none !important;
      }
      .pill-orange .dotmark::after { animation:none }
    }
  </style>
</head>
<body>

<div class="app-shell">
  <aside id="sidebar-mount"></aside>

  <div class="main-content">
    <header class="topbar">
      <div class="topbar-title">
        <div class="page-title" id="ph-title">กำลังโหลด...</div>
        <div class="page-sub" id="ph-sub">—</div>
      </div>
      <div class="topbar-actions">
        <a id="back-link" href="learn.html" class="btn btn-ghost btn-sm">← กลับ</a>
      </div>
    </header>

    <main class="page-content">

      <section id="header-box" class="lp-hero" style="display:none">
        <div class="lp-hero-mark" id="ph-icon"><i data-icon="book"></i></div>
        <div class="lp-hero-body">
          <div class="lp-hero-eyebrow" id="ph-eyebrow">Phase</div>
          <h1 id="ph-h1">—</h1>
          <p id="ph-desc">—</p>
        </div>
        <div class="lp-hero-status" id="ph-status-badge"></div>
      </section>

      <!-- Lessons View -->
      <div id="view-lessons">
        <div class="lp-layout">
          <aside>
            <div class="lp-nav">
              <div class="lp-nav-label">บทเรียน</div>
              <div id="lesson-nav-list"></div>
              <hr class="lp-nav-divider">
              <button class="lp-nav-cta" id="phase-cta" onclick="startQuiz()">
                <span id="phase-cta-label">ทำแบบฝึกหัด</span>
                <span style="font-weight:700">→</span>
              </button>
            </div>
          </aside>
          <div>
            <div id="lesson-container">
              <div class="lp-lesson"><div data-skel="text" data-rows="6"></div></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Quiz View -->
      <div id="view-quiz" style="display:none">
        <div class="lp-quiz-card">
          <div class="lp-quiz-head">
            <div>
              <div class="lp-quiz-eyebrow">Phase Quiz</div>
              <h2 id="quiz-title">Quiz</h2>
              <div class="lp-quiz-desc" id="quiz-desc"></div>
            </div>
            <button class="btn btn-ghost btn-sm" onclick="backToLessons()">← กลับไปอ่านบท</button>
          </div>
          <div id="quiz-questions"></div>
          <div class="lp-quiz-actions">
            <button class="btn btn-ghost" onclick="backToLessons()">ยกเลิก</button>
            <button class="lp-btn-primary" id="btn-submit" onclick="submitQuiz()">
              <span>ส่งคำตอบ</span>
              <span>→</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Result View -->
      <div id="view-result" style="display:none">
        <div class="lp-result">
          <div class="lp-result-banner" id="r-banner">
            <div class="lp-ring" id="r-ring"><span id="r-score">0<span class="pct">%</span></span></div>
            <div class="lp-result-status" id="r-status">—</div>
            <div class="lp-result-detail" id="r-detail">—</div>
          </div>

          <div class="lp-result-stats">
            <div class="lp-stat-cell"><div class="n" id="r-stat-score">0%</div><div class="l">คะแนนรอบนี้</div></div>
            <div class="lp-stat-cell"><div class="n" id="r-stat-best">0%</div><div class="l">ดีสุด</div></div>
            <div class="lp-stat-cell"><div class="n" id="r-stat-correct">0/0</div><div class="l">ตอบถูก</div></div>
            <div class="lp-stat-cell"><div class="n" id="r-stat-attempts">0</div><div class="l">ครั้งที่ทำ</div></div>
          </div>

          <div class="lp-result-body">
            <div class="lp-result-section-label">รายข้อ</div>
            <div id="r-summary"></div>
            <div id="r-tip"></div>
          </div>

          <div class="lp-result-actions">
            <button class="btn btn-ghost" id="r-retry" onclick="retryQuiz()">ลองทำใหม่</button>
            <a id="r-back" href="learn.html" class="btn btn-ghost">กลับไปคอร์ส</a>
            <button class="lp-btn-primary" id="r-next" onclick="goNext()" style="display:none">
              <span>ไป Phase ถัดไป</span>
              <span>→</span>
            </button>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="assets/js/utils.js"></script>
<script src="assets/js/skeletons.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/analytics.js"></script>
<script src="assets/js/analytics-features.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/maintenance.js"></script>
<script>
  if (!Auth.requireAuth()) {}
  Layout.render('learn');

  // Force fresh fetch when navigating back via bfcache (avoid stale state)
  window.addEventListener('pageshow', (ev) => { if (ev.persisted) location.reload(); });

  const phaseId = new URLSearchParams(location.search).get('id');
  if (!phaseId) { location.href = 'learn.html'; }
  if (phaseId) trackPhaseView(phaseId);

  let _phase = null;
  let _lessons = [];
  let _quiz = null;
  let _phasesAll = [];
  let _courseId = null;
  let _hasQuiz = true;   // default true — updated on init

  function hexAlpha(hex, a) {
    const n = parseInt(hex.slice(1), 16);
    const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    return `rgba(${r},${g},${b},${a})`;
  }
  function applyAccent(color) {
    if (!color || !/^#[0-9a-fA-F]{6}$/.test(color)) return;
    const root = document.documentElement;
    root.style.setProperty('--accent',      color);
    root.style.setProperty('--accent-soft', hexAlpha(color, .10));
    root.style.setProperty('--accent-line', hexAlpha(color, .35));
    root.style.setProperty('--accent-glow', hexAlpha(color, .18));
  }

  (async () => {
    // Step 1: find phase to know course_id
    const allPhasesRes = await API.courses.listPhases();
    if (!allPhasesRes?.ok) { Toast.error('Load failed'); return; }
    const allPhases = allPhasesRes.data.data || [];
    _phase = allPhases.find(p => p.id === phaseId);
    if (!_phase) { Toast.error('ไม่เจอ phase นี้'); location.href = 'learn.html'; return; }
    _courseId = _phase.course_id;

    // Step 2: get all phases in this course + lessons + course (for accent color)
    // + quiz probe (to know if phase has quiz for CTA button)
    const [scopedRes, lessonsRes, courseRes, quizRes] = await Promise.all([
      API.courses.listPhases(_courseId),
      API.courses.listLessons(phaseId),
      API.courses.getCourse(_courseId),
      API.courses.getQuiz(phaseId),
    ]);
    _phasesAll = scopedRes?.ok ? (scopedRes.data.data || []) : [];
    _phase = _phasesAll.find(p => p.id === phaseId) || _phase;
    _hasQuiz = !!(quizRes?.ok && quizRes.data?.data?.questions?.length);

    // Apply course's accent color
    if (courseRes?.ok) applyAccent(courseRes.data.data?.cover_color);

    // Back links → course page
    document.getElementById('back-link').href = `learn-course.html?id=${encodeURIComponent(_courseId)}`;
    document.getElementById('r-back').href    = `learn-course.html?id=${encodeURIComponent(_courseId)}`;

    if (_phase.my_status === 'locked') {
      Toast.warning('Phase นี้ยังล็อกอยู่');
      location.href = `learn-course.html?id=${encodeURIComponent(_courseId)}`; return;
    }

    renderHeader();
    setupPhaseCta();
    if (lessonsRes?.ok) {
      _lessons = lessonsRes.data.data || [];
      renderLessons();
    }
  })();

  // Swap the sidebar CTA button based on whether phase has a quiz.
  // Quiz-less phases: user must click "จบเนื้อหา Phase นี้" to complete.
  function setupPhaseCta() {
    const btn = document.getElementById('phase-cta');
    const label = document.getElementById('phase-cta-label');
    if (!btn || !label) return;
    const alreadyPassed = _phase.my_status === 'passed';

    if (_hasQuiz) {
      label.textContent = alreadyPassed ? 'ทำแบบฝึกหัดอีกครั้ง' : 'ทำแบบฝึกหัด';
      btn.onclick = () => startQuiz();
    } else if (alreadyPassed) {
      label.innerHTML = '<i data-icon="check"></i> จบ Phase นี้แล้ว';
      btn.disabled = true;
      btn.style.opacity = '.6';
      btn.style.cursor  = 'default';
    } else {
      label.innerHTML = '<i data-icon="check-circle"></i> จบเนื้อหา Phase นี้';
      btn.onclick = () => completePhaseByButton();
    }
  }

  async function completePhaseByButton() {
    const btn = document.getElementById('phase-cta');
    if (!btn) return;
    const ok = await confirmDialog(
      'หลังจากนี้ระบบจะบันทึกว่า "ผ่าน" phase นี้แล้ว และปลด Phase ถัดไปให้',
      'จบเนื้อหา Phase นี้?',
      { confirmText: 'จบ Phase นี้', cancelText: 'ยกเลิก', variant: 'primary' }
    );
    if (!ok) return;
    btn.disabled = true;
    const res = await API.courses.completePhase(phaseId);
    if (!res?.ok) {
      Toast.error(res?.data?.message || 'บันทึกไม่สำเร็จ');
      btn.disabled = false;
      return;
    }
    Toast.success('บันทึกจบ Phase เรียบร้อย <i data-icon="sparkles"></i>');
    const next = nextPhase();
    setTimeout(() => {
      location.href = next
        ? `learn-phase.html?id=${encodeURIComponent(next.id)}`
        : `learn-course.html?id=${encodeURIComponent(_courseId)}`;
    }, 900);
  }

  function renderHeader() {
    const cleanTitle = _phase.title.replace(/^Phase\s*\d+\s*[—–-]\s*/i, '');
    document.getElementById('ph-title').textContent = `Phase ${_phase.order} — ${cleanTitle}`;
    document.getElementById('ph-sub').textContent   = _phase.subtitle || '';
    document.getElementById('ph-icon').innerHTML  = _phase.icon || '<i data-icon="book"></i>';
    document.getElementById('ph-eyebrow').textContent = `Phase ${_phase.order}`;
    document.getElementById('ph-h1').textContent    = cleanTitle;
    document.getElementById('ph-desc').textContent  = _phase.description || _phase.subtitle || '';

    const badges = {
      unlocked:    '<span class="pill pill-blue"><i data-icon="play"></i> เริ่มได้</span>',
      in_progress: '<span class="pill pill-orange"><span class="dotmark"></span> กำลังเรียน</span>',
      passed:      `<span class="pill pill-green"><i data-icon="check"></i> ผ่านแล้ว ${_phase.my_score || 0}%</span>`,
    };
    document.getElementById('ph-status-badge').innerHTML = badges[_phase.my_status] || '';
    document.getElementById('header-box').style.display = 'flex';
  }

  function renderLessons() {
    const navWrap = document.getElementById('lesson-nav-list');
    navWrap.innerHTML = _lessons.map((l, i) => `
      <a class="lp-nav-item" data-idx="${i}" onclick="scrollToLesson(${i})">
        <span class="lp-nav-num">${i+1}</span>
        <span>${escHtml(l.title)}</span>
      </a>
    `).join('');

    const container = document.getElementById('lesson-container');
    if (!_lessons.length) {
      container.innerHTML = `
        <div class="lp-lesson" style="text-align:center; padding:40px 20px">
          <div style="font-size:36px; margin-bottom:8px; opacity:.4"><i data-icon="file"></i></div>
          <p style="color:var(--text-muted); margin:0">Phase นี้ยังไม่มีเนื้อหา — ลองกดทำแบบฝึกหัดได้เลย</p>
        </div>`;
      return;
    }
    container.innerHTML = _lessons.map((l, i) => `
      <div class="lp-lesson" id="les-${i}">
        <div class="lp-lesson-eyebrow">บทเรียนที่ ${i+1}</div>
        <h2>${escHtml(l.title)}</h2>
        <div class="lp-lesson-body">${l.content_html || ''}</div>
      </div>
    `).join('');

    const first = navWrap.querySelector('.lp-nav-item');
    if (first) first.classList.add('active');

    const obs = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          const idx = +e.target.id.replace('les-', '');
          navWrap.querySelectorAll('.lp-nav-item').forEach(el => el.classList.remove('active'));
          const el = navWrap.querySelector(`[data-idx="${idx}"]`);
          if (el) el.classList.add('active');
        }
      });
    }, { threshold: 0.3, rootMargin: '-20% 0px -50% 0px' });
    _lessons.forEach((_, i) => {
      const el = document.getElementById('les-' + i);
      if (el) obs.observe(el);
    });
  }

  function scrollToLesson(i) {
    document.getElementById('les-' + i)?.scrollIntoView({ behavior:'smooth', block:'start' });
  }

  // ─── QUIZ ─────────────────────────────
  async function startQuiz() {
    const res = await API.courses.getQuiz(phaseId);
    if (!res?.ok) { Toast.warning('ยังไม่มีแบบฝึกหัดใน phase นี้'); return; }
    _quiz = res.data.data;
    if (!_quiz?.questions?.length) { Toast.warning('ยังไม่มีคำถาม'); return; }

    document.getElementById('view-lessons').style.display = 'none';
    document.getElementById('view-quiz').style.display    = 'block';
    document.getElementById('view-result').style.display  = 'none';

    document.getElementById('quiz-title').textContent = _quiz.title || 'แบบฝึกหัด';
    document.getElementById('quiz-desc').textContent  = (_quiz.description || '') + ` · ต้องได้ ${_phase.pass_score}% ขึ้นไปถึงผ่าน`;

    const wrap = document.getElementById('quiz-questions');
    wrap.innerHTML = _quiz.questions.map((q, i) => {
      const type = q.type || 'single';
      let optionsHtml = '';
      let typeHint = '';
      if (type === 'truefalse') {
        optionsHtml = ['true','false'].map(v => `
          <label class="q-option">
            <input type="radio" name="q_${q.id}" value="${v}">
            <span>${v === 'true' ? 'True (ถูก)' : 'False (ผิด)'}</span>
          </label>
        `).join('');
      } else if (type === 'multi') {
        typeHint = '<span class="q-hint">เลือกหลายข้อ</span>';
        optionsHtml = (q.choices || []).map((c, ci) => `
          <label class="q-option">
            <input type="checkbox" name="q_${q.id}" value="${ci}">
            <span>${escHtml(c)}</span>
          </label>
        `).join('');
      } else if (type === 'short') {
        typeHint = '<span class="q-hint">เขียนตอบ</span>';
        optionsHtml = `<div class="q-option" style="padding:0; border:none; background:none"><textarea name="q_${q.id}" rows="3" placeholder="เขียนคำตอบของคุณที่นี่..."></textarea></div>`;
      } else {
        optionsHtml = (q.choices || []).map((c, ci) => `
          <label class="q-option">
            <input type="radio" name="q_${q.id}" value="${ci}">
            <span>${escHtml(c)}</span>
          </label>
        `).join('');
      }
      return `<div class="q-block" id="qb_${q.id}" data-type="${type}" data-qid="${q.id}">
        <div class="q-question">
          <span class="q-num">${i+1}</span>
          <span class="q-text">${escHtml(q.question || '')}</span>
          ${typeHint}
        </div>
        ${optionsHtml}
      </div>`;
    }).join('');
  }

  function backToLessons() {
    document.getElementById('view-lessons').style.display = '';
    document.getElementById('view-quiz').style.display    = 'none';
    document.getElementById('view-result').style.display  = 'none';
  }

  async function submitQuiz() {
    const answers = {};
    let missing = 0;
    for (const q of _quiz.questions) {
      const type = q.type || 'single';
      if (type === 'short') {
        const ta = document.querySelector(`textarea[name="q_${q.id}"]`);
        const v = (ta?.value || '').trim();
        if (!v) { missing++; continue; }
        answers[q.id] = v;
        continue;
      }
      const inputs = document.querySelectorAll(`input[name="q_${q.id}"]`);
      if (type === 'truefalse') {
        const sel = [...inputs].find(i => i.checked);
        if (!sel) { missing++; continue; }
        answers[q.id] = sel.value === 'true';
      } else if (type === 'multi') {
        const vals = [...inputs].filter(i => i.checked).map(i => +i.value);
        if (!vals.length) { missing++; continue; }
        answers[q.id] = vals;
      } else {
        const sel = [...inputs].find(i => i.checked);
        if (!sel) { missing++; continue; }
        answers[q.id] = +sel.value;
      }
    }
    if (missing) {
      const ok = await confirmDialog(`ยังไม่ได้ตอบ ${missing} ข้อ ส่งต่อเลยไหม?`, 'ยืนยันการส่ง',
        { confirmText: 'ส่งคำตอบ', cancelText: 'ยกเลิก', variant: 'primary' });
      if (!ok) return;
    }

    document.getElementById('btn-submit').disabled = true;
    const res = await API.courses.submitQuiz({ phase_id: phaseId, answers });
    document.getElementById('btn-submit').disabled = false;
    if (!res?.ok) { Toast.error(res?.data?.message || 'ส่งล้มเหลว'); return; }

    showResult(res.data.data);
  }

  function showResult(data) {
    document.getElementById('view-quiz').style.display   = 'none';
    document.getElementById('view-result').style.display = 'block';

    const passed = !!data.passed;

    // Banner + ring color
    const banner = document.getElementById('r-banner');
    banner.classList.toggle('passed', passed);
    banner.classList.toggle('failed', !passed);
    const ringColor = passed ? '#10b981' : 'var(--accent)';
    banner.style.setProperty('--banner-soft',
      passed ? 'rgba(16,185,129,.10)' : 'var(--accent-soft)');

    const ring = document.getElementById('r-ring');
    ring.style.setProperty('--ring-pct', data.score);
    ring.style.setProperty('--ring-color', ringColor);
    document.getElementById('r-score').innerHTML = `${data.score}<span class="pct">%</span>`;

    // Status + detail
    const statusEl = document.getElementById('r-status');
    statusEl.className = 'lp-result-status ' + (passed ? 'passed' : 'failed');
    statusEl.innerHTML = passed
      ? '<i data-icon="sparkles"></i> ยินดีด้วย! ผ่านแล้ว'
      : '😔 ยังไม่ผ่านเกณฑ์';

    document.getElementById('r-detail').textContent = passed
      ? `คะแนนสูงสุดของคุณตอนนี้คือ ${data.best_score}% · ตอบถูก ${data.correct_count} จาก ${data.total_count} ข้อ`
      : `ต้องได้ ${data.pass_score}% ขึ้นไปถึงผ่าน · ขาดอีก ${Math.max(0, data.pass_score - data.score)}% เท่านั้นเอง`;

    // Stats
    document.getElementById('r-stat-score').textContent    = data.score + '%';
    document.getElementById('r-stat-best').textContent     = data.best_score + '%';
    document.getElementById('r-stat-correct').textContent  = `${data.correct_count}/${data.total_count}`;
    document.getElementById('r-stat-attempts').textContent = data.attempts;

    // Per-question summary
    const sumWrap = document.getElementById('r-summary');
    sumWrap.innerHTML = (data.summary || []).map((s, i) => {
      const q = _quiz.questions.find(x => x.id === s.q_id) || {};
      const qFull = q.question || '';
      const qText = escHtml(qFull.slice(0, 90));
      const more  = qFull.length > 90 ? '…' : '';
      return `<div class="lp-summary-row ${s.correct ? 'correct' : 'wrong'}">
        <div class="check">${s.correct ? '✓' : '✗'}</div>
        <div class="label">
          <span class="qnum">ข้อ ${i+1}</span>${qText}${more}
        </div>
        <div class="verdict">${s.correct ? 'ถูก' : 'ผิด'}</div>
      </div>`;
    }).join('');

    // Tip box for fail case
    document.getElementById('r-tip').innerHTML = passed ? '' : `
      <div class="lp-tip">
        <span class="lp-tip-icon"><i data-icon="lightbulb"></i></span>
        <div>
          ลองกลับไปอ่านบทเรียนอีกครั้ง แล้วกลับมาทำใหม่ได้เลย —
          <strong>คะแนนสูงสุดจะถูกบันทึกไว้</strong> ไม่หาย แม้คะแนนรอบใหม่จะน้อยกว่า
        </div>
      </div>`;

    // Action buttons
    const next = nextPhase();
    document.getElementById('r-next').style.display  = (passed && next) ? '' : 'none';
    document.getElementById('r-next').dataset.nextId = next?.id || '';
    document.getElementById('r-retry').style.display = passed ? 'none' : '';

    // Smooth scroll to top for celebration
    window.scrollTo({ top:0, behavior:'smooth' });
  }

  function nextPhase() {
    const sorted = [..._phasesAll].sort((a,b) => (a.order||0) - (b.order||0));
    const idx = sorted.findIndex(p => p.id === phaseId);
    return sorted[idx + 1] || null;
  }

  function retryQuiz() { startQuiz(); }
  function goNext() {
    const id = document.getElementById('r-next').dataset.nextId;
    if (id) location.href = `learn-phase.html?id=${encodeURIComponent(id)}`;
  }
</script>
</body>
</html>
