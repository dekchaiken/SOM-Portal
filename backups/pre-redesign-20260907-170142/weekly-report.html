<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Report — SOM-Portal</title>
  <link rel="icon" href="./favicon.ico" type="image/x-icon">
  <script src="./assets/js/theme.js"></script>
  <link rel="stylesheet" href="./assets/css/dark.css">
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="stylesheet" href="./assets/css/ui-themes.css">
  <style>
    /* ── Stats Bar ── */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }
    /* blocks.so: flat 1px-bordered blocks, calm shadow on hover (no brand glow) */
    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px 18px;
      box-shadow: var(--shadow-sm);
      transition: border-color .2s, box-shadow .2s, transform .2s;
    }
    .stat-card:hover {
      border-color: color-mix(in srgb, var(--text-muted) 45%, transparent);
      box-shadow: var(--shadow);
      transform: translateY(-1px);
    }
    .stat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .stat-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--orange-dim);
      color: var(--orange);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    .stat-value {
      font-size: 28px;
      font-weight: 800;
      color: var(--text);
      line-height: 1;
      margin-bottom: 4px;
    }
    .stat-label {
      font-size: 10.5px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    /* ── Week Switcher ── */
    .week-switcher {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-card);
      padding: 4px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }
    .week-arrow {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      border-radius: 6px;
      color: var(--text-muted);
      font-size: 14px;
      cursor: pointer;
      transition: all .15s;
    }
    .week-arrow:hover:not(:disabled) {
      background: var(--bg);
      color: var(--text);
    }
    .week-arrow:disabled {
      opacity: .3;
      cursor: not-allowed;
    }
    .week-select {
      min-width: 200px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-input);
      color: var(--text);
      font-family: var(--font);
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      transition: border-color .15s, box-shadow .15s;
    }
    .week-select:hover {
      border-color: var(--orange);
    }
    .week-select:focus {
      outline: none;
      border-color: var(--orange);
      box-shadow: 0 0 0 3px var(--orange-dim);
    }

    /* ── Dashboard Grid ── */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: 1fr 1fr;
      gap: 12px;
      height: calc(100vh - 280px);
      min-height: 600px;
    }
    .dashboard-grid > .card:nth-child(1) { grid-column: 1; grid-row: 1; }
    .dashboard-grid > .card:nth-child(2) { grid-column: 3; grid-row: 1 / 3; }
    .dashboard-grid > .card:nth-child(3) { grid-column: 2; grid-row: 1; }
    .dashboard-grid > .card:nth-child(4) { grid-column: 1; grid-row: 2; }
    .dashboard-grid > .card:nth-child(5) { grid-column: 2; grid-row: 2; }

    /* ── Card Component ── */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .card-header {
      padding: 13px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg);
      flex-shrink: 0;
    }
    .card-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text);
    }
    .card-icon {
      font-size: 14px;
    }
    .card-badge {
      padding: 2px 9px;
      background: var(--orange-dim);
      color: var(--orange);
      border-radius: 999px;
      font-size: 9.5px;
      font-weight: 700;
    }
    .card-body {
      padding: 12px;
      overflow-y: auto;
      flex: 1;
      min-height: 0;
    }
    .card-body::-webkit-scrollbar {
      width: 4px;
    }
    .card-body::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 2px;
    }

    /* ── Section Component ── */
    .section {
      margin-bottom: 12px;
    }
    .section:last-child {
      margin-bottom: 0;
    }
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 8px;
    }
    .section-title {
      font-size: 10px;
      font-weight: 700;
      color: var(--text);
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .section-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 18px;
      height: 18px;
      padding: 0 6px;
      background: var(--orange-dim);
      color: var(--orange);
      border-radius: 999px;
      font-size: 9px;
      font-weight: 700;
    }
    .section-body {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* ── Item Component ── */
    .item {
      padding: 9px 11px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      transition: border-color .15s, box-shadow .15s, background .15s;
      font-size: 10.5px;
      line-height: 1.4;
    }
    .item:hover {
      background: var(--bg-card);
      border-color: color-mix(in srgb, var(--text-muted) 45%, transparent);
      box-shadow: var(--shadow-sm);
    }
    .item-content {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    .item-title {
      flex: 1;
      font-weight: 500;
      color: var(--text);
    }

    /* ── Badge Component ── */
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 9px;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .badge-sev-1 {
      background: rgba(239,68,68,.1);
      color: #dc2626;
    }
    .badge-sev-2 {
      background: rgba(245,158,11,.1);
      color: #d97706;
    }
    .badge-sev-3 {
      background: rgba(59,130,246,.1);
      color: #2563eb;
    }
    .badge-detected {
      background: rgba(34,197,94,.1);
      color: #16a34a;
    }
    .badge-not-detected {
      background: rgba(239,68,68,.1);
      color: #dc2626;
    }
    .badge-inprogress {
      background: rgba(245,158,11,.1);
      color: #d97706;
    }
    .badge-done {
      background: rgba(34,197,94,.1);
      color: #16a34a;
    }

    /* ── Empty State ── */
    .card-empty {
      padding: 32px 16px;
      text-align: center;
      color: var(--text-muted);
    }
    .card-empty-icon {
      font-size: 32px;
      margin-bottom: 8px;
      opacity: .3;
    }
    .card-empty-text {
      font-size: 11px;
    }

    /* ── Loading State ── */
    .loading-overlay {
      position: absolute;
      inset: 0;
      background: color-mix(in srgb, var(--bg-card) 85%, transparent);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--orange);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ── Skeleton Loading ── */
    @keyframes sk-shimmer {
      0%   { background-position: -200% 0; }
      100% { background-position:  200% 0; }
    }
    .sk-line {
      display: block;
      background: linear-gradient(90deg, var(--bg) 25%, var(--border) 50%, var(--bg) 75%);
      background-size: 200% 100%;
      animation: sk-shimmer 1.5s ease-in-out infinite;
      border-radius: 4px;
      height: 13px;
      margin-bottom: 8px;
    }
    .sk-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 0;
      border-bottom: 1px solid var(--border);
    }
    .sk-item:last-child { border-bottom: none; }
    .sk-badge {
      width: 28px; height: 20px; border-radius: 4px; flex-shrink: 0;
      background: linear-gradient(90deg, var(--bg) 25%, var(--border) 50%, var(--bg) 75%);
      background-size: 200% 100%;
      animation: sk-shimmer 1.5s ease-in-out infinite;
    }

    /* ── Ticket Link ── */
    .ticket-link {
      color: var(--orange);
      text-decoration: none;
      font-weight: 600;
      transition: color .15s;
    }
    .ticket-link:hover {
      color: var(--orange-hover);
      text-decoration: underline;
    }

    @media (max-width: 1400px) {
      .dashboard-grid {
        grid-template-columns: 1fr 1fr;
        grid-template-rows: auto;
        height: auto;
      }
      .dashboard-grid > .card {
        grid-column: auto !important;
        grid-row: auto !important;
      }
    }

    /* ════════════════════════════════════════════════
       Presentation Mode
    ════════════════════════════════════════════════ */
    .presentation-mode { overflow: hidden; }

    .presentation-overlay {
      position: fixed; inset: 0;
      background: var(--bg);
      z-index: 9999;
      display: flex; flex-direction: column;
    }

    .presentation-header {
      background: var(--bg-card);
      padding: 10px 20px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
      box-shadow: var(--shadow-sm);
    }

    .presentation-title {
      display: flex; align-items: center; gap: 10px;
    }
    .presentation-title h1 {
      font-size: 11px; font-weight: 700; color: var(--text);
      margin: 0; text-transform: uppercase; letter-spacing: .04em;
      font-family: var(--font);
    }
    .presentation-title p {
      font-size: 10px; color: var(--text-muted); margin: 0;
      font-family: var(--font);
    }

    .presentation-controls {
      display: flex; gap: 6px; align-items: center;
    }

    .pres-counter {
      font-size: 10px; font-weight: 700; color: var(--text-muted);
      padding: 0 10px; text-transform: uppercase; letter-spacing: .04em;
      font-family: var(--font);
    }

    .pres-btn {
      padding: 5px 10px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: var(--font);
      font-size: 10px; font-weight: 600;
      display: flex; align-items: center; gap: 5px;
      cursor: pointer;
      transition: all .15s;
      text-transform: uppercase; letter-spacing: .03em;
    }
    .pres-btn:hover:not(:disabled) {
      background: var(--orange-dim);
      border-color: var(--orange);
      color: var(--orange);
      transform: translateY(-1px);
    }
    .pres-btn:disabled { opacity: .35; cursor: not-allowed; }
    .pres-btn.active {
      background: var(--orange-dim);
      border-color: var(--orange);
      color: var(--orange);
    }
    .pres-btn-danger { color: #EF4444; }
    .pres-btn-danger:hover:not(:disabled) {
      background: rgba(239,68,68,.08);
      border-color: #EF4444;
      color: #EF4444;
    }

    .presentation-canvas {
      flex: 1; position: relative; overflow: hidden;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
    }

    .presentation-slides {
      width: 100%; height: 100%; position: relative;
    }

    .pres-slide {
      position: absolute; inset: 0;
      opacity: 0; visibility: hidden;
      transition: opacity .3s ease, visibility .3s ease;
      display: flex; align-items: center; justify-content: center;
      padding: 32px;
    }
    .pres-slide.active { opacity: 1; visibility: visible; z-index: 1; }

    .slide-content {
      width: 100%; max-width: 1200px; height: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      display: flex; flex-direction: column; overflow: hidden;
    }

    .slide-header {
      padding: 28px 36px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 14px;
    }
    .slide-header h1 {
      font-family: var(--font); font-size: 22px; font-weight: 800;
      color: var(--text); margin: 0 0 3px 0;
    }
    .slide-header h2 {
      font-family: var(--font); font-size: 14px; font-weight: 600;
      color: var(--orange); margin: 0;
    }
    .slide-icon { font-size: 44px; line-height: 1; }
    .slide-count {
      font-family: var(--font); font-size: 10px; font-weight: 600;
      color: var(--text-muted); margin: 0;
      text-transform: uppercase; letter-spacing: .04em;
    }

    .slide-body {
      flex: 1; padding: 28px 36px; overflow-y: auto;
      font-family: var(--font); font-size: 10.5px;
    }

    .overview-slide .slide-header { padding: 40px 36px; text-align: center; display: block; }
    .overview-stats { padding: 24px 36px; background: var(--bg-card); }
    .overview-stats .stats-bar { margin: 0; }
    .overview-summary {
      padding: 20px 36px 28px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }
    .summary-card {
      display: flex; align-items: center; gap: 12px;
      padding: 16px; background: var(--bg);
      border: 1px solid var(--border); border-radius: 10px;
      transition: all .15s;
    }
    .summary-card:hover { border-color: var(--orange); box-shadow: var(--shadow-orange); }
    .summary-icon { font-size: 28px; line-height: 1; }
    .summary-text h3 {
      font-family: var(--font); font-size: 10px; font-weight: 700;
      color: var(--text); margin: 0 0 3px 0;
      text-transform: uppercase; letter-spacing: .04em;
    }
    .summary-text p { font-family: var(--font); font-size: 10px; color: var(--text-muted); margin: 0; }

    .card-slide .slide-body { padding: 20px 36px; }
    .card-slide .slide-body .item {
      margin-bottom: 8px; padding: 10px;
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px; font-size: 10.5px;
    }
    .card-slide .slide-body .loading-overlay { display: none; }

    .presentation-footer {
      background: var(--bg-card); padding: 12px 20px;
      border-top: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .slide-indicators { display: flex; gap: 7px; align-items: center; }
    .slide-indicator {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--border);
      border: 1px solid var(--border);
      cursor: pointer; transition: all .15s; padding: 0;
    }
    .slide-indicator:hover { background: var(--text-muted); transform: scale(1.2); }
    .slide-indicator.active {
      background: var(--orange); border-color: var(--orange);
      width: 22px; border-radius: 4px;
    }

    .laser-pointer {
      position: fixed; width: 12px; height: 12px;
      background: #ff0000; border-radius: 50%;
      pointer-events: none; z-index: 10000;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000, 0 0 30px #ff0000;
    }
    .laser-pointer.hidden { display: none; }

    /* ════════════════════════════════════════════════
       Analytics Dashboard
    ════════════════════════════════════════════════ */
    .analytics-modal {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.75);
      z-index: 5000;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
      animation: an-fade-in .2s ease;
    }
    @keyframes an-fade-in { from { opacity: 0; } to { opacity: 1; } }

    .analytics-container {
      background: var(--bg-card);
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
      max-width: 1400px; width: 100%;
      max-height: 90vh;
      display: flex; flex-direction: column;
      animation: an-slide-up .25s ease;
    }
    @keyframes an-slide-up { from { transform: translateY(20px); opacity: 0; } to { transform: none; opacity: 1; } }

    .analytics-header {
      padding: 18px 22px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: flex-start; justify-content: space-between;
      background: var(--bg); flex-shrink: 0;
      border-radius: 12px 12px 0 0;
    }
    .analytics-header h2 {
      font-family: var(--font); font-size: 13px; font-weight: 800;
      color: var(--text); margin: 0 0 3px 0;
      text-transform: uppercase; letter-spacing: .04em;
    }
    .analytics-subtitle { font-family: var(--font); font-size: 10px; color: var(--text-muted); margin: 0; }

    .analytics-close {
      width: 30px; height: 30px;
      display: flex; align-items: center; justify-content: center;
      background: transparent; border: 1px solid var(--border);
      border-radius: 6px; font-size: 16px; color: var(--text-muted);
      cursor: pointer; transition: all .15s;
    }
    .analytics-close:hover { background: var(--orange-dim); color: var(--orange); border-color: var(--orange); }

    .analytics-filters {
      padding: 12px 22px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px;
      flex-wrap: wrap; flex-shrink: 0;
    }
    .filter-group { display: flex; align-items: center; gap: 7px; }
    .filter-group label {
      font-family: var(--font); font-size: 10px; font-weight: 700;
      color: var(--text); text-transform: uppercase; letter-spacing: .04em;
    }
    .filter-group select {
      padding: 5px 10px;
      border: 1px solid var(--border); border-radius: 6px;
      background: var(--bg);
      font-family: var(--font); font-size: 10px; color: var(--text);
      cursor: pointer; transition: all .15s;
    }
    .filter-group select:hover { border-color: var(--orange); }
    .filter-group select:focus { outline: none; border-color: var(--orange); box-shadow: 0 0 0 3px var(--orange-dim); }
    .an-hidden { display: none !important; }

    .analytics-body {
      flex: 1; overflow-y: auto; padding: 20px;
      background: var(--bg);
    }

    .an-section-title {
      font-family: var(--font); font-size: 10px; font-weight: 800;
      color: var(--text); margin: 0 0 14px 0;
      text-transform: uppercase; letter-spacing: .04em;
      padding-bottom: 7px;
      border-bottom: 1px solid var(--border);
    }

    .metrics-overview { margin-bottom: 24px; }

    .key-metrics-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .metric-card-large {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-top: 3px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px 10px;
      transition: border-color .15s, box-shadow .15s;
      position: relative;
    }
    .metric-card-large:hover {
      border-color: var(--orange);
      border-top-color: var(--orange);
      box-shadow: 0 2px 8px rgba(242,100,25,.1);
    }
    .metric-card-large.metric-success { border-top-color: var(--success); }
    .metric-card-large.metric-warning { border-top-color: var(--warning); }
    .metric-card-large.metric-danger  { border-top-color: var(--danger);  }

    /* hide the big emoji — not needed in minimal layout */
    .metric-icon { display: none; }

    .metric-content { display: flex; flex-direction: column; gap: 4px; }
    .metric-label {
      font-family: var(--font); font-size: 9px; font-weight: 700;
      color: var(--text-muted); margin: 0;
      text-transform: uppercase; letter-spacing: .06em;
    }
    .metric-value {
      font-family: var(--font); font-size: 24px; font-weight: 800;
      color: var(--text); line-height: 1; margin: 0;
    }
    .metric-detail {
      font-family: var(--font); font-size: 9px; color: var(--text-muted);
      margin: 0; opacity: .8;
    }

    .analytics-grid {
      display: grid; grid-template-columns: repeat(2, 1fr);
      gap: 16px; margin-bottom: 28px;
    }
    .analytics-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 10px; padding: 16px;
      box-shadow: var(--shadow-sm); transition: all .15s;
    }
    .analytics-card:hover { box-shadow: var(--shadow); }
    .analytics-card-wide { grid-column: 1 / -1; }
    .analytics-card canvas { max-height: 280px; }

    .card-header-analytics {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 14px; padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .card-header-analytics h3 {
      font-family: var(--font); font-size: 10px; font-weight: 700;
      color: var(--text); margin: 0;
      text-transform: uppercase; letter-spacing: .04em;
    }
    .card-info { font-family: var(--font); font-size: 9px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .03em; }

    .chart-legend { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; }
    .legend-item { display: flex; align-items: center; gap: 7px; font-family: var(--font); font-size: 10px; color: var(--text); }
    .legend-color { width: 11px; height: 11px; border-radius: 2px; flex-shrink: 0; }

    .detailed-stats { margin-top: 28px; }

    .detailed-table {
      width: 100%; background: var(--bg-card);
      border: 1px solid var(--border); border-radius: 10px;
      overflow: hidden; font-family: var(--font); font-size: 10px;
    }
    .detailed-table thead { background: var(--bg); }
    .detailed-table th {
      padding: 10px 14px; text-align: left; font-weight: 700;
      color: var(--text); text-transform: uppercase; letter-spacing: .04em;
      border-bottom: 1px solid var(--border);
    }
    .detailed-table td { padding: 10px 14px; border-bottom: 1px solid var(--border); color: var(--text); }
    .detailed-table tbody tr:last-child td { border-bottom: none; }
    .detailed-table tbody tr:hover { background: var(--bg); }
    .category-cell { font-weight: 700; background: var(--bg); vertical-align: middle; }

    .an-loading {
      text-align: center; padding: 36px;
      font-family: var(--font); font-size: 11px; color: var(--text-muted);
    }

    /* Topbar action buttons */
    .nav-btn {
      display: flex; align-items: center; gap: 5px;
      padding: 6px 12px;
      background: var(--bg); color: var(--text);
      border: 1px solid var(--border); border-radius: 8px;
      font-family: var(--font); font-size: 11px; font-weight: 600;
      cursor: pointer; transition: all .15s;
    }
    .nav-btn:hover {
      background: var(--orange-dim); border-color: var(--orange); color: var(--orange);
    }
  </style>
</head>
<body>

<div class="app-shell">
  <aside id="sidebar-mount"></aside>

  <div class="main-content">
    <header class="topbar">
      <div class="topbar-title">
        <div class="page-title"><i data-icon="bar-chart"></i> Weekly Report</div>
        <div class="page-sub">SM Team Operations Summary</div>
      </div>
      <div class="topbar-actions">
        <div class="week-switcher">
          <button class="week-arrow" id="prevWeek" title="Previous Week"><i data-icon="chevron-left"></i></button>
          <select class="week-select" id="weekSelect">
            <option value="">Loading weeks...</option>
          </select>
          <button class="week-arrow" id="nextWeek" title="Next Week"><i data-icon="play"></i></button>
        </div>
        <button class="nav-btn" id="analyticsBtn" title="Analytics Dashboard">
          <span><i data-icon="bar-chart"></i></span>
          <span>Analytics</span>
        </button>
        <button class="nav-btn" id="presentBtn" title="Presentation Mode">
          <span>🎥</span>
          <span>Present</span>
        </button>
        <a href="./weekly-report-form.html" class="btn btn-primary btn-sm" data-action="add">
          <span><i data-icon="plus"></i></span>
          <span>Add/Edit Data</span>
        </a>
      </div>
    </header>

    <main class="page-content">
      <!-- Stats Bar -->
      <div class="stats-bar">
        <div class="stat-card">
          <div class="stat-header">
            <div class="stat-icon"><i data-icon="alert-triangle"></i></div>
          </div>
          <div class="stat-value" id="statIncidents">0</div>
          <div class="stat-label">Total Incidents</div>
        </div>
        
        <div class="stat-card">
          <div class="stat-header">
            <div class="stat-icon"><i data-icon="package"></i></div>
          </div>
          <div class="stat-value" id="statBatch">0</div>
          <div class="stat-label">Batch Issues</div>
        </div>
        
        <div class="stat-card">
          <div class="stat-header">
            <div class="stat-icon"><i data-icon="users"></i></div>
          </div>
          <div class="stat-value" id="statSupport">0</div>
          <div class="stat-label">Support Tasks</div>
        </div>
        
        <div class="stat-card">
          <div class="stat-header">
            <div class="stat-icon"><i data-icon="bell"></i></div>
          </div>
          <div class="stat-value" id="statUpdates">0</div>
          <div class="stat-label">Updates & Alerts</div>
        </div>
      </div>

      <!-- Dashboard Grid -->
      <div class="dashboard-grid">
        <!-- Card 1: Incidents -->
        <div class="card">
          <div class="card-header">
            <div class="card-title">
              <span class="card-icon"><i data-icon="alert-triangle"></i></span>
              <span>Incidents Detected by SM</span>
            </div>
            <span class="card-badge" id="incidentsBadge">0</span>
          </div>
          <div class="card-body" id="incidentsBody">
            <div class="loading-overlay">
              <div class="spinner"></div>
            </div>
          </div>
        </div>

        <!-- Card 2: Updates (Tall) -->
        <div class="card">
          <div class="card-header">
            <div class="card-title">
              <span class="card-icon"><i data-icon="bell"></i></span>
              <span>Updates & Alerts</span>
            </div>
            <span class="card-badge" id="updatesBadge">0</span>
          </div>
          <div class="card-body" id="updatesBody">
            <div class="loading-overlay">
              <div class="spinner"></div>
            </div>
          </div>
        </div>

        <!-- Card 3: Support -->
        <div class="card">
          <div class="card-header">
            <div class="card-title">
              <span class="card-icon"><i data-icon="users"></i></span>
              <span>Part SM Support</span>
            </div>
            <span class="card-badge" id="supportBadge">0</span>
          </div>
          <div class="card-body" id="supportBody">
            <div class="loading-overlay">
              <div class="spinner"></div>
            </div>
          </div>
        </div>

        <!-- Card 4: Batch -->
        <div class="card">
          <div class="card-header">
            <div class="card-title">
              <span class="card-icon"><i data-icon="package"></i></span>
              <span>Batch - Issue</span>
            </div>
            <span class="card-badge" id="batchBadge">0</span>
          </div>
          <div class="card-body" id="batchBody">
            <div class="loading-overlay">
              <div class="spinner"></div>
            </div>
          </div>
        </div>

        <!-- Card 5: Improvements -->
        <div class="card">
          <div class="card-header">
            <div class="card-title">
              <span class="card-icon"><i data-icon="rocket"></i></span>
              <span>Improvement / Project</span>
            </div>
            <span class="card-badge" id="improvementsBadge">0</span>
          </div>
          <div class="card-body" id="improvementsBody">
            <div class="loading-overlay">
              <div class="spinner"></div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="./assets/js/utils.js"></script>

<script src="./assets/js/api.js"></script>
<script src="./assets/js/layout.js"></script>
<script src="./assets/js/maintenance.js"></script>
<script src="./assets/js/analytics.js"></script>
<script src="./assets/js/analytics-features.js"></script>
<script src="./assets/js/weekly-report/date-utils.js"></script>
<script src="./assets/js/weekly-report/api.js"></script>
<script src="./assets/js/weekly-report/analytics.js"></script>
<script src="./assets/js/weekly-report/presentation.js"></script>
<script src="./assets/js/weekly-report/dashboard.js"></script>

  if (!Auth.requireAuth()) {}
  Layout.render('weekly-report');
  trackReportView('weekly_report');
</script>

</body>
</html>
