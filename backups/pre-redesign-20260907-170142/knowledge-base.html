<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knowledge Base — SOM-Portal</title>
  <link rel="icon" href="./favicon.ico" type="image/x-icon">
  <script src="./assets/js/theme.js"></script>
  <link rel="stylesheet" href="./assets/css/dark.css">
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="stylesheet" href="./assets/css/ui-themes.css">
  <style>
    /* ═══════════════════════════════════════════════════
       KNOWLEDGE BASE — MINIMAL STYLE
    ═══════════════════════════════════════════════════ */
    .kb-container {
      display: flex; flex-direction: column; gap: 16px; flex: 1;
    }

    /* Category tabs */
    .kb-tabs {
      display: flex; gap: 6px; flex-wrap: wrap;
      padding: 8px 0; border-bottom: 1.5px solid var(--border);
    }
    .kb-tab {
      padding: 8px 18px; font-size: 11.5px; font-weight: 700;
      border-radius: 8px 8px 0 0; cursor: pointer;
      background: transparent; color: var(--text-muted);
      border: 1.5px solid transparent; border-bottom: none;
      transition: all .15s; position: relative; bottom: -1.5px;
    }
    .kb-tab:hover { color: var(--text); background: var(--bg); }
    .kb-tab.active {
      color: var(--orange); background: var(--bg-card);
      border-color: var(--border); border-bottom-color: var(--bg-card);
    }

    /* Add category button */
    .kb-add-cat {
      padding: 8px 14px; font-size: 11.5px; font-weight: 700;
      border-radius: 8px; cursor: pointer; margin-left: auto;
      background: var(--orange-bg); color: var(--orange);
      border: 1.5px solid var(--orange); transition: all .15s;
    }
    .kb-add-cat:hover { background: var(--orange); color: #fff; }

    /* Category content */
    .kb-category { display: none; }
    .kb-category.active { display: block; }

    /* Toolbar */
    .kb-toolbar {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: 12px 16px; background: var(--bg-card);
      border: 1.5px solid var(--border); border-radius: 10px;
    }
    .kb-search {
      flex: 1; min-width: 200px; position: relative;
    }
    .kb-search input {
      width: 100%; padding: 7px 12px 7px 32px;
      font-size: 11.5px; border: 1.5px solid var(--border);
      border-radius: 7px; background: var(--bg-input);
    }
    .kb-search i {
      position: absolute; left: 10px; top: 50%;
      transform: translateY(-50%); color: var(--text-muted);
      font-size: 13px; pointer-events: none;
    }

    /* Table */
    .kb-table-wrap {
      background: var(--bg-card); border: 1.5px solid var(--border);
      border-radius: 10px; overflow-x: auto;
    }
    .kb-table {
      width: 100%; min-width: max-content; border-collapse: collapse;
    }
    .kb-table thead th {
      background: var(--bg); padding: 10px 12px;
      text-align: left; font-size: 10px; font-weight: 800;
      color: var(--text-muted); text-transform: uppercase;
      letter-spacing: .06em; border-bottom: 1.5px solid var(--border);
      white-space: nowrap; position: relative;
    }
    .kb-table thead th.sortable {
      cursor: pointer; user-select: none;
    }
    .kb-table thead th.sortable:hover { color: var(--orange); }
    .kb-table tbody td {
      padding: 11px 12px; border-bottom: 1px solid #f0f0f0;
      font-size: 11.5px; color: var(--text); vertical-align: middle;
    }
    .kb-table tbody tr:last-child td { border-bottom: none; }
    .kb-table tbody tr:hover { background: var(--bg); }

    /* Link cells */
    .kb-link {
      color: var(--orange); text-decoration: none;
      font-weight: 600; transition: color .1s;
    }
    .kb-link:hover { color: var(--orange-hover); text-decoration: underline; }
    .kb-link-empty { color: var(--text-muted); font-style: italic; }

    /* Dropdown badge */
    .kb-dropdown-badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 8px; border-radius: 5px; font-size: 10px;
      font-weight: 700; border: 1px solid;
    }
    .kb-dropdown-badge.jenkins { background: #fef3c7; color: #92400e; border-color: #fde68a; }
    .kb-dropdown-badge.admin-portal { background: #dbeafe; color: #1e40af; border-color: #bfdbfe; }
    .kb-dropdown-badge.rundeck { background: #dcfce7; color: #166534; border-color: #bbf7d0; }
    .kb-dropdown-badge.kims-portal { background: #f3e8ff; color: #6b21a8; border-color: #e9d5ff; }
    .kb-dropdown-badge.third-party { background: #fee2e2; color: #991b1b; border-color: #fecaca; }

    /* Service badge */
    .kb-service-badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 8px; border-radius: 5px; font-size: 10px;
      font-weight: 700; border: 1px solid;
    }
    .kb-service-badge.tmn { background: #fef3c7; color: #92400e; border-color: #fde68a; }
    .kb-service-badge.nano { background: #dbeafe; color: #1e40af; border-color: #bfdbfe; }
    .kb-service-badge.wealth { background: #dcfce7; color: #166534; border-color: #bbf7d0; }
    .kb-service-badge.vb { background: #f3e8ff; color: #6b21a8; border-color: #e9d5ff; }

    /* Actions */
    .kb-actions {
      display: flex; gap: 6px; align-items: center;
    }
    .kb-action-btn {
      padding: 4px 8px; font-size: 11px; border-radius: 5px;
      border: 1px solid var(--border); background: transparent;
      cursor: pointer; transition: all .12s; color: var(--text-muted);
    }
    .kb-action-btn:hover { background: var(--bg); color: var(--text); }
    .kb-action-btn.edit:hover { color: var(--orange); border-color: var(--orange); }
    .kb-action-btn.delete:hover { color: var(--danger); border-color: var(--danger); }

    /* Empty state */
    .kb-empty {
      padding: 60px 20px; text-align: center;
      color: var(--text-muted); font-size: 12px;
    }
    .kb-empty i { font-size: 32px; opacity: .3; margin-bottom: 12px; font-style: normal; }

    /* Modal adjustments */
    .modal-lg { max-width: 720px; }
    .form-row {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    }
    .form-row-full { grid-column: 1 / -1; }

    /* Field manager */
    .field-manager {
      padding: 14px; background: var(--bg); border-radius: 8px;
      border: 1.5px solid var(--border); margin-top: 8px;
    }
    .field-list {
      display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px;
    }
    .field-item {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px; background: var(--bg-card);
      border: 1px solid var(--border); border-radius: 6px;
    }
    .field-item-name { flex: 1; font-size: 11px; font-weight: 600; }
    .field-item-type {
      font-size: 9px; padding: 2px 6px; border-radius: 4px;
      background: var(--orange-bg); color: var(--orange);
    }

    /* ── View toggle ── */
    .kb-view-toggle {
      display: flex; gap: 2px; background: var(--bg);
      border: 1.5px solid var(--border); border-radius: 7px; padding: 2px;
    }
    .kb-view-btn {
      padding: 5px 10px; border-radius: 5px; border: none;
      cursor: pointer; font-size: 13px; background: transparent;
      color: var(--text-muted); transition: all .12s; line-height: 1;
    }
    .kb-view-btn.active { background: var(--orange); color: #fff; }
    .kb-view-btn:not(.active):hover { background: var(--bg-card); color: var(--text); }

    /* ── Cards view ── */
    .kb-cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }
    .kb-card {
      background: var(--bg-card); border: 1.5px solid var(--border);
      border-radius: 10px; overflow: hidden;
      transition: box-shadow .15s, border-color .15s;
    }
    .kb-card:hover { border-color: var(--orange); box-shadow: 0 2px 12px rgba(0,0,0,.08); }
    .kb-card-head {
      padding: 12px 14px 10px; border-bottom: 1px solid var(--border);
      font-size: 12px; font-weight: 700; color: var(--text);
    }
    .kb-card-body { padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; }
    .kb-card-row {
      display: flex; align-items: baseline; gap: 8px;
      font-size: 11px;
    }
    .kb-card-label {
      font-size: 9.5px; font-weight: 700; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: .05em;
      min-width: 72px; flex-shrink: 0;
    }
    .kb-card-val { color: var(--text); flex: 1; word-break: break-word; }
    .kb-card-foot {
      padding: 8px 14px; border-top: 1px solid var(--border);
      display: flex; gap: 6px; justify-content: flex-end;
    }

    /* ── Compact view ── */
    .kb-table.compact thead th { padding: 7px 10px; font-size: 9.5px; }
    .kb-table.compact tbody td { padding: 6px 10px; font-size: 11px; }

    /* ── Severity badge ── */
    .kb-sev {
      display: inline-flex; align-items: center;
      padding: 2px 7px; border-radius: 4px;
      font-size: 9.5px; font-weight: 800; border: 1px solid;
    }
    .kb-sev.s1 { background: #fee2e2; color: #991b1b; border-color: #fca5a5; }
    .kb-sev.s2 { background: #fef3c7; color: #92400e; border-color: #fde68a; }
    .kb-sev.s3 { background: #dbeafe; color: #1e40af; border-color: #bfdbfe; }

    /* ── Case CM card ── */
    .cm-card {
      background: var(--bg-card); border: 1.5px solid var(--border);
      border-radius: 10px; overflow: hidden;
      transition: box-shadow .15s, border-color .15s;
    }
    .cm-card:hover { border-color: var(--orange); box-shadow: 0 2px 16px rgba(0,0,0,.09); }
    .cm-card-head {
      padding: 12px 14px 10px; border-bottom: 1px solid var(--border);
      display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
    }
    .cm-card-title { font-size: 12px; font-weight: 700; color: var(--text); flex: 1; }
    .cm-section-label {
      font-size: 9.5px; font-weight: 800; text-transform: uppercase;
      letter-spacing: .07em; color: var(--text-muted);
      padding: 8px 14px 4px; border-top: 1px solid var(--border);
    }
    .cm-split {
      display: grid; grid-template-columns: 1fr 1fr;
    }
    .cm-split-col {
      padding: 8px 14px; font-size: 11px;
    }
    .cm-split-col:first-child { border-right: 1px solid var(--border); }
    .cm-split-col-head {
      font-size: 9px; font-weight: 800; text-transform: uppercase;
      letter-spacing: .06em; margin-bottom: 5px;
    }
    .cm-split-col-head.in-h { color: #2563eb; }
    .cm-split-col-head.out-h { color: #7c3aed; }
    .cm-cond { color: var(--text); line-height: 1.4; margin-bottom: 4px; }
    .cm-time {
      display: inline-flex; align-items: center; gap: 3px;
      font-size: 10px; font-weight: 700; color: var(--text-muted);
    }
    .cm-footer {
      padding: 9px 14px; border-top: 1px solid var(--border);
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    }
    .cm-meta {
      display: flex; align-items: center; gap: 4px;
      font-size: 10.5px; color: var(--text-muted);
    }
    .cm-meta strong { color: var(--text); }
    .cm-remark {
      padding: 6px 14px 10px; font-size: 10.5px;
      color: var(--text-muted); font-style: italic; border-top: 1px dashed var(--border);
      line-height: 1.5;
    }
    .cm-actions { margin-left: auto; display: flex; gap: 6px; }

    /* ── Matrix view ── */
    .kb-matrix-wrap {
      overflow-x: auto; border-radius: 10px;
      border: 1.5px solid var(--border);
    }
    .kb-matrix-table {
      border-collapse: collapse; white-space: nowrap;
      font-size: 11px; min-width: 100%;
    }
    .kb-matrix-table th,
    .kb-matrix-table td {
      border: 1px solid var(--border);
      padding: 10px 13px; vertical-align: top;
      line-height: 1.55; white-space: normal;
    }

    /* Sticky left 2 columns */
    .mat-sticky-1 {
      position: sticky; left: 0; z-index: 2;
      background: var(--bg-card); width: 62px; min-width: 62px; max-width: 62px;
    }
    .mat-sticky-2 {
      position: sticky; left: 62px; z-index: 2;
      background: var(--bg-card); width: 130px; min-width: 130px; max-width: 130px;
    }
    /* Header sticky corners */
    thead .mat-sticky-1,
    thead .mat-sticky-2 { z-index: 3; background: var(--bg); }

    /* Case header */
    .mat-case-head {
      background: var(--bg); text-align: center;
      font-weight: 700; font-size: 11px; min-width: 640px;
      white-space: normal;
    }
    .mat-sub-head {
      text-align: center; font-size: 9.5px; font-weight: 700;
      padding: 6px 10px; min-width: 320px;
    }
    .mat-sub-head.in-h  { background: #eff6ff; color: #1d4ed8; }
    .mat-sub-head.out-h { background: #f5f3ff; color: #6d28d9; }

    /* Section label (nsf col) */
    .mat-sec {
      font-size: 10px; font-weight: 800; text-align: center;
      text-transform: uppercase; letter-spacing: .04em;
    }
    .mat-sec.cm { background: #fef3c7; color: #92400e; }
    .mat-sec.ci { background: #fee2e2; color: #991b1b; }
    .mat-sec.other { background: var(--bg); color: var(--text-muted); }

    /* Row label (detail col) */
    .mat-label {
      font-size: 10.5px; font-weight: 700; color: var(--text);
      min-width: 110px;
    }
    .mat-label.cm { background: #fffbeb; }
    .mat-label.ci { background: #fff5f5; }

    /* Data cells */
    .mat-cell {
      font-size: 11px; color: var(--text); min-width: 320px;
    }
    .mat-cell.cm { background: #fffbeb; }
    .mat-cell.ci { background: #fff5f5; }
    .mat-cell.yn-yes { background: #fee2e2 !important; color: #b91c1c; font-weight: 700; text-align: center; }
    .mat-cell.yn-no  { background: #dcfce7 !important; color: #15803d; font-weight: 700; text-align: center; }

    /* Single-value rows (send mail, oncall etc) */
    .mat-single { min-width: 640px; }
    .mat-remark { min-width: 640px; font-style: italic; color: var(--text-muted); }

    /* dark mode overrides */
    [data-theme="dark"] .mat-sub-head.in-h  { background: #1e3a5f; color: #93c5fd; }
    [data-theme="dark"] .mat-sub-head.out-h { background: #2e1a5f; color: #c4b5fd; }
    [data-theme="dark"] .mat-sec.cm  { background: #451a03; color: #fbbf24; }
    [data-theme="dark"] .mat-sec.ci  { background: #450a0a; color: #fca5a5; }
    [data-theme="dark"] .mat-label.cm { background: #1c1107; }
    [data-theme="dark"] .mat-label.ci { background: #1c0707; }
    [data-theme="dark"] .mat-cell.cm  { background: #1c1107; }
    [data-theme="dark"] .mat-cell.ci  { background: #1c0707; }
    [data-theme="dark"] .mat-cell.yn-yes { background: #450a0a !important; color: #fca5a5; }
    [data-theme="dark"] .mat-cell.yn-no  { background: #14532d !important; color: #86efac; }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- Sidebar (rendered by layout.js) -->
    <aside id="sidebar-mount"></aside>

    <!-- Main -->
    <main class="main-content">
      <div class="topbar">
        <div class="tb-prompt">
          <span class="tb-path">~/sm</span>
          <span class="tb-arrow"><i data-icon="play"></i></span>
        </div>
        <div class="topbar-title">
          <span class="page-title">Knowledge Base</span>
          <span class="page-sub">จัดการข้อมูล Tools & Services</span>
        </div>
      </div>

      <div class="page-content">
        <div class="kb-container">
          <!-- Tabs -->
          <div class="kb-tabs" id="kb-tabs">
            <!-- Dynamic tabs -->
          </div>

          <!-- Categories -->
          <div id="kb-categories">
            <!-- Dynamic category content -->
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Modals -->
  <div class="modal-overlay" id="modal-add-entry">
    <div class="modal modal-lg">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-entry-title">Add Entry</h3>
        <button class="btn-close" onclick="closeModal('modal-add-entry')">×</button>
      </div>
      <div class="modal-body">
        <form id="form-entry">
          <div id="entry-fields"></div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeModal('modal-add-entry')">Cancel</button>
        <button class="btn btn-primary" onclick="saveEntry()">Save</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modal-add-category">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">Add Category</h3>
        <button class="btn-close" onclick="closeModal('modal-add-category')">×</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">Category Name</label>
          <input type="text" class="form-control" id="new-category-name" placeholder="e.g., Database Management">
        </div>
        <div class="field-manager">
          <label class="form-label">Fields</label>
          <div class="field-list" id="category-fields"></div>
          <button type="button" class="btn btn-sm btn-outline" onclick="addCategoryField()">
            <i>+</i> Add Field
          </button>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeModal('modal-add-category')">Cancel</button>
        <button class="btn btn-primary" onclick="saveCategory()">Save Category</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modal-manage-fields">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">Manage Fields</h3>
        <button class="btn-close" onclick="closeModal('modal-manage-fields')">×</button>
      </div>
      <div class="modal-body">
        <div class="field-manager">
          <div class="field-list" id="manage-fields-list"></div>
          <button type="button" class="btn btn-sm btn-outline" onclick="addFieldToCategory()">
            <i>+</i> Add Field
          </button>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeModal('modal-manage-fields')">Cancel</button>
        <button class="btn btn-primary" onclick="saveFieldChanges()">Save Changes</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modal-add-field">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">Add Field</h3>
        <button class="btn-close" onclick="closeModal('modal-add-field')">×</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">Field Name</label>
          <input type="text" class="form-control" id="field-name" placeholder="e.g., Priority">
        </div>
        <div class="form-group">
          <label class="form-label">Field Type</label>
          <select class="form-control" id="field-type" onchange="toggleFieldOptions()">
            <option value="text">Text</option>
            <option value="url">URL</option>
            <option value="dropdown">Dropdown</option>
          </select>
        </div>
        <div class="form-group" id="field-options-group" style="display:none">
          <label class="form-label">Dropdown Options (comma-separated)</label>
          <input type="text" class="form-control" id="field-options" placeholder="Option 1, Option 2, Option 3">
        </div>
        <div class="form-group">
          <label class="form-label">
            <input type="checkbox" id="field-required"> Required field
          </label>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeModal('modal-add-field')">Cancel</button>
        <button class="btn btn-primary" onclick="saveField()">Add Field</button>
      </div>
    </div>
  </div>

  <script src="./assets/js/auth.js"></script>
  <script src="./assets/js/api.js"></script>
  <script src="./assets/js/utils.js"></script>
  <script src="./assets/js/csrf.js"></script>
  <script src="./assets/js/analytics.js"></script>
  <script src="./assets/js/analytics-features.js"></script>
  <script src="./assets/js/layout.js"></script>
  <script src="./assets/js/maintenance.js"></script>
  <script src="./assets/js/knowledge-base.js"></script>
</body>
</html>
