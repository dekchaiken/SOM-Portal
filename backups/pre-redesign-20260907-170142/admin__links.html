<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Links Management — SOM-Portal</title>
  <link rel="icon" href="../favicon.ico" type="image/x-icon">
  <script src="../assets/js/theme.js"></script>
  <link rel="stylesheet" href="../assets/css/dark.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/ui-themes.css">
  <style>
    .section-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .section-tab {
      padding: 7px 18px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--bg);
      font-size: 12px;
      font-family: var(--font);
      color: var(--text-muted);
      cursor: pointer;
      transition: all .15s;
      font-weight: 500;
    }
    .section-tab:hover { border-color: var(--orange); color: var(--orange); }
    .section-tab.active { background: var(--orange); color: #fff; border-color: var(--orange); }

    .links-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .links-table th {
      text-align: left; padding: 10px 12px;
      background: var(--sidebar-bg); color: var(--text-muted);
      font-weight: 600; border-bottom: 1px solid var(--border);
    }
    .links-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .links-table tr:last-child td { border-bottom: none; }
    .links-table tr:hover td { background: var(--bg); }

    .link-icon-preview {
      font-size: 20px; width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
    }
    .url-cell { max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-muted); }
    .order-cell { color: var(--text-muted); font-weight: 600; }
    .action-btn-group { display: flex; gap: 6px; }

    /* Modal */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.45); z-index: 1100;
      align-items: center; justify-content: center;
    }
    .modal-overlay.open {
      display: flex;
      opacity: 1 !important;
      visibility: visible !important;
    }
    .modal-box {
      background: #fff; border-radius: var(--radius-lg);
      width: 480px; max-width: 95vw; max-height: 90vh;
      display: flex; flex-direction: column;
      box-shadow: 0 20px 60px rgba(0,0,0,.18);
    }
    .modal-header {
      padding: 18px 20px 16px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .modal-title { font-size: 14px; font-weight: 700; }
    .modal-close { background: none; border: none; font-size: 18px; cursor: pointer; color: var(--text-muted); line-height: 1; }
    .modal-body { padding: 20px; overflow-y: auto; flex: 1; }
    .modal-footer { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; }

    .form-row { margin-bottom: 14px; }
    .form-label { display: block; font-size: 11px; font-weight: 600; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: .5px; }
    .form-input, .form-select {
      width: 100%; padding: 8px 10px; border: 1px solid var(--border);
      border-radius: var(--radius); font-family: var(--font); font-size: 12px;
      background: var(--bg); color: var(--text); box-sizing: border-box;
      transition: border-color .15s;
    }
    .form-input:focus, .form-select:focus { outline: none; border-color: var(--orange); }
    .form-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }

    .icon-preview-row { display: flex; align-items: center; gap: 10px; }
    .icon-preview-box {
      width: 40px; height: 40px; border: 1px solid var(--border);
      border-radius: var(--radius); display: flex; align-items: center;
      justify-content: center; font-size: 22px; background: var(--bg);
    }

    .empty-table { text-align: center; padding: 40px; color: var(--text-muted); font-size: 12px; }
  </style>
</head>
<body>

<div class="app-shell">
  <aside id="sidebar-mount"></aside>

  <div class="main-content">
    <header class="topbar">
      <div class="topbar-title">
        <div class="page-title"><i data-icon="link"></i> Links Management</div>
        <div class="page-sub">จัดการลิงก์ทุก section — Monitoring / Test / Batch / Report</div>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-primary" onclick="openCreateModal()">+ Add Link</button>
      </div>
    </header>

    <main class="page-content">

      <section class="page-hero">
        <div class="page-hero-mark"><i data-icon="link"></i></div>
        <div class="page-hero-body">
          <div class="page-hero-eyebrow">Admin</div>
          <h1>Links Management</h1>
          <p>จัดการลิงก์ทุก section — Monitoring · Test Service · Batch Monitor · Report Weekly</p>
        </div>
      </section>

      <!-- Section Tabs -->
      <div class="section-tabs" id="section-tabs">
        <button class="section-tab active" data-section="monitoring" onclick="switchSection('monitoring', this)"><i data-icon="circle"></i> Monitoring</button>
        <button class="section-tab" data-section="test-service" onclick="switchSection('test-service', this)">⊡ Test Service</button>
        <button class="section-tab" data-section="batch-monitor" onclick="switchSection('batch-monitor', this)">⊞ Batch Monitor</button>
        <button class="section-tab" data-section="report" onclick="switchSection('report', this)">≡ Report Weekly</button>
      </div>

      <div class="card">
        <div class="card-header">
          <span class="card-title" id="section-title">Monitoring Links</span>
          <span class="badge badge-gray" id="link-count">—</span>
        </div>
        <div class="card-body" style="padding:0" id="table-container">
          <div data-skel="table" data-rows="5"></div>
        </div>
      </div>

    </main>
  </div>
</div>

<!-- ═══ Create / Edit Modal ═══ -->
<div class="modal-overlay" id="modal-link">
  <div class="modal-box">
    <div class="modal-header">
      <span class="modal-title" id="modal-title">Add Link</span>
      <button class="modal-close" onclick="closeModal('modal-link')"><i data-icon="x"></i></button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <label class="form-label">Section *</label>
        <select class="form-select" id="f-section" onchange="onSectionChange(this.value)">
          <option value="monitoring">Monitoring</option>
          <option value="test-service">⊡ Test Service</option>
          <option value="batch-monitor">⊞ Batch Monitor</option>
          <option value="report">≡ Report Weekly</option>
        </select>
      </div>
      <div class="form-row" id="f-subsection-row" style="display:none">
        <label class="form-label">Sub-group <span style="font-weight:400;color:var(--text-muted)">(สำหรับ Monitoring)</span></label>
        <select class="form-select" id="f-subsection">
          <option value="">— ไม่ระบุ</option>
          <option value="overview">Service Overview</option>
          <option value="monitor">Monitor Dashboard</option>
          <option value="polywall">Polywall</option>
        </select>
      </div>
      <div class="form-row">
        <label class="form-label">ชื่อ Link *</label>
        <input class="form-input" id="f-name" type="text" placeholder="เช่น Grafana — Payment">
      </div>
      <div class="form-row">
        <label class="form-label">URL *</label>
        <input class="form-input" id="f-url" type="url" placeholder="https://...">
      </div>
      <div class="form-row">
        <label class="form-label">คำอธิบาย</label>
        <input class="form-input" id="f-desc" type="text" placeholder="คำอธิบายสั้นๆ หรือ sub-URL">
      </div>
      <div class="form-row">
        <label class="form-label">Icon (Emoji)</label>
        <div class="icon-preview-row">
          <div class="icon-preview-box" id="icon-preview"><i data-icon="link"></i></div>
          <input class="form-input" id="f-icon" type="text" placeholder="🔗" maxlength="4"
            oninput="document.getElementById('icon-preview').textContent = this.value || '🔗'"
            style="flex:1">
        </div>
      </div>
      <div class="form-row-2">
        <div>
          <label class="form-label">Badge Text</label>
          <input class="form-input" id="f-badge-text" type="text" placeholder="เช่น Live, Prod">
        </div>
        <div>
          <label class="form-label">Badge Color</label>
          <select class="form-select" id="f-badge-type">
            <option value="gray">Gray</option>
            <option value="orange">Orange</option>
            <option value="green">Green</option>
            <option value="blue">Blue</option>
            <option value="red">Red</option>
            <option value="yellow">Yellow</option>
          </select>
        </div>
      </div>
      <div class="form-row" id="f-open-mode-row">
        <label class="form-label">วิธีเปิด Link</label>
        <select class="form-select" id="f-open-mode">
          <option value="newtab">↗ New Tab (เปิดหน้าต่างใหม่)</option>
          <option value="iframe">⧉ Iframe (แสดงในหน้า Monitoring)</option>
        </select>
      </div>
      <div class="form-row">
        <label class="form-label">Order (ลำดับการแสดง)</label>
        <input class="form-input" id="f-order" type="number" min="1" placeholder="ระบุลำดับ (ถ้าไม่ระบุใช้ auto)">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('modal-link')">Cancel</button>
      <button class="btn btn-primary" id="modal-save-btn" onclick="saveLink()">Save Link</button>
    </div>
  </div>
</div>

<!-- ═══ Delete Confirm Modal ═══ -->
<div class="modal-overlay" id="modal-delete">
  <div class="modal-box" style="width:360px">
    <div class="modal-header">
      <span class="modal-title" style="color:#dc2626">Delete Link</span>
      <button class="modal-close" onclick="closeModal('modal-delete')"><i data-icon="x"></i></button>
    </div>
    <div class="modal-body">
      <p style="font-size:13px;color:var(--text);margin:0">ต้องการลบลิงก์ <strong id="delete-link-name"></strong> ใช่ไหม?</p>
      <p style="font-size:12px;color:var(--text-muted);margin:8px 0 0">การกระทำนี้ไม่สามารถยกเลิกได้</p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('modal-delete')">Cancel</button>
      <button class="btn" style="background:#dc2626;color:#fff" onclick="confirmDelete()">Delete</button>
    </div>
  </div>
</div>

<script src="../assets/js/utils.js"></script>
<script src="../assets/js/skeletons.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/layout.js"></script>
<script src="../assets/js/admin-nav.js"></script>
<script>
  if (!Auth.requireAdmin()) {}
  Layout.render('admin');

  const SECTION_LABELS = {
    'monitoring':   '<i data-icon="circle"></i> Monitoring',
    'test-service': '⊡ Test Service',
    'batch-monitor':'⊞ Batch Monitor',
    'report':       '≡ Report Weekly'
  };

  let currentSection = 'monitoring';
  let currentLinks   = [];
  let editingId      = null;
  let deletingId     = null;

  // ─── Switch section tab ───────────────────────────────
  function switchSection(section, el) {
    currentSection = section;
    document.querySelectorAll('.section-tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('section-title').textContent = SECTION_LABELS[section] + ' Links';
    loadLinks();
  }

  // ─── Load links for current section ──────────────────
  async function loadLinks() {
    const container = document.getElementById('table-container');
    container.innerHTML = Skeleton.table(5);

    const res = await API.links.list(currentSection);

    if (!res?.ok) {
      container.innerHTML = '<div class="empty-table">โหลดข้อมูลไม่สำเร็จ</div>';
      document.getElementById('link-count').textContent = '—';
      return;
    }

    currentLinks = res.data.data || [];
    document.getElementById('link-count').textContent = `${currentLinks.length} links`;

    if (!currentLinks.length) {
      container.innerHTML = '<div class="empty-table">ยังไม่มีลิงก์ใน section นี้<br>กด "+ Add Link" เพื่อเพิ่ม</div>';
      return;
    }

    container.innerHTML = `
      <table class="links-table">
        <thead>
          <tr>
            <th style="width:48px">Icon</th>
            <th>ชื่อ</th>
            <th>URL / คำอธิบาย</th>
            <th style="width:90px">Sub-group</th>
            <th style="width:70px">เปิดแบบ</th>
            <th style="width:80px">Badge</th>
            <th style="width:60px">Order</th>
            <th style="width:100px">Actions</th>
          </tr>
        </thead>
        <tbody>
          ${currentLinks.map(l => `
            <tr>
              <td><div class="link-icon-preview">${renderIcon(l.icon, '<i data-icon="link"></i>')}</div></td>
              <td style="font-weight:600">${escHtml(l.name)}</td>
              <td>
                <div class="url-cell" title="${escHtml(l.url)}">${escHtml(l.url)}</div>
                ${l.description ? `<div style="font-size:11px;color:var(--text-muted);margin-top:2px">${escHtml(l.description)}</div>` : ''}
              </td>
              <td style="font-size:11px;color:var(--text-muted)">
                ${l.subsection
                  ? `<span class="badge badge-gray" style="font-size:10px">${escHtml(l.subsection)}</span>`
                  : '<span style="color:var(--border)">—</span>'}
              </td>
              <td style="font-size:11px">
                ${l.open_mode === 'iframe'
                  ? '<span class="badge badge-blue" style="font-size:10px">⧉ iframe</span>'
                  : '<span style="color:var(--text-muted)">↗ tab</span>'}
              </td>
              <td>
                ${l.badge_text
                  ? `<span class="badge badge-${escHtml(l.badge_type || 'gray')}">${escHtml(l.badge_text)}</span>`
                  : '<span style="color:var(--text-muted)">—</span>'}
              </td>
              <td class="order-cell">${l.order ?? '—'}</td>
              <td>
                <div class="action-btn-group">
                  <button class="btn btn-ghost" style="padding:5px 10px;font-size:11px"
                    data-action="edit" data-id="${escHtml(l.id)}">Edit</button>
                  <button class="btn" style="padding:5px 10px;font-size:11px;background:#fee2e2;color:#dc2626;border:none"
                    data-action="delete" data-id="${escHtml(l.id)}" data-name="${escHtml(l.name)}">Del</button>
                </div>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>`;

    // Event delegation — ไม่มี inline onclick เพื่อหลีกเลี่ยง escHtml ใน JS string
    container.addEventListener('click', e => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      if (btn.dataset.action === 'edit')   openEditModal(btn.dataset.id);
      if (btn.dataset.action === 'delete') openDeleteModal(btn.dataset.id, btn.dataset.name);
    });
  }

  // ─── Modal helpers ────────────────────────────────────
  function openModal(id) { document.getElementById(id).classList.add('open'); }
  function closeModal(id) { document.getElementById(id).classList.remove('open'); }

  function onSectionChange(val) {
    const row = document.getElementById('f-subsection-row');
    row.style.display = val === 'monitoring' ? '' : 'none';
    if (val !== 'monitoring') document.getElementById('f-subsection').value = '';
  }

  function resetForm() {
    ['f-name','f-url','f-desc','f-icon','f-badge-text','f-order'].forEach(id => {
      document.getElementById(id).value = '';
    });
    document.getElementById('f-badge-type').value  = 'gray';
    document.getElementById('f-open-mode').value   = 'newtab';
    document.getElementById('f-section').value      = currentSection;
    document.getElementById('f-subsection').value   = '';
    document.getElementById('icon-preview').innerHTML = '<i data-icon="link"></i>';
    onSectionChange(currentSection);
  }

  // ─── Create modal ─────────────────────────────────────
  function openCreateModal() {
    editingId = null;
    resetForm();
    document.getElementById('modal-title').textContent = 'Add Link';
    document.getElementById('modal-save-btn').textContent = 'Save Link';
    openModal('modal-link');
    setTimeout(() => document.getElementById('f-name').focus(), 100);
  }

  // ─── Edit modal ───────────────────────────────────────
  function openEditModal(id) {
    const link = currentLinks.find(l => l.id === id);
    if (!link) return;
    editingId = id;

    const sec = link.section || currentSection;
    document.getElementById('f-section').value    = sec;
    document.getElementById('f-subsection').value = link.subsection || '';
    document.getElementById('f-name').value       = link.name || '';
    document.getElementById('f-url').value        = link.url || '';
    document.getElementById('f-desc').value       = link.description || '';
    document.getElementById('f-icon').value       = link.icon || '';
    document.getElementById('f-badge-text').value  = link.badge_text || '';
    document.getElementById('f-badge-type').value  = link.badge_type || 'gray';
    document.getElementById('f-open-mode').value   = link.open_mode || 'newtab';
    document.getElementById('f-order').value       = link.order ?? '';
    document.getElementById('icon-preview').innerHTML = link.icon || '<i data-icon="link"></i>';
    onSectionChange(sec);

    document.getElementById('modal-title').textContent = 'Edit Link';
    document.getElementById('modal-save-btn').textContent = 'Save Changes';
    openModal('modal-link');
  }

  // ─── Save (create or update) ──────────────────────────
  async function saveLink() {
    const name       = document.getElementById('f-name').value.trim();
    const url        = document.getElementById('f-url').value.trim();
    const section    = document.getElementById('f-section').value;
    const subsection = document.getElementById('f-subsection').value;
    const icon       = document.getElementById('f-icon').value.trim() || '<i data-icon="link"></i>';
    const desc       = document.getElementById('f-desc').value.trim();
    const badgeTxt   = document.getElementById('f-badge-text').value.trim();
    const badgeTyp   = document.getElementById('f-badge-type').value;
    const orderVal   = document.getElementById('f-order').value;

    if (!name) { Toast.error('กรุณากรอกชื่อ Link'); return; }
    if (!url)  { Toast.error('กรุณากรอก URL'); return; }

    const openMode  = document.getElementById('f-open-mode').value;
    const payload = { name, url, section, subsection, icon, description: desc,
                      badge_text: badgeTxt, badge_type: badgeTyp, open_mode: openMode };
    if (orderVal !== '') payload.order = parseInt(orderVal);

    console.log('[saveLink] payload:', payload, '| editingId:', editingId);
    const btn = document.getElementById('modal-save-btn');
    btn.disabled = true; btn.textContent = 'Saving...';

    let res;
    if (editingId) {
      res = await API.links.update(editingId, payload);
    } else {
      res = await API.links.create(payload);
    }

    btn.disabled = false;
    btn.textContent = editingId ? 'Save Changes' : 'Save Link';

    console.log('[saveLink] response:', res);
    if (!res?.ok) {
      Toast.error(res?.data?.message || 'เกิดข้อผิดพลาด');
      return;
    }

    Toast.success(editingId ? 'แก้ไข Link เรียบร้อย' : 'เพิ่ม Link เรียบร้อย');
    closeModal('modal-link');

    // ถ้า section เปลี่ยน → switch ไปดู section ใหม่
    if (section !== currentSection) {
      const tab = document.querySelector(`.section-tab[data-section="${section}"]`);
      if (tab) switchSection(section, tab);
    } else {
      loadLinks();
    }
  }

  // ─── Delete modal ─────────────────────────────────────
  function openDeleteModal(id, name) {
    deletingId = id;
    document.getElementById('delete-link-name').textContent = name;
    openModal('modal-delete');
  }

  async function confirmDelete() {
    if (!deletingId) return;
    const res = await API.links.delete(deletingId);
    if (!res?.ok) { Toast.error(res?.data?.message || 'ลบไม่สำเร็จ'); return; }
    Toast.success('ลบ Link เรียบร้อย');
    closeModal('modal-delete');
    deletingId = null;
    loadLinks();
  }

  // ─── Close modal on overlay click ────────────────────
  document.querySelectorAll('.modal-overlay').forEach(el => {
    el.addEventListener('click', e => { if (e.target === el) closeModal(el.id); });
  });

  // ─── Keyboard: Enter to save, Esc to close ────────────
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && document.getElementById('modal-link').classList.contains('open')) {
      saveLink();
    }
    if (e.key === 'Escape') {
      ['modal-link','modal-delete'].forEach(id => closeModal(id));
    }
  });

  // ─── Initial load ─────────────────────────────────────
  loadLinks();
</script>
</body>
</html>
