<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Report — SOM-Portal</title>
  <link rel="icon" href="./favicon.ico" type="image/x-icon">
  <script src="./assets/js/theme.js"></script>
  <link rel="stylesheet" href="./assets/css/dark.css">
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="stylesheet" href="./assets/css/ui-themes.css">
  <link rel="stylesheet" href="./assets/css/enterprise-refine.css">
  
  <link rel="stylesheet" href="./assets/pages/weekly-report/weekly-report.css" data-page-css>
</head>
<body>

<div class="app-shell">
  <aside id="sidebar-mount"></aside>

  <div class="main-content">
    <header class="topbar">
      <div class="topbar-title">
        <div class="page-title"><i data-icon="bar-chart"></i> Weekly Report</div>
        <div class="page-sub">SM Team Operations Summary</div>
      </div>
      <div class="topbar-actions">
        <div class="week-switcher" data-core="1">
          <button class="week-arrow" id="prevWeek" title="Previous Week"><i data-icon="chevron-left"></i></button>
          <select class="week-select" id="weekSelect">
            <option value="">Loading weeks...</option>
          </select>
          <button class="week-arrow" id="nextWeek" title="Next Week"><i data-icon="play"></i></button>
        </div>
        <button class="nav-btn" id="analyticsBtn" title="Analytics Dashboard">
          <span><i data-icon="bar-chart"></i></span>
          <span>Analytics</span>
        </button>
        <button class="nav-btn" id="presentBtn" title="Presentation Mode">
          <span>🎥</span>
          <span>Present</span>
        </button>
        <a href="./weekly-report-form.html" class="btn btn-primary btn-sm" data-action="add">
          <span><i data-icon="plus"></i></span>
          <span>Add/Edit Data</span>
        </a>
      </div>
    </header>

    <main class="page-content">
      <!-- Stats Bar -->
      <div class="stats-bar">
        <div class="stat-card">
          <div class="stat-header">
            <div class="stat-icon"><i data-icon="alert-triangle"></i></div>
          </div>
          <div class="stat-value" id="statIncidents">0</div>
          <div class="stat-label">Total Incidents</div>
        </div>
        
        <div class="stat-card">
          <div class="stat-header">
            <div class="stat-icon"><i data-icon="package"></i></div>
          </div>
          <div class="stat-value" id="statBatch">0</div>
          <div class="stat-label">Batch Issues</div>
        </div>
        
        <div class="stat-card">
          <div class="stat-header">
            <div class="stat-icon"><i data-icon="users"></i></div>
          </div>
          <div class="stat-value" id="statSupport">0</div>
          <div class="stat-label">Support Tasks</div>
        </div>
        
        <div class="stat-card">
          <div class="stat-header">
            <div class="stat-icon"><i data-icon="bell"></i></div>
          </div>
          <div class="stat-value" id="statUpdates">0</div>
          <div class="stat-label">Updates & Alerts</div>
        </div>
      </div>

      <!-- Dashboard Grid -->
      <div class="dashboard-grid">
        <!-- Card 1: Incidents -->
        <div class="card">
          <div class="card-header">
            <div class="card-title">
              <span class="card-icon"><i data-icon="alert-triangle"></i></span>
              <span>Incidents Detected by SM</span>
            </div>
            <span class="card-badge" id="incidentsBadge">0</span>
          </div>
          <div class="card-body" id="incidentsBody">
            <div class="loading-overlay">
              <div class="spinner"></div>
            </div>
          </div>
        </div>

        <!-- Card 2: Updates (Tall) -->
        <div class="card">
          <div class="card-header">
            <div class="card-title">
              <span class="card-icon"><i data-icon="bell"></i></span>
              <span>Updates & Alerts</span>
            </div>
            <span class="card-badge" id="updatesBadge">0</span>
          </div>
          <div class="card-body" id="updatesBody">
            <div class="loading-overlay">
              <div class="spinner"></div>
            </div>
          </div>
        </div>

        <!-- Card 3: Support -->
        <div class="card">
          <div class="card-header">
            <div class="card-title">
              <span class="card-icon"><i data-icon="users"></i></span>
              <span>Part SM Support</span>
            </div>
            <span class="card-badge" id="supportBadge">0</span>
          </div>
          <div class="card-body" id="supportBody">
            <div class="loading-overlay">
              <div class="spinner"></div>
            </div>
          </div>
        </div>

        <!-- Card 4: Batch -->
        <div class="card">
          <div class="card-header">
            <div class="card-title">
              <span class="card-icon"><i data-icon="package"></i></span>
              <span>Batch - Issue</span>
            </div>
            <span class="card-badge" id="batchBadge">0</span>
          </div>
          <div class="card-body" id="batchBody">
            <div class="loading-overlay">
              <div class="spinner"></div>
            </div>
          </div>
        </div>

        <!-- Card 5: Improvements -->
        <div class="card">
          <div class="card-header">
            <div class="card-title">
              <span class="card-icon"><i data-icon="rocket"></i></span>
              <span>Improvement / Project</span>
            </div>
            <span class="card-badge" id="improvementsBadge">0</span>
          </div>
          <div class="card-body" id="improvementsBody">
            <div class="loading-overlay">
              <div class="spinner"></div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="./assets/js/utils.js"></script>
<script src="./assets/js/auth.js"></script>
<script src="./assets/js/api.js"></script>
<script src="./assets/js/layout.js"></script>
<script src="./assets/js/mobile-nav.js"></script>
<script src="./assets/js/maintenance.js"></script>
<script src="./assets/js/analytics.js"></script>
<script src="./assets/js/analytics-features.js"></script>
<script src="./assets/js/weekly-report/date-utils.js"></script>
<script src="./assets/js/weekly-report/api.js"></script>
<script src="./assets/js/weekly-report/analytics.js"></script>
<script src="./assets/js/weekly-report/presentation.js"></script>
<script src="./assets/js/weekly-report/dashboard.js"></script>
<script src="./assets/pages/weekly-report/weekly-report.js"></script>

</body>
</html>
