<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course — Learning — SOM-Portal</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <script src="assets/js/theme.js"></script>
  <link rel="stylesheet" href="assets/css/dark.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/ui-themes.css">
  <link rel="stylesheet" href="./assets/css/enterprise-refine.css">
  
  <link rel="stylesheet" href="./assets/pages/learn-course/learn-course.css" data-page-css>
</head>
<body>

<div class="app-shell">
  <aside id="sidebar-mount"></aside>

  <div class="main-content">
    <header class="topbar">
      <div class="topbar-title">
        <div class="page-title" id="top-title">Course</div>
        <div class="page-sub" id="top-sub">—</div>
      </div>
      <div class="topbar-actions">
        <a href="learn.html" class="btn btn-ghost btn-sm">← กลับไปรายการ course</a>
      </div>
    </header>

    <main class="page-content">

      <section id="hero" class="lc-hero" style="display:none">
        <div class="lc-hero-top">
          <div class="lc-hero-mark" id="hero-icon"><i data-icon="book"></i></div>
          <div style="flex:1; min-width:0">
            <h1 id="hero-title">—</h1>
            <p id="hero-desc">—</p>
          </div>
        </div>
        <div class="lc-hero-stats">
          <div class="lc-stat">
            <div class="n" id="stat-pct">0%</div>
            <div class="l">ความคืบหน้า</div>
          </div>
          <div class="lc-stat">
            <div class="n" id="stat-passed">0/0</div>
            <div class="l">Phase ผ่านแล้ว</div>
          </div>
          <div class="lc-hero-bar" id="hero-bar-wrap">
            <div id="hero-progress" style="width:0%"></div>
          </div>
        </div>
      </section>

      <div class="lc-section-label">
        Phases
        <span class="count" id="phase-count">·</span>
      </div>

      <div id="path" class="lc-timeline">
        <div data-skel="list" data-rows="5"></div>
      </div>

    </main>
  </div>
</div>

<script src="assets/js/utils.js"></script>
<script src="assets/js/skeletons.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/analytics.js"></script>
<script src="assets/js/analytics-features.js"></script>
<script src="assets/js/layout.js"></script>
<script src="./assets/js/mobile-nav.js"></script>
<script src="assets/js/maintenance.js"></script>
<script src="./assets/pages/learn-course/learn-course.js"></script>
</body>
</html>
