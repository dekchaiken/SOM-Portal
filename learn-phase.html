<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phase — Learning — SOM-Portal</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <script src="assets/js/theme.js"></script>
  <link rel="stylesheet" href="assets/css/dark.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/ui-themes.css">
  <link rel="stylesheet" href="./assets/css/enterprise-refine.css">
  
  <link rel="stylesheet" href="./assets/pages/learn-phase/learn-phase.css" data-page-css>
</head>
<body>

<div class="app-shell">
  <aside id="sidebar-mount"></aside>

  <div class="main-content">
    <header class="topbar">
      <div class="topbar-title">
        <div class="page-title" id="ph-title">กำลังโหลด...</div>
        <div class="page-sub" id="ph-sub">—</div>
      </div>
      <div class="topbar-actions">
        <a id="back-link" href="learn.html" class="btn btn-ghost btn-sm">← กลับ</a>
      </div>
    </header>

    <main class="page-content">

      <section id="header-box" class="lp-hero" style="display:none">
        <div class="lp-hero-mark" id="ph-icon"><i data-icon="book"></i></div>
        <div class="lp-hero-body">
          <div class="lp-hero-eyebrow" id="ph-eyebrow">Phase</div>
          <h1 id="ph-h1">—</h1>
          <p id="ph-desc">—</p>
        </div>
        <div class="lp-hero-status" id="ph-status-badge"></div>
      </section>

      <!-- Lessons View -->
      <div id="view-lessons">
        <div class="lp-layout">
          <aside>
            <div class="lp-nav">
              <div class="lp-nav-label">บทเรียน</div>
              <div id="lesson-nav-list"></div>
              <hr class="lp-nav-divider">
              <button class="lp-nav-cta" id="phase-cta" onclick="startQuiz()">
                <span id="phase-cta-label">ทำแบบฝึกหัด</span>
                <span style="font-weight:700">→</span>
              </button>
            </div>
          </aside>
          <div>
            <div id="lesson-container">
              <div class="lp-lesson"><div data-skel="text" data-rows="6"></div></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Quiz View -->
      <div id="view-quiz" style="display:none">
        <div class="lp-quiz-card">
          <div class="lp-quiz-head">
            <div>
              <div class="lp-quiz-eyebrow">Phase Quiz</div>
              <h2 id="quiz-title">Quiz</h2>
              <div class="lp-quiz-desc" id="quiz-desc"></div>
            </div>
            <button class="btn btn-ghost btn-sm" onclick="backToLessons()">← กลับไปอ่านบท</button>
          </div>
          <div id="quiz-questions"></div>
          <div class="lp-quiz-actions">
            <button class="btn btn-ghost" onclick="backToLessons()">ยกเลิก</button>
            <button class="lp-btn-primary" id="btn-submit" onclick="submitQuiz()">
              <span>ส่งคำตอบ</span>
              <span>→</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Result View -->
      <div id="view-result" style="display:none">
        <div class="lp-result">
          <div class="lp-result-banner" id="r-banner">
            <div class="lp-ring" id="r-ring"><span id="r-score">0<span class="pct">%</span></span></div>
            <div class="lp-result-status" id="r-status">—</div>
            <div class="lp-result-detail" id="r-detail">—</div>
          </div>

          <div class="lp-result-stats">
            <div class="lp-stat-cell"><div class="n" id="r-stat-score">0%</div><div class="l">คะแนนรอบนี้</div></div>
            <div class="lp-stat-cell"><div class="n" id="r-stat-best">0%</div><div class="l">ดีสุด</div></div>
            <div class="lp-stat-cell"><div class="n" id="r-stat-correct">0/0</div><div class="l">ตอบถูก</div></div>
            <div class="lp-stat-cell"><div class="n" id="r-stat-attempts">0</div><div class="l">ครั้งที่ทำ</div></div>
          </div>

          <div class="lp-result-body">
            <div class="lp-result-section-label">รายข้อ</div>
            <div id="r-summary"></div>
            <div id="r-tip"></div>
          </div>

          <div class="lp-result-actions">
            <button class="btn btn-ghost" id="r-retry" onclick="retryQuiz()">ลองทำใหม่</button>
            <a id="r-back" href="learn.html" class="btn btn-ghost">กลับไปคอร์ส</a>
            <button class="lp-btn-primary" id="r-next" onclick="goNext()" style="display:none">
              <span>ไป Phase ถัดไป</span>
              <span>→</span>
            </button>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="assets/js/utils.js"></script>
<script src="assets/js/skeletons.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/analytics.js"></script>
<script src="assets/js/analytics-features.js"></script>
<script src="assets/js/layout.js"></script>
<script src="./assets/js/mobile-nav.js"></script>
<script src="assets/js/maintenance.js"></script>
<script src="./assets/pages/learn-phase/learn-phase.js"></script>
</body>
</html>
