<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cron Builder — SOM-Portal</title>
<link rel="icon" href="favicon.ico" type="image/x-icon">
<!-- Embed mode: must run before CSS loads to prevent sidebar flash -->
<script>if(location.search.includes('embed'))document.documentElement.classList.add('cb-embed');</script>
<script src="assets/js/theme.js"></script>
<link rel="stylesheet" href="assets/css/dark.css">
<link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/ui-themes.css">
  <link rel="stylesheet" href="./assets/css/enterprise-refine.css">

  <link rel="stylesheet" href="./assets/pages/cron-builder/cron-builder.css" data-page-css>
</head>
<body>
<div class="app-shell">
  <aside id="sidebar-mount"></aside>
  <div class="main-content">
    <header class="topbar">
      <div class="topbar-title">
        <div class="topbar-title-left">
          <div class="page-title">⧗ Cron Builder</div>
          <div class="page-sub">Quartz Cron Expression Generator · 7 fields</div>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-ghost btn-sm" id="cb-reset-btn" style="font-size:11px">↺ Reset</button>
      </div>
    </header>

    <main class="page-content">
      <div class="cb-wrap">

        <!-- Builder -->
        <div class="cb-card">
          <div class="cb-tabs" id="cb-tabs">
            <div class="cb-tab active" data-tab="seconds">Seconds</div>
            <div class="cb-tab" data-tab="minutes">Minutes</div>
            <div class="cb-tab" data-tab="hours">Hours</div>
            <div class="cb-tab" data-tab="dom">Day</div>
            <div class="cb-tab" data-tab="month">Month</div>
            <div class="cb-tab" data-tab="year">Year</div>
          </div>
          <div id="panel-seconds" class="cb-panel"></div>
          <div id="panel-minutes" class="cb-panel" style="display:none"></div>
          <div id="panel-hours"   class="cb-panel" style="display:none"></div>
          <div id="panel-dom"     class="cb-panel" style="display:none"></div>
          <div id="panel-month"   class="cb-panel" style="display:none"></div>
          <div id="panel-year"    class="cb-panel" style="display:none"></div>
        </div>

        <!-- Output -->
        <div class="cb-output-card">
          <div class="cb-output-title">— Cron Expression —</div>
          <div class="cb-expr-row">
            <div class="cb-expr" id="cb-expr"></div>
            <button class="cb-copy-btn" id="cb-copy-btn">Copy</button>
          </div>
          <div class="cb-desc" id="cb-desc"></div>
        </div>

        <!-- Breakdown -->
        <div class="cb-breakdown">
          <table class="cb-bk-tbl">
            <thead>
              <tr>
                <th>Seconds</th>
                <th>Minutes</th>
                <th>Hours</th>
                <th>Day Of Month</th>
                <th>Month</th>
                <th>Day Of Week</th>
                <th>Year</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td id="bk-seconds"></td>
                <td id="bk-minutes"></td>
                <td id="bk-hours"></td>
                <td id="bk-dom"></td>
                <td id="bk-month"></td>
                <td id="bk-dow" class="muted">?</td>
                <td id="bk-year"></td>
              </tr>
            </tbody>
          </table>
        </div>

      </div>
    </main>
  </div>
</div>

<script src="assets/js/utils.js"></script>
<script src="assets/js/skeletons.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/csrf.js"></script>
<script src="assets/js/analytics.js"></script>
<script src="assets/js/analytics-features.js"></script>
<script src="assets/js/layout.js"></script>
<script src="./assets/js/mobile-nav.js"></script>
<script src="assets/js/maintenance.js"></script>
<script src="./assets/pages/cron-builder/cron-builder.js"></script>
</body>
</html>
